function c7_intro(){
  stage.innerHTML=`<div class="card"><h2>From a curve to a surface</h2>
    <p>Everything so far had <em>one</em> input, so its graph was a curve. Now let a function take <em>two</em>: $f(x,y)$ assigns a <b>height</b> to each point $(x,y)$ of the flat plane. Sweep over the whole plane and those heights trace out a <b>surface</b> — a landscape of hills and valleys hanging over the floor.</p>
    <p>A phone screen is flat, so we also draw the landscape the way a hiker's map does: looking straight down, with a <b>contour line</b> drawn through all the points at each chosen height. Below, the same hill $f(x,y)=9-x^2-y^2$ is shown both ways — the 3-D surface on the left, its contour map on the right. <b>Drag the dot on the map</b> and watch its twin climb the hill; the box reports the height there.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">point (x, y)</div><div class="v" id="pv">—</div></div><div class="rdc"><div class="k">height f(x, y)</div><div class="v" id="hv">—</div></div><div class="rdc"><div class="k">this contour ring</div><div class="v" id="rv">—</div></div></div>
    <div class="task"><b>Read a height off the map</b>Every point on one ring sits at the same height. Drag the dot onto $(2,1)$ — whole-number points are magnetic, so it snaps there — or just evaluate $f=9-x^2-y^2$. What height is that ring?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>What you're looking at.</b> Three ideas, and we'll lean on all of them for the rest of the module:</p>
    <p>&bull; <b>The surface</b> is the graph of $f$: above each floor point $(x,y)$ you go up to height $z=f(x,y)$. Here $f=9-x^2-y^2$ is a single hill, peaking at $9$ over the origin and sloping down in every direction.</p>
    <p>&bull; <b>A contour line (level curve)</b> is the set of floor points sharing one height, $f(x,y)=c$. Drag the dot around a single ring and the height readout doesn't budge — that's the definition. For this hill, "$9-x^2-y^2=c$" rearranges to $x^2+y^2=9-c$, a circle, so the contours are rings centered on the peak.</p>
    <p>&bull; <b>Spacing reads the steepness.</b> Where rings bunch up close, the ground is dropping fast between them (steep); where they spread apart, it's gentle. A contour map encodes the whole surface's shape in flat ink — and the rest of this module is about measuring slope and, later, accumulating volume on exactly this kind of landscape.</p>
    <p>Next we'll stop eyeballing steepness and measure it — but with two directions to move in, "the slope" first has to be split into one direction at a time.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const f=(x,y)=>9-x*x-y*y;
  // left: 3D surface
  const PL=(x,y,z)=>[158+(x-y)*22, 250+(x+y)*7 - Math.max(0,z)*10];
  // right: contour map
  const SR=38,cxR=482,cyR=186;
  const pxR=x=>cxR+x*SR, pyR=y=>cyR-y*SR, mxR=X=>(X-cxR)/SR, myR=Y=>(cyR-Y)/SR;
  const LO=[26,46,74],HI=[232,184,75];
  const col=(z)=>{const t=Math.max(0,Math.min(1,z/9));return 'rgb('+Math.round(LO[0]+(HI[0]-LO[0])*t)+','+Math.round(LO[1]+(HI[1]-LO[1])*t)+','+Math.round(LO[2]+(HI[2]-LO[2])*t)+')';};
  let xp=2,yp=1;
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    // ---- left: shaded 3D hill ----
    ctx.fillStyle='#7f93a8';ctx.font='12px sans-serif';ctx.fillText('the surface',22,24);
    const N=13,a=3,quads=[];
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){const X0=-a+2*a*i/N,X1=-a+2*a*(i+1)/N,Y0=-a+2*a*j/N,Y1=-a+2*a*(j+1)/N;
      const zc=Math.max(0,0.25*(f(X0,Y0)+f(X1,Y0)+f(X1,Y1)+f(X0,Y1)));quads.push({p:[[X0,Y0],[X1,Y0],[X1,Y1],[X0,Y1]],z:zc,d:X0+X1+Y0+Y1});}
    quads.sort((u,v)=>u.d-v.d);
    for(const q of quads){ctx.beginPath();q.p.forEach((pt,k)=>{const pr=PL(pt[0],pt[1],f(pt[0],pt[1]));k?ctx.lineTo(pr[0],pr[1]):ctx.moveTo(pr[0],pr[1]);});ctx.closePath();
      ctx.fillStyle=col(q.z);ctx.globalAlpha=0.92;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='rgba(12,18,28,0.45)';ctx.lineWidth=1;ctx.stroke();}
    const mk=PL(xp,yp,f(xp,yp));ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mk[0],mk[1],5,0,7);ctx.fill();ctx.stroke();
    const base=PL(xp,yp,0);ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(base[0],base[1]);ctx.lineTo(mk[0],mk[1]);ctx.stroke();ctx.setLineDash([]);
    // divider
    ctx.strokeStyle='#1c2838';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(322,10);ctx.lineTo(322,370);ctx.stroke();
    // ---- right: contour map ----
    ctx.fillStyle='#7f93a8';ctx.fillText('contour map — drag the dot',338,24);
    for(let X=332;X<632;X+=9)for(let Y=34;Y<360;Y+=9){const x=mxR(X+4),y=myR(Y+4);if(Math.abs(x)<=3&&Math.abs(y)<=3){ctx.fillStyle=col(f(x,y));ctx.fillRect(X,Y,9,9);}}
    for(const h of [1,3,5,7]){const r=Math.sqrt(9-h);ctx.strokeStyle='rgba(220,230,244,0.55)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=72;i++){const t=i/72*2*Math.PI;const X=pxR(r*Math.cos(t)),Y=pyR(r*Math.sin(t));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();
      ctx.fillStyle='#c6d2e2';ctx.font='10px sans-serif';ctx.fillText(h+'',pxR(r)+2,pyR(0)-2);}
    const fp=f(xp,yp);if(fp>0){const r=Math.sqrt(9-fp);ctx.strokeStyle='#e8b84b';ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=72;i++){const t=i/72*2*Math.PI;const X=pxR(r*Math.cos(t)),Y=pyR(r*Math.sin(t));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();}
    const P=[pxR(xp),pyR(yp)];ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P[0],P[1],6,0,7);ctx.fill();ctx.stroke();
    document.getElementById('pv').textContent='('+xp.toFixed(1)+', '+yp.toFixed(1)+')';
    document.getElementById('hv').textContent=fp.toFixed(2);
    document.getElementById('rv').textContent=fp>0?('all points at height '+fp.toFixed(2)):'below the hill';}
  cv.style.touchAction='none';let drg=false;
  const snap=v=>{const q=Math.round(v);return Math.abs(v-q)<0.14?q:v;};
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width)),Y=(e.clientY-r.top)*(H/Math.max(1,r.height));xp=Math.max(-3,Math.min(3,snap(mxR(X))));yp=Math.max(-3,Math.min(3,snap(myR(Y))));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),4,()=>{addReveal(`<div class="rh">✓ height 4</div><p>$f(2,1)=9-2^2-1^2=9-4-1=4$. That whole ring — $x^2+y^2=5$ — sits at height $4$; drag the dot around it and the height readout stays pinned at $4$, which is exactly what a contour line means. Step inward to tighter rings and the height climbs toward the peak at $9$; step outward and it falls to the ground.</p>`);});
  setHints([`A ring is all the points at one height. Just compute f(2,1)=9−x²−y².`,`9 − 4 − 1 = 4.`]);
}

function c7_partials(){
  stage.innerHTML=`<div class="card"><h2>Partial derivatives: slope one direction at a time</h2>
    <p>On a curve there was just one way to move, so "the slope" meant one thing. On a surface you can head in infinitely many directions, and the steepness is different in each. The fix is to start simple: pin down the slope along the two axis directions, one at a time. That's a <b>partial derivative</b>.</p>
    <p>The trick is <b>slicing</b>. To find the slope in the $x$-direction, hold $y$ fixed at some value — that cuts the surface with a vertical plane and exposes a single curve (a <em>trace</em>). The slope of that ordinary 1-D curve <em>is</em> the partial derivative $\\partial f/\\partial x$. Below, the surface is $f(x,y)=x^2+xy$; the gold plane makes the cut, and the right panel shows the exposed trace with its tangent. Tap to choose which variable to freeze, and drag to slide the point along the cut.</p>
    <div class="seg" id="seg"></div>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k" id="hk">holding —</div><div class="v" id="pv">—</div></div><div class="rdc"><div class="k" id="slk">slope of the trace</div><div class="v" id="sv">—</div></div></div>
    <div class="task"><b>Compute a partial</b>For $f(x,y)=x^2+xy$, find $\\dfrac{\\partial f}{\\partial x}$ at the point $(x,y)=(1,2)$ (hold $y=2$, slide to $x=1$).</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>How to actually compute one.</b> A partial derivative is just an ordinary derivative taken with the <em>other</em> variable treated as a frozen constant. Straight from the limit definition, nudging only $x$ and leaving $y$ alone:</p>
    <div class="eqbox">$$\\frac{\\partial f}{\\partial x}=\\lim_{h\\to0}\\frac{f(x+h,\\,y)-f(x,\\,y)}{h}.$$</div>
    <p>Apply it to $f=x^2+xy$. Holding $y$ constant, $x^2$ differentiates to $2x$, and $xy$ — a constant ($y$) times $x$ — differentiates to $y$. Freezing $x$ instead, $x^2$ is now a constant (gone) and $xy$ gives $x$:</p>
    <div class="eqbox">$$\\frac{\\partial f}{\\partial x}=2x+y,\\qquad \\frac{\\partial f}{\\partial y}=x.$$</div>
    <p>At $(1,2)$: $\\ \\partial f/\\partial x = 2(1)+2 = 4$. Two things worth pausing on:</p>
    <p>&bull; <b>A partial is itself a function.</b> $\\partial f/\\partial x = 2x+y$ still depends on where you stand — the $x$-slope at $(1,2)$ is $4$, but at $(0,0)$ it's $0$. Slide the point on the gold trace and watch the tangent tilt.</p>
    <p>&bull; <b>Don't confuse the trace with its slope.</b> Switch to "hold $x=1$": the exposed trace is a straight slanted line, and the partial $\\partial f/\\partial y$ is the single number that is its slope — here $x=1$, the same all along the line. The curve is the cross-section; the derivative is just how steep it is.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const f=(x,y)=>x*x+x*y, fx=(x,y)=>2*x+y, fy=(x,y)=>x;
  const PL=(x,y,z)=>[150+(x-y)*23, 238+(x+y)*6 - z*6.3];
  let mode='y', pa=1, pb=2;           // pa = x-position (mode y); pb = y-position (mode x)
  function poly(pts,fill,stroke,w){if(!ctx)return;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||1;ctx.stroke();}}
  function pathPts(pts,color,w){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=w||1;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#7f93a8';ctx.font='12px sans-serif';ctx.fillText('the surface z = x² + xy',16,22);
    // wireframe surface
    const G=8;
    for(let gi=0;gi<=G;gi++){const yv=-3+6*gi/G;const row=[];for(let k=0;k<=24;k++){const x=-3+6*k/24;row.push(PL(x,yv,f(x,yv)));}pathPts(row,'#26384f',1);}
    for(let gi=0;gi<=G;gi++){const xv=-3+6*gi/G;const row=[];for(let k=0;k<=24;k++){const y=-3+6*k/24;row.push(PL(xv,y,f(xv,y)));}pathPts(row,'#26384f',1);}
    // slice
    const zf=-4,zt=20;
    if(mode==='y'){const y0=2;
      poly([PL(-3,y0,zf),PL(3,y0,zf),PL(3,y0,zt),PL(-3,y0,zt)],'rgba(232,184,75,0.10)','rgba(232,184,75,0.35)',1);
      const tr=[];for(let k=0;k<=48;k++){const x=-3+6*k/48;tr.push(PL(x,y0,f(x,y0)));}pathPts(tr,'#e8b84b',2.6);
      const a=pa,z=f(a,y0),m=fx(a,y0);
      pathPts([PL(a-1.3,y0,z-m*1.3),PL(a+1.3,y0,z+m*1.3)],'#7ab8ff',2.4);
      const d=PL(a,y0,z);ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d[0],d[1],5,0,7);ctx.fill();ctx.stroke();
    } else {const x0=1;
      poly([PL(x0,-3,zf),PL(x0,3,zf),PL(x0,3,zt),PL(x0,-3,zt)],'rgba(232,184,75,0.10)','rgba(232,184,75,0.35)',1);
      const tr=[];for(let k=0;k<=48;k++){const y=-3+6*k/48;tr.push(PL(x0,y,f(x0,y)));}pathPts(tr,'#e8b84b',2.6);
      const b=pb,z=f(x0,b),m=fy(x0,b);
      pathPts([PL(x0,b-1.3,z-m*1.3),PL(x0,b+1.3,z+m*1.3)],'#7ab8ff',2.4);
      const d=PL(x0,b,z);ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(d[0],d[1],5,0,7);ctx.fill();ctx.stroke();}
    // divider
    ctx.strokeStyle='#1c2838';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(322,8);ctx.lineTo(322,372);ctx.stroke();
    // right: 2D trace
    const freeLabel=mode==='y'?'x':'y';
    ctx.fillStyle='#7f93a8';ctx.fillText('the trace (a 1-D curve in '+freeLabel+')',334,22);
    const tr=t=> mode==='y'? f(t,2): f(1,t);
    const pt= mode==='y'? pa: pb;
    const sl= mode==='y'? fx(pa,2): fy(1,pb);
    let zmin=1e9,zmax=-1e9;for(let i=0;i<=48;i++){const v=tr(-3+6*i/48);if(v<zmin)zmin=v;if(v>zmax)zmax=v;}
    const pad=(zmax-zmin)*0.18+0.6;zmin-=pad;zmax+=pad;
    const RX=t=>344+(t+3)/6*280, RZ=z=>352-(z-zmin)/(zmax-zmin)*318;
    // axes
    ctx.strokeStyle='#243347';ctx.lineWidth=1;ctx.strokeRect(344,34,280,318);
    if(zmin<0&&zmax>0){ctx.strokeStyle='#2b3a4f';ctx.beginPath();ctx.moveTo(344,RZ(0));ctx.lineTo(624,RZ(0));ctx.stroke();}
    if(0>=-3&&0<=3){ctx.strokeStyle='#2b3a4f';ctx.beginPath();ctx.moveTo(RX(0),34);ctx.lineTo(RX(0),352);ctx.stroke();}
    // trace curve
    const cpts=[];for(let i=0;i<=120;i++){const t=-3+6*i/120;cpts.push([RX(t),RZ(tr(t))]);}pathPts(cpts,'#e8b84b',2.6);
    // tangent
    const z0=tr(pt);pathPts([[RX(pt-2),RZ(z0-sl*2)],[RX(pt+2),RZ(z0+sl*2)]],'#7ab8ff',2);
    const dd=[RX(pt),RZ(z0)];ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(dd[0],dd[1],5,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#5d7186';ctx.font='11px sans-serif';ctx.fillText(freeLabel,616,RZ(0)-4>40?RZ(0)-4:48);
    // readouts
    const xx= mode==='y'?pa:1, yy= mode==='y'?2:pb;
    document.getElementById('hk').textContent= mode==='y'?'holding y = 2':'holding x = 1';
    document.getElementById('pv').textContent='('+xx.toFixed(1)+', '+yy.toFixed(1)+')';
    document.getElementById('slk').textContent= mode==='y'?'slope = ∂f/∂x':'slope = ∂f/∂y';
    document.getElementById('sv').textContent=sl.toFixed(2);}
  function build(){document.getElementById('seg').innerHTML=
    `<span class="segb ${mode==='y'?'on':''}" data-m="y">hold y = 2 (slope in x)</span><span class="segb ${mode==='x'?'on':''}" data-m="x">hold x = 1 (slope in y)</span>`;
    document.querySelectorAll('#seg .segb').forEach(b=>b.onclick=()=>{mode=b.dataset.m;build();draw();});}
  cv.style.touchAction='none';let drg=false;
  const snap=v=>{const q=Math.round(v);return Math.abs(v-q)<0.14?q:v;};
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));let t=Math.max(-3,Math.min(3,snap(X/W*6-3)));if(mode==='y')pa=t;else pb=t;draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  build();draw();
  numChk(stage.querySelector('.card'),4,()=>{addReveal(`<div class="rh">✓ ∂f/∂x = 4</div><p>Holding $y=2$, the trace is $z=x^2+2x$; its slope is $2x+2$, which at $x=1$ is $4$. That's $\\partial f/\\partial x = 2x+y$ evaluated at $(1,2)$. Slide the point and the blue tangent tilts — the $x$-slope genuinely changes from place to place. Flip to "hold $x=1$" and the trace becomes a straight line of slope $1$: that constant is $\\partial f/\\partial y = x$.</p>`);});
  setHints([`Hold y fixed, differentiate x²+xy in x: that's 2x+y. Then plug in (1,2).`,`2(1)+2 = 4.`]);
}

function c7_tangentplane(){
  stage.innerHTML=`<div class="card"><h2>The tangent plane: zooming in until the surface looks flat</h2>
    <p>Here's the idea the whole module quietly runs on. Take a smooth curve and zoom in on a point: it looks straighter and straighter, until up close it's indistinguishable from its <b>tangent line</b>. A surface does the same thing one dimension up — zoom in on a point and the hills flatten into a single <b>tangent plane</b>. "Smooth" just means this works: up close, the surface <em>is</em> a flat plane.</p>
    <p>Below is $f(x,y)=x^2+xy$ near the point $P=(1,2)$. The <span class="cy">blue plane</span> is the tangent plane there; the <span style="color:#e8b84b">gold mesh</span> is the real surface. <b>Drag to zoom in</b> toward $P$ and watch the mesh settle onto the plane — the "largest gap" readout melts toward zero.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">zoom</div><div class="v" id="zm">—</div></div><div class="rdc"><div class="k">window radius</div><div class="v" id="rr">—</div></div><div class="rdc"><div class="k">largest gap (surface − plane)</div><div class="v" id="gp">—</div></div></div>
    <div class="task"><b>Use the plane as a shortcut</b>At $P=(1,2)$: $f=3$, $f_x=2x+y=4$, $f_y=x=1$. Use the tangent plane $L=f+f_x\\,\\Delta x+f_y\\,\\Delta y$ to estimate $f(1.1,\\,2)$.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>From one dimension to two.</b> In 1-D, "zoom in → looks like a line" gave the tangent-line approximation $f(x)\\approx f(a)+f'(a)(x-a)$. In 2-D, "zoom in → looks like a plane" gives the same thing with a slope in <em>each</em> direction — and those two slopes are exactly the partials from the last beat:</p>
    <div class="eqbox">$z=\\underbrace{f(x_0,y_0)}_{\\text{height at }P}+\\underbrace{f_x(x_0,y_0)\\,(x-x_0)}_{\\text{climb from the }x\\text{-slope}}+\\underbrace{f_y(x_0,y_0)\\,(y-y_0)}_{\\text{climb from the }y\\text{-slope}}.$</div>
    <p>Read it as a recipe: start at the height $f(P)$; step $\\Delta x$ and you climb $f_x\\,\\Delta x$; step $\\Delta y$ and you climb $f_y\\,\\Delta y$; the two climbs just <b>add</b>. For our surface at $P=(1,2)$, with $f(P)=3$, $f_x=4$, $f_y=1$:</p>
    <div class="eqbox">$L(x,y)=3+4(x-1)+1(y-2).$</div>
    <p><b>This is the linear approximation.</b> Near $P$, the real $f$ and this flat $L$ agree: $f(x,y)\\approx L(x,y)$, and the gap shrinks <em>faster</em> than your distance from $P$ (that vanishing gap is precisely what we mean by "differentiable," our smoothness floor). Because this surface curves upward, the flat plane sits just below it, so $L$ slightly <em>under</em>-estimates — exactly the tiny gap you watched collapse as you zoomed.</p>
    <p><b>The one idea to carry forward.</b> Moving $\\Delta x$ and $\\Delta y$, the height changes <b>add</b> — each direction contributes (its slope) $\\times$ (its step). That single fact is the whole foundation of the next two beats: the directional derivative reads this plane's slope in a chosen direction, and the chain rule threads rates of change through this same linear sum.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const f=(x,y)=>x*x+x*y;const x0=1,y0=2,fP=f(x0,y0),fx=2*x0+y0,fy=x0;
  const cx=320,cy=212,WX=132,WY=33,WZ=16;
  const PL=(u,v,zz)=>[cx+(u-v)*WX, cy+(u+v)*WY - zz*WZ];
  let r=1.6;
  function surfZ(u,v){return (f(x0+u*r,y0+v*r)-fP)/r;}
  function planeZ(u,v){return (fx*(u*r)+fy*(v*r))/r;}
  function pathPts(pts,color,w,dash){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=w||1;if(dash)ctx.setLineDash(dash);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    // tangent plane quad
    const C=[PL(-1,-1,planeZ(-1,-1)),PL(1,-1,planeZ(1,-1)),PL(1,1,planeZ(1,1)),PL(-1,1,planeZ(-1,1))];
    ctx.beginPath();C.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
    ctx.fillStyle='rgba(122,184,255,0.16)';ctx.fill();ctx.strokeStyle='rgba(122,184,255,0.55)';ctx.lineWidth=1.5;ctx.stroke();
    // surface wireframe
    const G=10;
    for(let i=0;i<=G;i++){const u=-1+2*i/G;const row=[];for(let k=0;k<=30;k++){const v=-1+2*k/30;row.push(PL(u,v,surfZ(u,v)));}pathPts(row,'rgba(232,184,75,0.85)',1);}

    for(let i=0;i<=12;i++)for(let j=0;j<=12;j++){const u=-1+2*i/12,v=-1+2*j/12;const g=Math.abs(f(x0+u*r,y0+v*r)-(fP+fx*u*r+fy*v*r));if(g>maxgap)maxgap=g;}

function c7_gradient(){
  stage.innerHTML=`<div class="card"><h2>The gradient: assembling the slopes into an arrow</h2>
    <p>You now have two separate slopes at every point — $f_x$ (steepness heading east) and $f_y$ (steepness heading north). Bundle them into a single vector and something remarkable falls out. That vector is the <b>gradient</b>:</p>
    <div class="eqbox">$$\\nabla f=\\Big(\\frac{\\partial f}{\\partial x},\\ \\frac{\\partial f}{\\partial y}\\Big).$$</div>
    <p><b>It's the 1-D derivative, upgraded to a direction.</b> In one variable the derivative $f'(x)$ is a single number — and its <em>sign</em> already encodes a direction: with only two ways to move, you step right to climb when $f'&gt;0$ and left when $f'&lt;0$, while $|f'|$ says how steep. With two inputs, each partial plays that role for its own axis — $f_x$ says which way along $x$ is uphill, $f_y$ which way along $y$ — and the gradient just stacks them into one arrow. Its direction is the single combined uphill heading, and its length $|\\nabla f|$ is the steepness, exactly as $|f'|$ was in one dimension.</p>
    <p><b>Three things not to confuse.</b> The gradient is an arrow on the <b>flat input map</b> — not an arrow on the 3-D surface. The figure below separates the three objects for the bowl $f=x^2+y^2$:</p>
    <canvas id="cvg" width="640" height="300"></canvas>
    <p class="small" style="margin-top:4px;color:#9fb0c4">The <span style="color:#caa64e">surface</span> (graph) lives up in 3-D. Slice it at one height and that slice drops to a <span class="cy">level curve</span> on the floor — a contour. The <span class="grn">gradient</span> is an arrow lying <em>on the floor</em>, pointing straight across that contour. And the <span style="color:#e8b84b">steepest climb on the surface</span> (the tilted arrow) is the thing whose <em>shadow</em> on the floor is exactly the gradient — the gradient itself never leaves the floor.</p>
    <p>Now here's that same bowl seen from directly above, as a contour map (dark = low, bright = high). <b>Drag the point</b> and watch its gradient arrow: it always points <em>straight across the rings toward higher ground</em>, and it's <em>longer where the rings bunch up</em>.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">point (x, y)</div><div class="v" id="pv">—</div></div><div class="rdc"><div class="k">∇f = (2x, 2y)</div><div class="v" id="gv">—</div></div><div class="rdc"><div class="k">steepest slope |∇f|</div><div class="v" id="mv">—</div></div></div>
    <div class="task"><b>How steep is the steepest climb?</b>For $f=x^2+y^2$, $\\nabla f=(2x,2y)$. At the point $(3,4)$, compute the magnitude $|\\nabla f|=\\sqrt{f_x^{\\,2}+f_y^{\\,2}}$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Where the magic comes from.</b> Recall the one fact from the tangent-plane beat: a small step $(\\Delta x,\\Delta y)$ changes the height by $f_x\\,\\Delta x+f_y\\,\\Delta y$. That sum <em>is</em> a dot product with the gradient:</p>
    <div class="eqbox">$$\\Delta f\\;\\approx\\;\\nabla f\\cdot(\\Delta x,\\Delta y).$$</div>
    <p>Two consequences drop straight out of that one line:</p>
    <p>&bull; <b>Perpendicular to the contours.</b> Walk <em>along</em> a contour and your height doesn't change, so $\\Delta f=0$, which means $\\nabla f\\cdot(\\text{step along the contour})=0$. A zero dot product means a right angle — so the gradient is perpendicular to the level curve it sits on.</p>
    <p>&bull; <b>Steepest ascent, and how steep.</b> For a step of fixed length, the dot product $\\nabla f\\cdot(\\text{step})$ is largest when the step points the <em>same way</em> as $\\nabla f$. So the gradient's direction is the steepest-uphill direction, and its length $|\\nabla f|$ is exactly how steep that best climb is — which is why the arrow stretches where the rings crowd together (steep) and shrinks where they spread out (gentle).</p>
    <p>For our bowl, $\\nabla f=(2x,2y)$ points radially outward, straight away from the low point — the fastest way up the wall. At $(3,4)$ it's $(6,8)$, with $|\\nabla f|=\\sqrt{36+64}=10$. Next we'll ask not just for the steepest direction but for the slope in <em>any</em> direction — and the gradient will answer that too.</p></div>`;
  // ---------- 3-D clarifier: graph vs level curve vs gradient ----------
  (function(){const gc=document.getElementById('cvg');const g=gc&&gc.getContext&&gc.getContext('2d');if(!g)return;const GW=gc.width,GH=gc.height;
    const CX=320,CY=212,SX=60,SY=20,SZ=12.5;
    const PP=p=>[CX+(p[0]-p[1])*SX, CY+(p[0]+p[1])*SY - p[2]*SZ];
    const gf=(x,y)=>x*x+y*y;const r0=Math.SQRT2,A=0.62;
    g.clearRect(0,0,GW,GH);
    g.strokeStyle='#5aa0e0';g.lineWidth=1.5;g.setLineDash([5,4]);g.beginPath();for(let i=0;i<=64;i++){const t=i/64*2*Math.PI;const q=PP([r0*Math.cos(t),r0*Math.sin(t),0]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}g.stroke();g.setLineDash([]);
    g.strokeStyle='rgba(232,184,75,0.45)';g.lineWidth=1;
    for(let gx=-2;gx<=2.001;gx+=0.5){g.beginPath();let s=false;for(let y=-2;y<=2.001;y+=0.1){const q=PP([gx,y,gf(gx,y)]);s?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);s=true;}g.stroke();}
    for(let gy=-2;gy<=2.001;gy+=0.5){g.beginPath();let s=false;for(let x=-2;x<=2.001;x+=0.1){const q=PP([x,gy,gf(x,gy)]);s?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);s=true;}g.stroke();}
    g.strokeStyle='#7ab8ff';g.lineWidth=2;g.beginPath();for(let i=0;i<=64;i++){const t=i/64*2*Math.PI;const q=PP([r0*Math.cos(t),r0*Math.sin(t),r0*r0]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}g.stroke();
    const fx=r0*Math.cos(A),fy=r0*Math.sin(A),F=[fx,fy,0],Ssf=[fx,fy,r0*r0],Fp=PP(F),Sp=PP(Ssf);
    g.strokeStyle='rgba(220,230,244,0.4)';g.lineWidth=1;g.setLineDash([3,3]);g.beginPath();g.moveTo(Fp[0],Fp[1]);g.lineTo(Sp[0],Sp[1]);g.stroke();g.setLineDash([]);
    function garrow(a,b,col){const Aa=PP(a),Bb=PP(b);g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();g.moveTo(Aa[0],Aa[1]);g.lineTo(Bb[0],Bb[1]);g.stroke();const an=Math.atan2(Bb[1]-Aa[1],Bb[0]-Aa[0]);g.fillStyle=col;g.beginPath();g.moveTo(Bb[0],Bb[1]);g.lineTo(Bb[0]-10*Math.cos(an-0.4),Bb[1]-10*Math.sin(an-0.4));g.lineTo(Bb[0]-10*Math.cos(an+0.4),Bb[1]-10*Math.sin(an+0.4));g.closePath();g.fill();}
    const ur=[Math.cos(A),Math.sin(A)];
    garrow(F,[fx+ur[0]*1.25,fy+ur[1]*1.25,0],'#3fb98f');
    const d=[Math.cos(A),Math.sin(A),2*r0],dl=Math.hypot(d[0],d[1],d[2]),sc=1.5;
    garrow(Ssf,[fx+d[0]/dl*sc,fy+d[1]/dl*sc,r0*r0+d[2]/dl*sc],'#e8b84b');
    g.fillStyle='#fff';g.strokeStyle='#0a111b';g.lineWidth=2;g.beginPath();g.arc(Fp[0],Fp[1],4,0,7);g.fill();g.stroke();g.beginPath();g.arc(Sp[0],Sp[1],4,0,7);g.fill();g.stroke();
    g.font='12px sans-serif';
    g.fillStyle='#caa64e';const lg=PP([-2,2,gf(-2,2)]);g.fillText('graph  z = x²+y²',lg[0]-6,lg[1]-6);
    g.fillStyle='#5aa0e0';const lc=PP([-r0*Math.cos(A),-r0*Math.sin(A),0]);g.fillText('level curve (floor)',lc[0]-70,lc[1]+14);
    g.fillStyle='#3fb98f';const gt=PP([fx+ur[0]*1.25,fy+ur[1]*1.25,0]);g.fillText('∇f (on the floor)',gt[0]+4,gt[1]+12);
    g.fillStyle='#e8b84b';const st=PP([fx+d[0]/dl*sc,fy+d[1]/dl*sc,r0*r0+d[2]/dl*sc]);g.fillText('steepest climb (on surface)',st[0]-70,st[1]-6);})();
  // ---------- main interactive: contour map ----------
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=27,cx=W/2,cy=H/2;
  const f=(x,y)=>x*x+y*y;
  const px=x=>cx+x*S,py=y=>cy-y*S,mx=X=>(X-cx)/S,my=Y=>(cy-Y)/S;
  const LO=[18,30,48],HI=[232,184,75];
  const col=z=>{const t=Math.max(0,Math.min(1,z/45));return 'rgb('+Math.round(LO[0]+(HI[0]-LO[0])*t)+','+Math.round(LO[1]+(HI[1]-LO[1])*t)+','+Math.round(LO[2]+(HI[2]-LO[2])*t)+')';};
  let xp=3,yp=4;
  function arrow(X0,Y0,X1,Y1,col){if(!ctx)return;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.stroke();const a=Math.atan2(Y1-Y0,X1-X0);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X1-12*Math.cos(a-0.4),Y1-12*Math.sin(a-0.4));ctx.lineTo(X1-12*Math.cos(a+0.4),Y1-12*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    for(let X=0;X<W;X+=9)for(let Y=0;Y<H;Y+=9){const x=mx(X+4),y=my(Y+4);ctx.fillStyle=col(f(x,y));ctx.fillRect(X,Y,9,9);}
    for(const h of [4,9,16,25,36]){const r=Math.sqrt(h);ctx.strokeStyle='rgba(220,230,244,0.35)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=72;i++){const t=i/72*2*Math.PI;const X=px(r*Math.cos(t)),Y=py(r*Math.sin(t));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();}
    const rp=Math.sqrt(f(xp,yp));if(rp>0.05){ctx.strokeStyle='rgba(220,230,244,0.75)';ctx.lineWidth=1.6;ctx.beginPath();for(let i=0;i<=72;i++){const t=i/72*2*Math.PI;const X=px(rp*Math.cos(t)),Y=py(rp*Math.sin(t));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();}

  cv.style.touchAction='none';let drg=false;

function c7_directional(){
  stage.innerHTML=`<div class="card"><h2>Directional derivatives: the slope in <em>any</em> direction</h2>
    <p>The gradient told you the <em>steepest</em> way up and how steep it is. But you don't always get to walk the steepest way — sometimes you're forced along a road, a ridge, a chosen heading. The <b>directional derivative</b> answers: if I step in direction $\\mathbf u$, how fast does the height change per step?</p>
    <p>This is just the 1-D derivative set free. On a line there are only <em>two</em> ways to move, so "the slope" quietly meant two directional derivatives at once: $f'$ (stepping in $+x$) and $-f'$ (stepping in $-x$). On a surface there's a whole circle of headings to choose from, and $D_{\\mathbf u}f$ gives the slope for each — the old 1-D pair being nothing but the two special cases $\\mathbf u=(+1)$ and $\\mathbf u=(-1)$.</p>
    <p>Below, the point sits at $(3,4)$ on $f=x^2+y^2$, with its <span class="grn">gradient</span> $(6,8)$ fixed. <b>Drag to swing the <span class="cy">blue direction arrow</span></b> $\\mathbf u$ around, and read the slope in that direction on the right. Watch it peak when $\\mathbf u$ lines up with the gradient, pass through zero when $\\mathbf u$ runs along the contour, and go negative when you head downhill.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">direction</div><div class="v" id="th">—</div></div><div class="rdc"><div class="k">slope D&#7524;f = ∇f·u</div><div class="v" id="dv">—</div></div><div class="rdc"><div class="k">vs. steepest |∇f|</div><div class="v" id="mx">= 10</div></div></div>
    <div class="task"><b>Slope heading due east</b>At $(3,4)$, $\\nabla f=(6,8)$. Step in the unit direction $\\mathbf u=(1,0)$ (straight along $+x$). Compute $D_{\\mathbf u}f=\\nabla f\\cdot\\mathbf u$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Deriving the rule.</b> Take a small step of length $t$ in the unit direction $\\mathbf u=(\\cos\\theta,\\sin\\theta)$, so $\\Delta x=t\\cos\\theta$ and $\\Delta y=t\\sin\\theta$. From the tangent plane, the height change is $\\Delta f\\approx f_x\\,\\Delta x+f_y\\,\\Delta y=t\\,(f_x\\cos\\theta+f_y\\sin\\theta)$. The rate <em>per unit distance</em> is $\\Delta f/t$:</p>
    <div class="eqbox">$$D_{\\mathbf u}f=f_x\\cos\\theta+f_y\\sin\\theta=\\nabla f\\cdot\\mathbf u.$$</div>
    <p>The slope in any direction is just the gradient dotted with that direction. One caution: $\\mathbf u$ must be a <b>unit</b> vector, so the answer is "per unit distance." If a direction is handed to you as a longer vector $\\mathbf v$, shrink it first — use $\\mathbf u=\\mathbf v/|\\mathbf v|$.</p>
    <p><b>The cosine picture.</b> A dot product is $\\nabla f\\cdot\\mathbf u=|\\nabla f|\\,|\\mathbf u|\\cos\\varphi$, and $|\\mathbf u|=1$, so</p>
    <div class="eqbox">$$D_{\\mathbf u}f=|\\nabla f|\\cos\\varphi,\\qquad \\varphi=\\text{angle between }\\mathbf u\\text{ and }\\nabla f.$$</div>
    <p>That single formula contains the whole last beat plus more — it's the curve plotted on the right as you spin $\\mathbf u$:</p>
    <p>&bull; $\\varphi=0^\\circ$ (along $\\nabla f$): $\\cos\\varphi=1$, rate $=|\\nabla f|=10$ — the steepest climb.</p>
    <p>&bull; $\\varphi=90^\\circ$ (along the contour): $\\cos\\varphi=0$, rate $=0$ — no height change, which is exactly why $\\nabla f$ is perpendicular to the level curve.</p>
    <p>&bull; $\\varphi=180^\\circ$ (opposite $\\nabla f$): $\\cos\\varphi=-1$, rate $=-|\\nabla f|=-10$ — the steepest <em>descent</em>, the direction $-\\nabla f$ that gradient descent will ride downhill.</p>
    <p>For the task, due east $\\mathbf u=(1,0)$ gives $D_{\\mathbf u}f=(6,8)\\cdot(1,0)=6$ — less than the steepest $10$, because east isn't quite the uphill direction. This one dot product is the engine of the next beat: the chain rule threads exactly these rates through a path that is itself moving.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const gx=6,gy=8,gmag=10,x0=3,y0=4;
  const SL=17,cxL=158,cyL=196;const PLx=x=>cxL+x*SL,PLy=y=>cyL-y*SL;
  const thg=Math.atan2(gy,gx);
  let th=0;
  function arrow(X0,Y0,X1,Y1,col,w){if(!ctx)return;ctx.strokeStyle=col;ctx.lineWidth=w||3;ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.stroke();const a=Math.atan2(Y1-Y0,X1-X0);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X1-11*Math.cos(a-0.4),Y1-11*Math.sin(a-0.4));ctx.lineTo(X1-11*Math.cos(a+0.4),Y1-11*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    // left: contour circles
    ctx.fillStyle='#7f93a8';ctx.font='12px sans-serif';ctx.fillText('the map at (3,4)',16,22);
    for(const r of [2,3,4,5,6]){ctx.strokeStyle=r===5?'rgba(220,230,244,0.7)':'rgba(220,230,244,0.28)';ctx.lineWidth=r===5?1.6:1;ctx.beginPath();for(let i=0;i<=72;i++){const t=i/72*2*Math.PI;const X=PLx(r*Math.cos(t)),Y=PLy(r*Math.sin(t));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();}
    const Px=PLx(x0),Py=PLy(y0);
    arrow(Px,Py,PLx(x0+0.26*gx),PLy(y0+0.26*gy),'#3fb98f',3);
    const ux=Math.cos(th),uy=Math.sin(th);
    arrow(Px,Py,PLx(x0+2.2*ux),PLy(y0+2.2*uy),'#7ab8ff',3);
    ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(Px,Py,5,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#3fb98f';ctx.font='11px sans-serif';ctx.fillText('∇f',PLx(x0+0.26*gx)+4,PLy(y0+0.26*gy));
    ctx.fillStyle='#7ab8ff';ctx.fillText('u',PLx(x0+2.2*ux)+4,PLy(y0+2.2*uy));
    // divider
    ctx.strokeStyle='#1c2838';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(314,10);ctx.lineTo(314,370);ctx.stroke();
    // right: slope vs angle
    ctx.fillStyle='#7f93a8';ctx.fillText('slope in direction u, as u turns',326,22);
    const RX=t=>326+t/(2*Math.PI)*300, RD=dd=>200-dd/11*150;
    ctx.strokeStyle='#243347';ctx.lineWidth=1;ctx.strokeRect(326,RD(11),300,RD(-11)-RD(11));

function c7_chainrule(){
  stage.innerHTML=`<div class="card"><h2>The multivariable chain rule: rates through a graph</h2>
    <p>One last question closes out this module, and it's the one machine learning is built on. Suppose a single knob $t$ controls two intermediate quantities $x$ and $y$, and those together produce an output $z$. Turn $t$ — how fast does $z$ respond? The wrinkle is that $t$ reaches $z$ by <em>two routes</em> (through $x$, and through $y$), and we'll have to account for both.</p>
    <p>Here's the setup as a <b>computation graph</b>: $z=xy$, with $x=t^2$ and $y=t$. Each wire is labelled by its own little derivative — how much the top end moves per unit of the bottom end. <b>Drag $t$</b> and watch every value and every wire update, with $dz/dt$ assembled live on the right.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">t</div><div class="v" id="tv">—</div></div><div class="rdc"><div class="k">dz/dt (sum of both routes)</div><div class="v" id="dv">—</div></div><div class="rdc"><div class="k">direct check: 3t²</div><div class="v" id="ck">—</div></div></div>
    <div class="task"><b>Add up the routes</b>At $t=2$: route through $x$ contributes $\\frac{dx}{dt}\\cdot\\frac{\\partial z}{\\partial x}=(2t)(y)=8$; route through $y$ contributes $\\frac{dy}{dt}\\cdot\\frac{\\partial z}{\\partial y}=(1)(x)=4$. What is $dz/dt$?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Why you add the routes.</b> Start from the single-variable chain rule: if $z=g(u)$ and $u=h(t)$, then $\\frac{dz}{dt}=\\frac{dz}{du}\\frac{du}{dt}$ — multiply the rates along the one chain. Now the chain <em>forks</em>. Nudge $t$ by a tiny $dt$. It pushes $x$ by $\\frac{dx}{dt}dt$ and, separately, pushes $y$ by $\\frac{dy}{dt}dt$. Each push travels up to $z$:</p>
    <p>&bull; the $x$-push changes $z$ by $\\frac{\\partial z}{\\partial x}\\cdot\\big(\\frac{dx}{dt}dt\\big)$,</p>
    <p>&bull; the $y$-push changes $z$ by $\\frac{\\partial z}{\\partial y}\\cdot\\big(\\frac{dy}{dt}dt\\big)$.</p>
    <p>$z$ feels <em>both</em> at once, and (exactly the tangent-plane additivity from before) the total change is their sum. Divide by $dt$:</p>
    <div class="eqbox">$$\\frac{dz}{dt}=\\frac{\\partial z}{\\partial x}\\frac{dx}{dt}+\\frac{\\partial z}{\\partial y}\\frac{dy}{dt}.$$</div>
    <p>Read that off the graph as a recipe: <b>multiply the little derivatives along each route from $t$ to $z$, then add the routes.</b> With $n$ intermediates it's the same, one product per route:</p>
    <div class="eqbox">$$\\frac{dz}{dt}=\\sum_{i=1}^{n}\\frac{\\partial z}{\\partial x_i}\\frac{dx_i}{dt}.$$</div>
    <p>Our numbers: route through $x$ gives $(2t)(y)=2t\\cdot t=2t^2$; route through $y$ gives $(1)(x)=t^2$; together $3t^2$, which at $t=2$ is $12$ — and the direct check $z=t^3\\Rightarrow dz/dt=3t^2$ agrees exactly.</p>
    <p><b>Two things to carry away.</b> First, a tie to the last beat: when $x,y$ are coordinates you're walking, $\\big(\\frac{dx}{dt},\\frac{dy}{dt}\\big)$ is your velocity and $\\big(\\frac{\\partial z}{\\partial x},\\frac{\\partial z}{\\partial y}\\big)=\\nabla z$, so $\\frac{dz}{dt}=\\nabla z\\cdot\\text{velocity}$ — the same dot product, now along a moving path. Second, <b>this is backpropagation.</b> A neural network is one enormous computation graph; the loss depends on each weight through a thicket of routes, and its gradient is found by multiplying local derivatives along routes and summing — swept <em>backward</em> through the graph so a single pass delivers every weight's derivative at once. The whole training loop is this one rule.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  let t=2;
  const NZ=[258,64],NX=[150,196],NY=[366,196],NT=[258,328];
  function edge(A,B,col){if(!ctx)return;ctx.strokeStyle=col;ctx.lineWidth=2.4;const a=Math.atan2(B[1]-A[1],B[0]-A[0]);const sx=A[0]+28*Math.cos(a),sy=A[1]+28*Math.sin(a),ex=B[0]-28*Math.cos(a),ey=B[1]-28*Math.sin(a);ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-10*Math.cos(a-0.4),ey-10*Math.sin(a-0.4));ctx.lineTo(ex-10*Math.cos(a+0.4),ey-10*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
  function node(P,name,val,col){if(!ctx)return;ctx.fillStyle='#0d1726';ctx.strokeStyle=col||'#3a4c66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P[0],P[1],28,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#dbe6f4';ctx.font='600 15px sans-serif';ctx.textAlign='center';ctx.fillText(name,P[0],P[1]-3);ctx.fillStyle='#9fb0c4';ctx.font='12px sans-serif';ctx.fillText(val,P[0],P[1]+14);ctx.textAlign='left';}
  function lab(x,y,s,col){ctx.fillStyle=col;ctx.font='12px sans-serif';ctx.fillText(s,x,y);}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    const x=t*t,y=t,z=x*y,dxdt=2*t,dydt=1,dzdx=y,dzdy=x,pX=dxdt*dzdx,pY=dydt*dzdy,sum=pX+pY,direct=3*t*t;
    const BL='#7ab8ff',GD='#e8b84b';
    edge(NT,NX,BL);edge(NX,NZ,BL);   // route via x
    edge(NT,NY,GD);edge(NY,NZ,GD);   // route via y
    node(NZ,'z',z.toFixed(0),'#5d7186');node(NX,'x',x.toFixed(0),BL);node(NY,'y',y.toFixed(0),GD);node(NT,'t',t.toFixed(0),'#5d7186');
    lab(150,268,'dx/dt = '+dxdt.toFixed(0),BL);lab(150,120,'∂z/∂x = '+dzdx.toFixed(0),BL);
    lab(312,268,'dy/dt = '+dydt.toFixed(0),GD);lab(312,120,'∂z/∂y = '+dzdy.toFixed(0),GD);
    // right panel assembly
    ctx.strokeStyle='#1c2838';ctx.beginPath();ctx.moveTo(444,20);ctx.lineTo(444,360);ctx.stroke();
    lab(456,70,'route via x:',BL);lab(470,92,'(2t)(y) = '+pX.toFixed(0),BL);
    lab(456,140,'route via y:',GD);lab(470,162,'(1)(x) = '+pY.toFixed(0),GD);
    ctx.strokeStyle='#2b3a4f';ctx.beginPath();ctx.moveTo(456,186);ctx.lineTo(620,186);ctx.stroke();
    ctx.fillStyle='#dbe6f4';ctx.font='600 15px sans-serif';ctx.fillText('dz/dt = '+pX.toFixed(0)+' + '+pY.toFixed(0)+' = '+sum.toFixed(0),456,214);
    ctx.fillStyle=(Math.abs(sum-direct)<1e-9?'#3fb98f':'#c25'); ctx.font='12px sans-serif';ctx.fillText('direct 3t² = '+direct.toFixed(0)+(Math.abs(sum-direct)<1e-9?'  ✓':''),456,238);
    document.getElementById('tv').textContent=t.toFixed(0);
    document.getElementById('dv').textContent=sum.toFixed(0);
    document.getElementById('ck').textContent=direct.toFixed(0);}
  cv.style.touchAction='none';let drg=false;
  const snap=v=>{const q=Math.round(v);return Math.abs(v-q)<0.18?q:v;};
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));t=Math.max(0,Math.min(3,snap(X/W*3)));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),12,()=>{addReveal(`<div class="rh">✓ dz/dt = 12</div><p>$8+4=12$. You multiplied the little derivatives along each route — $(2t)(y)=8$ through $x$, $(1)(x)=4$ through $y$ — and added them. The direct route $z=t^3\\Rightarrow 3t^2$ gives $12$ too, confirming the rule. Drag $t$ and the two coloured routes keep summing to $3t^2$. Scale this picture up to millions of nodes and you have backprop.</p>`);});
  setHints([`Multiply along each route, then ADD the routes: 8 (via x) + 4 (via y).`,`8 + 4 = 12.`]);
}

function c7_taylor(){
  stage.innerHTML=`<div class="card"><h2>The quadratic model: curvature the plane can't see</h2>
    <p>The tangent plane gave us a flat stand-in for the surface. But flat is exactly the problem: at a critical point the gradient is zero, so the tangent plane is perfectly level — and a level plane looks identical over a valley, a peak, or a saddle. What tells them apart is <b>curvature</b>, the <em>second</em>-order behavior. And here is the question one variable never forced on us: curvature <em>in which direction</em>? Let's look before we compute.</p>

    <p><b>What you're looking at.</b> There is one fixed surface, the bowl $z=f(x,y)=x^2+xy+y^2$; it never changes. From the base point $P=(1,0)$ you pick a <b>heading</b> $\\theta$ — a compass direction in the flat $x$-$y$ input plane, the way you'd walk away from $P$. Drop a vertical knife straight down along that heading and it exposes a <b>cross-section</b> of the bowl: a single curve of height-versus-distance, the <span class="cy">blue slice</span>. Swinging $\\theta$ doesn't touch the bowl — it points the knife a different way, exposing a different cross-section. That is why the blue curve changes as you drag: same hill, cut at a new angle. The top picture is the knife in the bowl; the bottom is that same cut <b>straightened out</b>, with distance $s$ along the heading on the horizontal axis. <b>Drag either picture left–right to swing the heading.</b></p>
    <canvas id="cv3d" width="640" height="300"></canvas>
    <canvas id="cv" width="640" height="380"></canvas>
    <p class="small" id="obs3" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">heading θ (in x-y plane)</div><div class="v" id="th">—</div></div><div class="rdc"><div class="k">slope ∇f·p (linear)</div><div class="v" id="g1">—</div></div><div class="rdc"><div class="k">curvature pᵀHp (quadratic)</div><div class="v" id="g2">—</div></div></div>
    <div class="task"><b>Read the curvature along x</b>Point the heading along the $x$-axis, $\\mathbf p=(1,0)$. For $f=x^2+xy+y^2$ the Hessian is $H=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$. Compute the directional curvature $\\mathbf p^{\\mathsf T}H\\mathbf p$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>The second-order model.</b> Take the tangent-plane (linear) approximation and tack on a quadratic term in the steps $\\Delta x,\\Delta y$. Written out in full:</p>
    <div class="eqbox">$$f(P+\\Delta)\\approx \\underbrace{f(P)}_{\\text{height}}+\\underbrace{f_x\\,\\Delta x+f_y\\,\\Delta y}_{\\text{tangent plane}}+\\underbrace{\\tfrac12\\big(f_{xx}\\,\\Delta x^2+2f_{xy}\\,\\Delta x\\,\\Delta y+f_{yy}\\,\\Delta y^2\\big)}_{\\text{curvature}}.$$</div>
    <p>That last bracket is a <b>quadratic form</b> — squared terms and a cross-term in $\\Delta x,\\Delta y$. Every quadratic form is carried by a symmetric matrix, and here that matrix is the <b>Hessian</b> $H$, the table of second partials. It's symmetric because the mixed partials agree, $f_{xy}=f_{yx}$ (true for any smooth surface), which is also why the cross-term carries the factor $2$:</p>
    <div class="eqbox">$$H=\\begin{pmatrix}f_{xx}&f_{xy}\\\\ f_{xy}&f_{yy}\\end{pmatrix},\\qquad \\tfrac12\\,\\mathbf p^{\\mathsf T}H\\,\\mathbf p=\\tfrac12\\big(f_{xx}\\,\\Delta x^2+2f_{xy}\\,\\Delta x\\,\\Delta y+f_{yy}\\,\\Delta y^2\\big).$$</div>

    <div class="eqbox">single variable: one axis, one bend&nbsp; $f''(x)$ &nbsp;$\\longrightarrow$&nbsp; two variables: a bend for every heading&nbsp; $\\mathbf p^{\\mathsf T}H\\mathbf p$</div>
    <p><b>From one bend to a bend per direction.</b> In one variable you can only step along the $x$-axis, left or right, so a point's curvature is a single number $f''(x)$. With two inputs you can step out of $P$ in <em>any</em> heading, so "the second derivative" is no longer one number — it's one bend <em>per direction</em>, the map $\\mathbf p\\mapsto\\mathbf p^{\\mathsf T}H\\mathbf p$. The Hessian $H$ stores them all at once: hand it a heading $\\mathbf p$ and it returns that heading's curvature. Point along $x$ with $\\mathbf p=(1,0)$ and it returns $f_{xx}$, the ordinary 1-D bend along $x$. The new ingredient is the cross-term $f_{xy}$: it lets the two axes interact, which a lone $x$ could never do.</p>

    <p><b>This is the directional derivative, one order up.</b> In one variable the word "derivative" hides a choice you never had to make: with only the $x$-axis, "the slope" and "the curvature" come with a built-in direction. With two inputs that choice is out in the open — every rate is measured along a heading $\\mathbf p$. The slope you read is exactly the <em>directional derivative</em> from the previous beat; the curvature is its second-order sibling:</p>
    <div class="eqbox">slope $=\\nabla f\\cdot\\mathbf p$ &nbsp;(directional derivative)$\\qquad$ curvature $=\\mathbf p^{\\mathsf T}H\\mathbf p$ &nbsp;(directional <em>second</em> derivative)</div>
    <p>So the readouts above aren't two unrelated numbers: they're the first and second directional derivatives of $f$ at $P$ along the heading you're pointing.</p>

    <p><b>Where the curvature term comes from.</b> To pin down that second directional derivative, collapse the surface back to one variable. Walk a straight line out of $P$ in a fixed heading $\\mathbf p=(p_1,p_2)$; your position after distance $s$ is</p>
    <div class="eqbox">$$x(s)=x_0+s\\,p_1,\\qquad y(s)=y_0+s\\,p_2,\\qquad\\text{so}\\quad \\frac{dx}{ds}=p_1,\\ \\ \\frac{dy}{ds}=p_2.$$</div>
    <p>Let $g(s)=f\\big(x(s),y(s)\\big)$ — your height as you walk. It is the blue slice: an ordinary function of the single variable $s$, so the 1-D Taylor expansion from Module 6 applies:</p>
    <div class="eqbox">$$g(s)\\approx g(0)+g'(0)\\,s+\\tfrac12\\,g''(0)\\,s^2.$$</div>
    <p><b>First derivative — chain rule, once.</b> $f$ changes with $s$ only through $x$ and $y$, so the multivariable chain rule adds the two routes:</p>
    <div class="eqbox">$$g'(s)=f_x\\,\\frac{dx}{ds}+f_y\\,\\frac{dy}{ds}=f_x\\,p_1+f_y\\,p_2=\\nabla f\\cdot\\mathbf p.$$</div>
    <p>That is the slope of the slice — the first directional derivative, as expected.</p>
    <p><b>Second derivative — chain rule, a second time.</b> Differentiate $g'(s)=f_x\\,p_1+f_y\\,p_2$ again in $s$. The constants $p_1,p_2$ stay put, but $f_x$ and $f_y$ are themselves functions of $(x,y)$ that move as you walk, so each needs the chain rule again:</p>
    <div class="eqbox">$$\\frac{d}{ds}f_x=f_{xx}\\,p_1+f_{xy}\\,p_2,\\qquad \\frac{d}{ds}f_y=f_{xy}\\,p_1+f_{yy}\\,p_2.$$</div>
    <p>Feed those back in:</p>
    <div class="eqbox">$$g''(s)=p_1\\big(f_{xx}p_1+f_{xy}p_2\\big)+p_2\\big(f_{xy}p_1+f_{yy}p_2\\big)=f_{xx}\\,p_1^2+2f_{xy}\\,p_1p_2+f_{yy}\\,p_2^2=\\mathbf p^{\\mathsf T}H\\mathbf p.$$</div>
    <p>The mixed partial $f_{xy}$ appears once from differentiating $f_x$ and once from $f_y$, and the two copies merge into the single $2f_{xy}\\,p_1p_2$ cross-term. The Hessian term is the chain rule applied twice.</p>

    <p><b>Assemble the model.</b> Substitute the three pieces $g(0)=f(P)$, $g'(0)=\\nabla f\\cdot\\mathbf p$, $g''(0)=\\mathbf p^{\\mathsf T}H\\mathbf p$ into $g(s)\\approx g(0)+g'(0)s+\\tfrac12 g''(0)s^2$:</p>
    <div class="eqbox">$$g(s)\\approx f(P)+(\\nabla f\\cdot\\mathbf p)\\,s+\\tfrac12\\,(\\mathbf p^{\\mathsf T}H\\mathbf p)\\,s^2.$$</div>
    <p>Each term adds one layer to the picture below: start flat at the height $f(P)$, tilt by the slope, then bend by the curvature. The three layers stack up to the slice itself.</p>
    <canvas id="cvd" width="640" height="300"></canvas>
    <p class="small" style="margin-top:6px;color:#9fb0c4">Along $x$ ($\\mathbf p=(1,0)$) at $P=(1,0)$: height $f(P)=1$, slope $2$, curvature $2$. Here $f$ is itself quadratic, so the two-term bend already matches the true slice exactly.</p>
    <p>The step you actually take is the displacement $\\Delta=s\\,\\mathbf p$. Since $(\\nabla f\\cdot\\mathbf p)\\,s=\\nabla f\\cdot\\Delta$ and $(\\mathbf p^{\\mathsf T}H\\mathbf p)\\,s^2=\\Delta^{\\mathsf T}H\\Delta$, the slice model is the surface model:</p>
    <div class="eqbox">$$f(P+\\Delta)\\approx f(P)+\\nabla f\\cdot\\Delta+\\tfrac12\\,\\Delta^{\\mathsf T}H\\Delta,$$</div>
    <p>which in components $\\Delta=(\\Delta x,\\Delta y)$ is the model we opened with. The 3-D cut and the 1-D derivation are the same statement.</p>

    <p><b>The upshot is on the canvas.</b> The slope of the slice is $\\nabla f\\cdot\\mathbf p$ and its curvature is $\\mathbf p^{\\mathsf T}H\\mathbf p$. Spin the heading and the curvature readout traces $2+\\sin2\\theta$: the bowl genuinely bends by a different amount in different directions, and the Hessian reports that bend for whichever way you face. The rose below plots it directly — the radius in each heading is the curvature there. Drag above and the gold marker rides around it.</p>
    <canvas id="cvr" width="640" height="300"></canvas>
    <p class="small" style="margin-top:6px;color:#9fb0c4">This bowl is stiffest along the $45°$ diagonal (bend $3$) and softest along $135°$ (bend $1$), but always positive — it curves up every way you turn. For a saddle the rose would cross the origin, positive one way and negative another. That single object, curvature in every direction bundled into $H$, is what the next beat reads to classify a critical point, what convexity checks, and what Newton's method uses to size its jump.</p></div>`;

  // ===== shared state =====
  const f=(x,y)=>x*x+x*y+y*y;let th=0;

  // ===== 3-D view: the knife cutting the bowl =====
  const cv3=document.getElementById('cv3d');const ctx3=cv3&&cv3.getContext&&cv3.getContext('2d');const W3=cv3.width,H3=cv3.height;
  const sx=66,sy=24,sz=11,cx=300,cy=172;
  const pxmin=-0.2,pxmax=2.2,pymin=-1.2,pymax=1.2;
  const P3=(x,y,z)=>[cx+(x-y)*sx, cy+(x+y)*sy - z*sz];
  function arrow2(a,b,col){if(!ctx3)return;ctx3.strokeStyle=col;ctx3.lineWidth=2.5;ctx3.beginPath();ctx3.moveTo(a[0],a[1]);ctx3.lineTo(b[0],b[1]);ctx3.stroke();const an=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx3.fillStyle=col;ctx3.beginPath();ctx3.moveTo(b[0],b[1]);ctx3.lineTo(b[0]-9*Math.cos(an-0.4),b[1]-9*Math.sin(an-0.4));ctx3.lineTo(b[0]-9*Math.cos(an+0.4),b[1]-9*Math.sin(an+0.4));ctx3.closePath();ctx3.fill();}
  function draw3d(){if(!ctx3)return;ctx3.clearRect(0,0,W3,H3);
    const NX=10,NY=10;
    ctx3.strokeStyle='#2b3a4f';ctx3.lineWidth=1;
    for(let j=0;j<=NY;j++){const y=pymin+(pymax-pymin)*j/NY;ctx3.beginPath();for(let i=0;i<=NX;i++){const x=pxmin+(pxmax-pxmin)*i/NX;const q=P3(x,y,f(x,y));i?ctx3.lineTo(q[0],q[1]):ctx3.moveTo(q[0],q[1]);}ctx3.stroke();}
    for(let i=0;i<=NX;i++){const x=pxmin+(pxmax-pxmin)*i/NX;ctx3.beginPath();for(let j=0;j<=NY;j++){const y=pymin+(pymax-pymin)*j/NY;const q=P3(x,y,f(x,y));j?ctx3.lineTo(q[0],q[1]):ctx3.moveTo(q[0],q[1]);}ctx3.stroke();}
    const cz=Math.cos(th),s2=Math.sin(th);const surf=[],flr=[];
    for(let s=-1.7;s<=1.701;s+=0.04){const x=1+s*cz,y=s*s2;if(x<pxmin||x>pxmax||y<pymin||y>pymax)continue;surf.push(P3(x,y,f(x,y)));flr.push(P3(x,y,0));}
    if(surf.length>1){
      ctx3.fillStyle='rgba(122,184,255,0.14)';ctx3.beginPath();ctx3.moveTo(flr[0][0],flr[0][1]);for(const p of flr)ctx3.lineTo(p[0],p[1]);for(let i=surf.length-1;i>=0;i--)ctx3.lineTo(surf[i][0],surf[i][1]);ctx3.closePath();ctx3.fill();
      ctx3.strokeStyle='rgba(232,184,75,0.6)';ctx3.setLineDash([5,4]);ctx3.lineWidth=1.5;ctx3.beginPath();flr.forEach((p,i)=>i?ctx3.lineTo(p[0],p[1]):ctx3.moveTo(p[0],p[1]));ctx3.stroke();ctx3.setLineDash([]);

    ctx.strokeStyle='#3fb98f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px(s0),py(yl));ctx.lineTo(px(s0),py(yc));ctx.stroke();

  // ===== curvature rose: bend by heading =====
  const cvr=document.getElementById('cvr');const ctxr=cvr&&cvr.getContext&&cvr.getContext('2d');const Wr=cvr.width,Hr=cvr.height;const cxr=Wr/2,cyr=Hr/2+8,kr=38;
  function drawRose(){if(!ctxr)return;ctxr.clearRect(0,0,Wr,Hr);

    // current heading radial + marker
