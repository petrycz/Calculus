}
function c7_convexity(){
  stage.innerHTML=`<div class="card"><h2>Convexity and saddles: when a bowl has no hidden dips</h2>
    <p>A function is <b>convex</b> if it curves upward in <em>every</em> direction everywhere — a true bowl with no secret dips. That is the dream for optimization: a convex function has exactly one valley, so any flat spot you find is <em>the</em> global minimum, and "roll downhill" is guaranteed to reach it. (Contrast the last caveat: a non-convex surface has many valleys, and gradient descent only finds whichever one you started above.)</p>
    <p>The test lives in the curvature from the Taylor beat. In direction $\\mathbf p$ the curvature is $\\mathbf p^{\\mathsf T}H\\mathbf p$; the surface curves up that way exactly when that's $\\ge 0$. Below, the curvature of $f=x^2+c\\,xy+y^2$ is plotted as the direction turns through a full circle — it works out to $2+c\\sin2\\theta$. <b>Drag $c$</b> and watch for the moment the curve dips below zero.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">c</div><div class="v" id="cv0">—</div></div><div class="rdc"><div class="k">smallest curvature (2 − |c|)</div><div class="v" id="mn">—</div></div><div class="rdc"><div class="k">verdict</div><div class="v" id="vd">—</div></div></div>
    <div class="task"><b>The knife-edge</b>Drag to $c=3$. The smallest curvature over all directions is $2-|c|$ (the smaller Hessian eigenvalue). What is it at $c=3$?</div>
    <div class="entry"><input id="ni" inputmode="text" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>The convexity test.</b> In one variable, convex meant $f''\\ge0$ — curving up (Module 3). The surface version is the same statement in every direction at once: $f$ is convex exactly when its curvature is non-negative no matter which way you face,</p>
    <div class="eqbox">$$\\mathbf p^{\\mathsf T}H\\,\\mathbf p\\ \\ge\\ 0\\quad\\text{for every direction }\\mathbf p.$$</div>
    <p style="text-align:center;margin-top:-6px;color:#9fb0c4">(a Hessian with this property is called <b>positive-semidefinite</b>)</p>
    <p>For our family the smallest this curvature ever gets is $2-|c|$, so $f$ is convex while $|c|\\le2$ and turns into a <b>saddle</b> once $|c|&gt;2$ — the instant the gold curve pokes below zero. That smallest curvature is the smaller of the Hessian's two <em>eigenvalues</em>, and it ties straight back to the last beat's discriminant: $D=4-c^2\\ge0$ is the very same condition as $2-|c|\\ge0$. Convex $\\iff$ every directional curvature $\\ge0$ $\\iff$ (here) $D\\ge0$ with $f_{xx}\\ge0$.</p>
    <p><b>Why saddles take over in high dimensions.</b> A critical point is a minimum only if the curvature is positive in <em>all</em> directions — every one of the Hessian's eigenvalues positive. With two variables that's two sign-conditions to satisfy; with a neural network's <em>millions</em> of variables it's millions of them, all needed at once. If the signs were anything like independent, getting every single one positive is as unlikely as flipping a million coins and seeing all heads — so almost every critical point has <em>some</em> negative-curvature direction and is a <b>saddle</b>, not a minimum.</p>
    <p>This flips the intuition people carry from low dimensions. Deep-learning loss surfaces aren't riddled with bad local minima to get trapped in; they're riddled with <em>saddles</em> — and a saddle always has a downhill escape direction, so gradient descent slides off and keeps going. It's a big part of why plain first-order optimization works as well as it does. (Convex problems — linear and logistic regression, SVMs — have none of this trouble: one valley, found reliably. The non-convex mess is what makes deep nets hard, and interesting.)</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:6.2832,ymin:-2,ymax:5});
  let c=1;
  function draw(){const K=th=>2+c*Math.sin(2*th);pl.grid();pl.hline(0,'#2b3a4f',true);
    const {ctx,px,py}=pl;
    // negative region in gold
    ctx.strokeStyle='rgba(232,184,75,0.5)';ctx.lineWidth=1;for(let i=0;i<=240;i++){const th=i/240*2*Math.PI;const k=K(th);if(k<0){ctx.beginPath();ctx.moveTo(px(th),py(0));ctx.lineTo(px(th),py(k));ctx.stroke();}}
    pl.curve(K,(2-Math.abs(c))>=0?'#7ab8ff':'#e8b84b',2.6);
    const thmin=3*Math.PI/4;pl.point(thmin,2-Math.abs(c),(2-Math.abs(c))>=0?'#7ab8ff':'#e8b84b',5);
    ctx.fillStyle='#5d7186';ctx.font='11px sans-serif';ctx.fillText('curvature',px(0.1),py(4.4));ctx.fillText('direction θ (0 … 2π)',px(4.3),py(-1.4));
    document.getElementById('cv0').textContent=c.toFixed(2);
    document.getElementById('mn').textContent=(2-Math.abs(c)).toFixed(2);
    document.getElementById('vd').textContent=(2-Math.abs(c))>=-1e-9?'convex — one global min':'not convex — a saddle';}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(cv.width/Math.max(1,r.width));c=Math.max(0,Math.min(3,X/cv.width*3));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),-1,()=>{addReveal(`<div class="rh">✓ −1</div><p>$2-|3|=-1$. A negative smallest-curvature means there's a direction where the surface bends <em>down</em>, so it is not convex — it's a saddle. On the plot, $2+3\\sin2\\theta$ dips to $-1$. Pull $c$ back under $2$ and the whole curve lifts above zero: convex again, and now gradient descent is guaranteed its one true minimum.</p>`);},s=>parseFloat(s));
  setHints([`Just evaluate 2 − |c| at c = 3.`,`2 − 3 = −1 (type a negative sign).`]);
}

function c7_newton(){
  stage.innerHTML=`<div class="card"><h2>Newton's method: jump to the model's minimum</h2>
    <p>Gradient descent creeps downhill with a step size $\\alpha$ you have to guess. Newton's method uses the extra information we now have — the <em>curvature</em>, i.e. the Hessian — to do something bolder: build the local quadratic model and jump straight to <em>its</em> minimum in one shot.</p>
    <p>Below is $f(x)=\\tfrac18x^4$ in <span class="cy">blue</span>. At your current point it fits the matching parabola (the quadratic model) in <span style="color:#e8b84b">gold</span> and marks that parabola's lowest point in <span class="grn">green</span> — the next Newton point. <b>Drag the point</b> and watch the model and its vertex track along; the faint dots show where the next steps land.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">step f′/f″</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">next x = x − f′/f″</div><div class="v" id="nx">—</div></div></div>
    <div class="task"><b>One Newton step by hand</b>For $f=\\tfrac18x^4$: $f'=\\tfrac12x^3$ and $f''=\\tfrac32x^2$. Starting at $x=3$, apply $x-\\dfrac{f'}{f''}$. Where does one step land?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Build the model, then minimize it.</b> The quadratic model of $f$ around the current point, as a function of the step $\\mathbf p$, is (from the Taylor beat):</p>
    <div class="eqbox">$$m(\\mathbf p)=f+\\nabla f\\cdot\\mathbf p+\\tfrac12\\,\\mathbf p^{\\mathsf T}H\\,\\mathbf p.$$</div>
    <p>This is itself a quadratic (a paraboloid) in $\\mathbf p$, so its minimum is wherever <em>its own</em> gradient vanishes: $\\nabla_{\\mathbf p}\\,m=\\mathbf 0$.</p>
    <p><b>The one-dimensional case first.</b> With a single variable the model is $m(p)=f+f'p+\\tfrac12 f''p^2$. Differentiate in $p$ and set to zero:</p>
    <div class="eqbox">$$m'(p)=f'+f''p=0\\quad\\Longrightarrow\\quad p=-\\frac{f'}{f''}\\quad\\Longrightarrow\\quad x_{\\text{next}}=x-\\frac{f'}{f''}.$$</div>
    <p><b>Now the multivariable gradient of the model.</b> Differentiate $m(\\mathbf p)$ with respect to the step. The two pieces:</p>
    <div class="eqbox">$$\\nabla_{\\mathbf p}\\big(\\nabla f\\cdot\\mathbf p\\big)=\\nabla f,\\qquad \\nabla_{\\mathbf p}\\big(\\tfrac12\\,\\mathbf p^{\\mathsf T}H\\mathbf p\\big)=H\\mathbf p.$$</div>
    <p>The first holds because $\\nabla f\\cdot\\mathbf p=\\sum_i f_i\\,p_i$, so $\\partial/\\partial p_j=f_j$ — the components reassemble into $\\nabla f$. The second: $\\tfrac12\\mathbf p^{\\mathsf T}H\\mathbf p=\\tfrac12\\sum_{i,j}H_{ij}p_ip_j$, and differentiating in $p_k$ hits the $p_i$ and the $p_j$ slots, giving $\\tfrac12\\big(\\sum_j H_{kj}p_j+\\sum_i H_{ik}p_i\\big)=\\sum_j H_{kj}p_j=(H\\mathbf p)_k$ — the two sums merge because $H$ is symmetric. Setting the whole gradient to zero:</p>
    <div class="eqbox">$$\\nabla_{\\mathbf p}\\,m=\\nabla f+H\\mathbf p=\\mathbf 0\\quad\\Longrightarrow\\quad H\\mathbf p=-\\nabla f\\quad\\Longrightarrow\\quad \\mathbf p=-H^{-1}\\nabla f.$$</div>
    <p>So the update is $\\ \\mathbf x_{\\text{next}}=\\mathbf x-H^{-1}\\nabla f$ — the multivariable twin of $x-f'/f''$, with "divide by the curvature" now meaning "multiply by the inverse Hessian."</p>
    <p><b>What the curvature does.</b> Compare gradient descent's $\\mathbf x-\\alpha\\nabla f$: Newton replaces the guessed scalar $\\alpha$ with $H^{-1}$, which rescales the step <em>per direction</em> by its curvature — a small, careful step where the surface bends sharply, a big stride where it's nearly flat. In 1-D that's literally slope $\\div$ curvature, $f'/f''$. And because the model <em>is</em> the function when $f$ is quadratic, Newton lands on the exact minimum in a single step; for general $f$ it iterates and converges extremely fast near the bottom.</p>
    <p><b>The catch — and the ML connection.</b> Newton needs the Hessian and its inverse. For $n$ variables that's $n^2$ numbers to store and about $n^3$ work to invert — hopeless at a model's millions of parameters. That's exactly why deep learning runs on first-order gradient descent instead, and why a whole family of methods — L-BFGS, K-FAC, natural gradient, Adam's per-coordinate curvature estimate — chase Newton's curvature-rescaling <em>without</em> ever forming $H^{-1}$.</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.8,xmax:3.6,ymin:-2,ymax:16});
  const f=x=>x*x*x*x/8, fp=x=>x*x*x/2, fpp=x=>1.5*x*x;
  let x0=3;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');
    const nx=x0-fp(x0)/fpp(x0);
    pl.curve(u=>f(x0)+fp(x0)*(u-x0)+0.5*fpp(x0)*(u-x0)*(u-x0),'#e8b84b',2);
    // faint future iterates
    let xk=nx;for(let i=0;i<4;i++){if(xk<pl.xmin||xk>pl.xmax)break;pl.point(xk,f(xk),'rgba(63,185,143,'+(0.5-i*0.1)+')',3);xk=xk-fp(xk)/fpp(xk);}
    pl.vline(nx,'#3fb98f',true);
    pl.point(nx,f(x0)-0.5*fp(x0)*fp(x0)/fpp(x0),'#3fb98f',5,true);
    pl.point(x0,f(x0),'#fff',5);
    document.getElementById('xv').textContent=x0.toFixed(2);
    document.getElementById('sv').textContent=(fp(x0)/fpp(x0)).toFixed(2);
    document.getElementById('nx').textContent=nx.toFixed(2);}
  xdrag(cv,pl,x=>{x0=Math.max(0.3,Math.min(3.4,x));draw();});
  draw();
  numChk(stage.querySelector('.card'),2,()=>{addReveal(`<div class="rh">✓ x = 2</div><p>$x-\\dfrac{f'}{f''}=3-\\dfrac{\\frac12(27)}{\\frac32(9)}=3-\\dfrac{13.5}{13.5}=3-1=2$. The gold parabola's lowest point sits right above $x=2$. Keep stepping and it runs $3\\to2\\to\\tfrac43\\to\\cdots\\to0$, homing in far faster than fixed-size gradient steps — each step's size is set for you by the curvature in the denominator.</p>`);});
  setHints([`f′(3)=½·27=13.5, f″(3)=1.5·9=13.5, so f′/f″=1.`,`3 − 1 = 2.`]);
}

function c7_critical(){
  stage.innerHTML=`<div class="card"><h2>Critical points: finding the flat spots</h2>
    <p>Optimization is the hunt for best points — the bottom of a loss surface, the top of a profit curve. In one variable the candidates were where $f'=0$: the flat spots. The same idea lifts to a surface, but now "flat" has to mean flat in <em>every</em> direction at once.</p>
    <p>Below is the landscape $f(x,y)=x^3-3x+y^2$ as a heat map (dark = low, bright = high) with the <span class="grn">gradient arrow</span> at your point. <b>Drag around and hunt for the spots where the arrow shrinks to nothing</b> — where $|\\nabla f|=0$. There are two of them, and they're not the same kind of place.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">point (x, y)</div><div class="v" id="pv">—</div></div><div class="rdc"><div class="k">∇f = (3x²−3, 2y)</div><div class="v" id="gv">—</div></div><div class="rdc"><div class="k">|∇f|</div><div class="v" id="mv">—</div></div></div>
    <div class="task"><b>Solve for a critical point</b>A critical point needs <em>both</em> parts of $\\nabla f=(3x^2-3,\\,2y)$ to vanish. The second gives $y=0$. Solve $3x^2-3=0$ for the positive $x$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Fermat's idea, lifted to a surface.</b> At a genuine peak or valley the tangent plane can't tilt — if it leaned <em>any</em> way, you could step that way to go higher (or the opposite way to go lower), so it wouldn't be the top or bottom. A flat tangent plane means every slope is zero, i.e. both partials vanish:</p>
    <div class="eqbox">$$\\nabla f=\\mathbf 0\\quad\\Longleftrightarrow\\quad \\frac{\\partial f}{\\partial x}=0\\ \\text{ and }\\ \\frac{\\partial f}{\\partial y}=0.$$</div>
    <p>A point where this holds is a <b>critical point</b>. Note both parts must be zero — a point where only one partial vanishes is not critical. To find them you solve that little system. For our surface:</p>
    <div class="eqbox">$$f_x=3x^2-3=0\\Rightarrow x=\\pm1,\\qquad f_y=2y=0\\Rightarrow y=0,$$</div>
    <p>so there are two critical points: $(1,0)$ and $(-1,0)$ — exactly the two spots where you watched the arrow die.</p>
    <p><b>But flat doesn't mean "best."</b> A zero gradient is <em>necessary</em> for an interior max or min, but not <em>sufficient</em>. A flat spot can be one of three things:</p>
    <p>&bull; a <b>valley</b> (local minimum) — like $(1,0)$, sitting in the dark basin;</p>
    <p>&bull; a <b>peak</b> (local maximum) — a dome;</p>
    <p>&bull; a <b>saddle</b> — like $(-1,0)$: uphill if you go one way, downhill if you go another, so it's neither a max nor a min. This is brand new in two dimensions; a single variable has nothing quite like it.</p>
    <p>So $\\nabla f=\\mathbf 0$ narrows the search to a handful of candidates. The next beat shows how to actually travel to one — gradient descent — and the beat after tells min from max from saddle using the second derivatives.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=118,cx=320,cy=196;
  const f=(x,y)=>x*x*x-3*x+y*y;
  const px=x=>cx+x*S,py=y=>cy-y*S,mx=X=>(X-cx)/S,my=Y=>(cy-Y)/S;
  const LO=[18,30,48],HI=[232,184,75];
  const col=z=>{const t=Math.max(0,Math.min(1,(z+4)/8));return 'rgb('+Math.round(LO[0]+(HI[0]-LO[0])*t)+','+Math.round(LO[1]+(HI[1]-LO[1])*t)+','+Math.round(LO[2]+(HI[2]-LO[2])*t)+')';};
  let xp=0,yp=1;
  function arrow(X0,Y0,X1,Y1,c){if(!ctx)return;ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.stroke();const a=Math.atan2(Y1-Y0,X1-X0);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X1-11*Math.cos(a-0.4),Y1-11*Math.sin(a-0.4));ctx.lineTo(X1-11*Math.cos(a+0.4),Y1-11*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    for(let X=0;X<W;X+=8)for(let Y=0;Y<H;Y+=8){ctx.fillStyle=col(f(mx(X+4),my(Y+4)));ctx.fillRect(X,Y,8,8);}
    const gx=3*xp*xp-3,gy=2*yp,gm=Math.sqrt(gx*gx+gy*gy);
    if(gm>0.08)arrow(px(xp),py(yp),px(xp+0.14*gx),py(yp+0.14*gy),'#3fb98f');
    else{ctx.strokeStyle='#3fb98f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px(xp),py(yp),12,0,7);ctx.stroke();ctx.fillStyle='#3fb98f';ctx.font='11px sans-serif';ctx.fillText('∇f = 0',px(xp)+16,py(yp)-8);}
    ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px(xp),py(yp),5,0,7);ctx.fill();ctx.stroke();
    document.getElementById('pv').textContent='('+xp.toFixed(1)+', '+yp.toFixed(1)+')';
    document.getElementById('gv').textContent='('+gx.toFixed(1)+', '+gy.toFixed(1)+')';
    document.getElementById('mv').textContent=gm.toFixed(2);}
  cv.style.touchAction='none';let drg=false;
  const snap=v=>{const q=Math.round(v);return Math.abs(v-q)<0.14?q:v;};
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width)),Y=(e.clientY-r.top)*(H/Math.max(1,r.height));xp=Math.max(-2.6,Math.min(2.6,snap(mx(X))));yp=Math.max(-1.6,Math.min(1.6,snap(my(Y))));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ x = 1</div><p>$3x^2-3=0\\Rightarrow x^2=1\\Rightarrow x=\\pm1$, and $y=0$, so the critical points are $(1,0)$ and $(-1,0)$ — both answers matter (don't drop the negative root). On the map, $(1,0)$ sits in the dark basin (a minimum) while $(-1,0)$ is a saddle: slide away from it along $y$ and the ground falls, along $x$ and it climbs. Same zero gradient, completely different places — which is why we still need a test to tell them apart.</p>`);});
  setHints([`Both components of ∇f must be zero. Solve 3x²−3 = 0.`,`x² = 1, so the positive root is x = 1 (the other is −1).`]);
}

function c7_graddescent(){
  stage.innerHTML=`<div class="card"><h2>Gradient descent: walking to the bottom</h2>
    <p>Finding critical points by hand means solving $\\nabla f=\\mathbf 0$ — fine for a textbook, hopeless for a loss surface with a million variables. So instead of <em>solving</em>, we <em>walk</em>: stand somewhere, look for the downhill direction, take a step, repeat. The gradient hands us the direction for free.</p>
    <p>From the directional-derivative beat, the steepest-<em>descent</em> direction is $-\\nabla f$ (the gradient points steepest uphill, so its negative points steepest down). Take a step that way, scaled by a number $\\alpha$ — the <b>learning rate</b> — and repeat:</p>
    <div class="eqbox">$\\mathbf x_{\\text{next}}=\\mathbf x-\\alpha\\,\\nabla f(\\mathbf x).$</div>
    <p>In one variable this is simply $x_{\\text{next}}=x-\\alpha f'(x)$: step <em>against</em> the sign of the slope — left when $f'&gt;0$, right when $f'&lt;0$ — which is "downhill." The only thing higher dimensions add is that "against the slope" becomes "against the gradient vector," $-\\nabla f$.</p>
    <p>Below, descent runs on the bowl $f=x^2+y^2$ from the same start each time. <b>Drag left/right to change the learning rate $\\alpha$</b> and watch the whole path change character.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">learning rate α</div><div class="v" id="av">—</div></div><div class="rdc"><div class="k">step 1 lands at</div><div class="v" id="s1">—</div></div><div class="rdc"><div class="k">outcome</div><div class="v" id="st">—</div></div></div>
    <div class="task"><b>Take one step by hand</b>From the start $(4,3)$ with $\\alpha=0.1$ and $\\nabla f=(2x,2y)$, apply $x_{\\text{next}}=x-\\alpha\\,f_x$. What is the new $x$-coordinate?</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>The one knob that matters.</b> The step size $\\alpha$ is the whole game, and the canvas shows why:</p>
    <p>&bull; <b>Too small</b> (drag left): correct direction, but tiny steps — the path crawls and takes forever to arrive.</p>
    <p>&bull; <b>Too large</b> (drag right): you leap clear past the bottom and land on the far wall, bouncing back and forth across the valley — and if $\\alpha$ is large enough the bounces <em>grow</em> and the path explodes to infinity.</p>
    <p>&bull; <b>Just right</b> (the middle): a few brisk steps straight into the minimum. Tuning this number is the single most fiddled-with dial in all of machine learning.</p>
    <p><b>Why it settles.</b> Near the bottom the gradient shrinks toward $\\mathbf 0$, so the steps $\\alpha\\nabla f$ automatically shrink too — the walk eases to a stop instead of rattling around (as long as $\\alpha$ isn't too big).</p>
    <p><b>One honest caveat.</b> Descent only ever walks <em>downhill from where it started</em>, so it finds a <em>local</em> minimum — the valley you happen to be standing in. On a landscape with several valleys, a different starting point can land you in a different one. (On a <em>convex</em> bowl there's only one valley, so it's also the global best — which is the next topic but one.)</p>
    <p><b>This is how models train.</b> A neural network's loss is a surface over millions of weights. Each training step: compute $\\nabla(\\text{loss})$ by backprop (last module's chain rule), then take one gradient-descent step. Repeat millions of times. Fancier optimizers — momentum, Adam — are just cleverer ways to choose each step, but the skeleton is this exact line.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=33,cx=320,cy=190;
  const px=x=>cx+x*S,py=y=>cy-y*S;
  let alpha=0.2;
  function run(a){let x=4,y=3;const pts=[[x,y]];let steps=0,out='';
    for(let i=0;i<70;i++){x-=a*2*x;y-=a*2*y;pts.push([x,y]);steps++;const d=Math.hypot(x,y);if(d<0.03){break;}if(d>90){break;}}
    const r=Math.abs(1-2*a);const last=Math.hypot(pts[pts.length-1][0],pts[pts.length-1][1]);
    if(a>1.0001&&last>5)out='diverging → ∞';
    else if(r>0.999&&r<1.001)out='bouncing forever';
    else if(last<0.05)out='converged in '+steps+' steps';
    else out='converging (slowly)';
    return {pts,out};}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    for(const rr of [1,2,3,4,5]){ctx.strokeStyle='rgba(122,150,190,0.22)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=72;i++){const t=i/72*2*Math.PI;const X=px(rr*Math.cos(t)),Y=py(rr*Math.sin(t));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();}
    ctx.fillStyle='#3fb98f';ctx.beginPath();ctx.arc(px(0),py(0),4,0,7);ctx.fill();
    ctx.fillStyle='#5d7186';ctx.font='11px sans-serif';ctx.fillText('min',px(0)+7,py(0)+4);
    const {pts,out}=run(alpha);
    ctx.strokeStyle='#e8b84b';ctx.lineWidth=1.6;ctx.beginPath();pts.forEach((p,i)=>{const X=px(p[0]),Y=py(p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.stroke();
    pts.forEach((p,i)=>{if(i===0)return;ctx.fillStyle='rgba(232,184,75,0.9)';ctx.beginPath();ctx.arc(px(p[0]),py(p[1]),2.6,0,7);ctx.fill();});
    ctx.fillStyle='#fff';ctx.strokeStyle='#0a111b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px(4),py(3),5,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#9fb0c4';ctx.font='11px sans-serif';ctx.fillText('start (4,3)',px(4)+8,py(3)-6);
    const nx=4-alpha*8,ny=3-alpha*6;
    document.getElementById('av').textContent=alpha.toFixed(2);
    document.getElementById('s1').textContent='('+nx.toFixed(2)+', '+ny.toFixed(2)+')';
    document.getElementById('st').textContent=out;}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));alpha=Math.max(0.05,Math.min(1.15,0.05+X/W*1.10));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),3.2,()=>{addReveal(`<div class="rh">✓ x = 3.2</div><p>$x_{\\text{next}}=4-0.1\\cdot(2\\cdot4)=4-0.8=3.2$ (and $y$ goes $3-0.1\\cdot6=2.4$). One nudge straight toward the center; repeat and it homes in on $(0,0)$. On the canvas, small $\\alpha$ makes a long trail of tiny steps, a middling $\\alpha$ dives straight in, and pushing $\\alpha$ past $1$ sends the path bouncing outward to infinity — the learning rate, in one picture.</p>`);},s=>parseFloat(s));
  setHints([`x_next = x − α·f_x = 4 − 0.1·(2·4).`,`4 − 0.1·8 = 4 − 0.8 = 3.2.`]);
}

function c7_secondderiv(){
  stage.innerHTML=`<div class="card"><h2>The second-derivative test: min, max, or saddle</h2>
    <p>We can find flat spots ($\\nabla f=\\mathbf 0$) and we can measure curvature (the Hessian). Put them together. The quadratic model says that near any point $P$,</p>
    <div class="eqbox">$$f(P+\\mathbf p)\\approx f(P)+\\nabla f\\cdot\\mathbf p+\\tfrac12\\,\\mathbf p^{\\mathsf T}H\\,\\mathbf p.$$</div>
    <p>At a <em>critical</em> point the gradient is zero, $\\nabla f=\\mathbf 0$, so the entire linear term disappears — $\\nabla f\\cdot\\mathbf p=\\mathbf 0\\cdot\\mathbf p=0$ — and the surface, measured from $P$, is pure curvature:</p>
    <div class="eqbox">$$f(P+\\mathbf p)-f(P)\\approx \\tfrac12\\,\\mathbf p^{\\mathsf T}H\\,\\mathbf p.$$</div>
    <p>This is the exact generalization of the single-variable second-derivative test. There, one number settled it — the sign of $f''$: positive meant a minimum, negative a maximum. With two variables that single $f''$ grows into the whole Hessian, and the verdict now comes from the sign of the quadratic form $\\mathbf p^{\\mathsf T}H\\mathbf p$ rather than a lone number — because, as we'll see, the two directions can interact and one sign no longer tells the whole story.</p>
    <p>So whether you end up <em>higher</em> or <em>lower</em> than $P$ after a small step $\\mathbf p$ is decided entirely by the sign of the quadratic form $Q(\\mathbf p)=\\mathbf p^{\\mathsf T}H\\mathbf p$: positive for every direction $\\Rightarrow$ you rise whichever way you go $\\Rightarrow$ a <b>minimum</b>; negative every way $\\Rightarrow$ a <b>maximum</b>; positive some ways and negative others $\\Rightarrow$ a <b>saddle</b>. Below is $f=x^2+c\\,xy+y^2$; <span class="cy">blue</span> marks where it rises above the flat tangent plane, <span style="color:#e8b84b">gold</span> where it dips below. <b>Drag $c$</b> and watch the all-blue bowl tip into a two-toned saddle.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <p class="small" id="obs" style="margin-top:8px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">c</div><div class="v" id="cv0">—</div></div><div class="rdc"><div class="k">D = det H</div><div class="v" id="dv">—</div></div><div class="rdc"><div class="k">verdict</div><div class="v" id="vd">—</div></div></div>
    <div class="task"><b>Compute the deciding number</b>For $f=x^2+xy+y^2$ ($c=1$): $f_{xx}=2$, $f_{yy}=2$, $f_{xy}=1$. Evaluate $D=f_{xx}f_{yy}-f_{xy}^{\\,2}$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Why $f_{xx}$ and $f_{yy}$ alone aren't enough.</b> The tempting shortcut is to read off the two straight-ahead curvatures $f_{xx}$ (along $x$) and $f_{yy}$ (along $y$). But on the surface above, $f_{xx}=f_{yy}=2&gt;0$ for <em>every</em> $c$ — yet past $c=2$ it's clearly a saddle. The cross term $2f_{xy}\\,\\Delta x\\Delta y$ can drag the curvature negative along a <em>diagonal</em> even while both axis-curvatures stay positive, so all three second partials must be weighed together.</p>

    <p><b>Completing the square, step by step.</b> Write $A=f_{xx}$, $B=f_{xy}$, $C=f_{yy}$, and expand the quadratic form:</p>
    <div class="eqbox">$$Q=A\\,\\Delta x^2+2B\\,\\Delta x\\Delta y+C\\,\\Delta y^2.$$</div>
    <p>The goal is to rewrite this as a <b>sum of squares</b>, because the sign of a square is obvious. Factor $A$ out of the two terms that contain $\\Delta x$:</p>
    <div class="eqbox">$$Q=A\\Big(\\Delta x^2+\\tfrac{2B}{A}\\Delta x\\Delta y\\Big)+C\\,\\Delta y^2.$$</div>
    <p>Inside the bracket, add and subtract $\\big(\\tfrac{B}{A}\\Delta y\\big)^2$ to complete the square — $\\Delta x^2+\\tfrac{2B}{A}\\Delta x\\Delta y=\\big(\\Delta x+\\tfrac{B}{A}\\Delta y\\big)^2-\\tfrac{B^2}{A^2}\\Delta y^2$:</p>
    <div class="eqbox">$$Q=A\\Big(\\Delta x+\\tfrac{B}{A}\\Delta y\\Big)^2-\\tfrac{B^2}{A}\\Delta y^2+C\\,\\Delta y^2.$$</div>
    <p>Collect the two $\\Delta y^2$ terms over a common denominator, $C-\\tfrac{B^2}{A}=\\tfrac{AC-B^2}{A}$:</p>
    <div class="eqbox">$$Q=\\underbrace{A}_{\\text{weight 1}}\\Big(\\Delta x+\\tfrac{B}{A}\\Delta y\\Big)^2+\\underbrace{\\frac{AC-B^2}{A}}_{\\text{weight 2}}\\,\\Delta y^2.$$</div>
    <p>Now $Q$ is a sum of two <em>squares</em> (each $(\\cdots)^2\\ge0$), scaled by two weights. The intuition: a weighted sum of squares is positive for all nonzero steps exactly when <b>both weights are positive</b>, negative for all when both are negative, and takes <b>both signs</b> when the weights disagree. So the whole classification comes down to the signs of $A$ and $\\tfrac{AC-B^2}{A}$.</p>

    <p><b>One number controls both weights — and it's the determinant of the Hessian.</b> Define</p>
    <div class="eqbox">$$D=\\det H=\\det\\begin{pmatrix}f_{xx}&f_{xy}\\\\ f_{xy}&f_{yy}\\end{pmatrix}=f_{xx}f_{yy}-f_{xy}^{\\,2}=AC-B^2.$$</div>
    <p>Weight 1 is $A=f_{xx}$; weight 2 is $\\tfrac{D}{A}$. Reading the signs:</p>
    <p>&bull; <b>$D&gt;0$:</b> weight 2 $=\\tfrac{D}{A}$ shares $A$'s sign, so both weights match — $Q$ is one-signed. If $f_{xx}&gt;0$ it's a <b>minimum</b>; if $f_{xx}&lt;0$, a <b>maximum</b>.</p>
    <p>&bull; <b>$D&lt;0$:</b> weight 2 has the opposite sign to weight 1, so $Q$ is positive one way and negative another — a <b>saddle</b>.</p>
    <p>&bull; <b>$D=0$:</b> weight 2 vanishes; $Q$ is flat along a whole direction and the test is <b>inconclusive</b> (higher-order terms decide).</p>
    <p>For our family $A=C=2,\\ B=c$, so $D=4-c^2$ — positive (bowl) until $c=2$, negative (saddle) after, exactly the tip-over you dragged. And since $D=\\det H$ equals the <em>product</em> of $H$'s two eigenvalues (the curvatures along its principal perpendicular directions), $D&gt;0$ means they share a sign and $D&lt;0$ means they disagree. "$D&gt;0$ with $f_{xx}&gt;0$" is precisely the Hessian being <b>positive-definite</b> — the clean local bowl that makes gradient descent behave.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const cx0=W/2,cy0=225,sx=38,sy=14,sz=5.5;
  const P=(x,y,z)=>[cx0+(x-y)*sx, cy0+(x+y)*sy - z*sz];
  let c=0;const fc=(x,y)=>x*x+c*x*y+y*y;
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#22303f';ctx.lineWidth=1;
    for(let i=0;i<=8;i++){const t=-2+4*i/8;let a=P(t,-2,0),b=P(t,2,0);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();let e=P(-2,t,0),g=P(2,t,0);ctx.beginPath();ctx.moveTo(e[0],e[1]);ctx.lineTo(g[0],g[1]);ctx.stroke();}
    const N=14,a=2,quads=[];
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){const X0=-a+2*a*i/N,X1=-a+2*a*(i+1)/N,Y0=-a+2*a*j/N,Y1=-a+2*a*(j+1)/N;
      const zc=0.25*(fc(X0,Y0)+fc(X1,Y0)+fc(X1,Y1)+fc(X0,Y1));quads.push({p:[[X0,Y0],[X1,Y0],[X1,Y1],[X0,Y1]],z:zc,d:X0+X1+Y0+Y1});}
    quads.sort((p,q)=>p.d-q.d);
    for(const q of quads){ctx.beginPath();q.p.forEach((pt,k)=>{const pr=P(pt[0],pt[1],fc(pt[0],pt[1]));k?ctx.lineTo(pr[0],pr[1]):ctx.moveTo(pr[0],pr[1]);});ctx.closePath();
      ctx.fillStyle=q.z>=0?'rgba(90,140,205,0.80)':'rgba(232,184,75,0.82)';ctx.fill();ctx.strokeStyle='rgba(15,23,36,0.5)';ctx.lineWidth=1;ctx.stroke();}
    const o=P(0,0,0);ctx.fillStyle='#3fb98f';ctx.beginPath();ctx.arc(o[0],o[1],4,0,7);ctx.fill();
    const D=4-c*c;
    document.getElementById('cv0').textContent=c.toFixed(2);
    document.getElementById('dv').textContent=D.toFixed(2);
    document.getElementById('vd').textContent=D>0.06?'bowl → minimum':(D<-0.06?'saddle':'borderline');
    const ob=document.getElementById('obs');if(ob)ob.textContent = D>0.06?'All blue — rises above the flat plane in every direction: a minimum. (f_xx=f_yy=2 the whole time.)':(D<-0.06?'Blue AND gold — it rises one way, falls another: a saddle, even though f_xx=f_yy=2 are both still positive.':'Borderline: the bowl has flattened along a diagonal (D ≈ 0).');}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));c=Math.max(0,Math.min(3,X/W*3));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),3,()=>{addReveal(`<div class="rh">✓ D = 3</div><p>$D=\\det H=(2)(2)-1^2=3&gt;0$, and $f_{xx}=2&gt;0$, so the origin is a <b>minimum</b> — the all-blue bowl at $c=1$. Push $c$ past $2$ and $D=4-c^2$ turns negative: gold appears and the bowl has become a saddle, dropping below its own tangent plane along one diagonal while rising along the other.</p>`);});
  setHints([`D = det H = f_xx·f_yy − f_xy². Here f_xx=2, f_yy=2, f_xy=1.`,`2·2 − 1·1 = 4 − 1 = 3. Positive, and f_xx>0, so: minimum.`]);
}

function c7_lagrange(){
  stage.innerHTML=`<div class="card"><h2>Lagrange multipliers: the best point on a constraint</h2>
    <p>So far we've hunted for the best point <em>anywhere</em>. Usually life is more restrictive: find the best point while <b>stuck on a curve</b>. Here's the cleanest example to build the idea on.</p>
    <p>You have $10$ units of edging for the two sides of a rectangle; call the sides $x$ and $y$. You want the largest area. Two roles are in play, and it pays to name them:</p>
    <p>&bull; the <b>objective</b> — the thing you're maximizing — is the area $f(x,y)=xy$;</p>
    <p>&bull; the <b>constraint</b> — the rule you can't break — is that the sides sum to $10$. Write it as its own function pinned to a value: $g(x,y)=x+y$, held at $g=10$. The split-points you're <em>allowed</em> to stand on form the <b>constraint curve</b> $g=10$ — here, the line $x+y=10$.</p>
    <div class="eqbox">Keep the cast straight: $f$ and $g$ are <b>surfaces</b> over the plane. Their <b>level curves</b> live down in the input plane — the hyperbolas $xy=\\text{const}$ and the one curve $g=c$ you're pinned to. Each <b>gradient</b> is computed from its surface but <b>drawn in the input plane</b>, where it sits perpendicular to that surface's level curves.</div>
    <p><b>Slide the split</b> along the constraint and find the biggest area. Watch the new readout — $df/ds$, the slope of the objective <em>as you walk along the constraint</em>.</p>
    <div class="seg" id="segc"></div>
    <canvas id="cv" width="640" height="380"></canvas>
    <p class="small" id="obs" style="margin-top:8px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">point (x, y)</div><div class="v" id="pv">—</div></div><div class="rdc"><div class="k">objective f = xy</div><div class="v" id="fv">—</div></div><div class="rdc"><div class="k">slope along constraint df/ds</div><div class="v" id="dv">—</div></div></div>

    <p style="margin-top:14px">Lift it into 3-D and the setup sharpens: the <span class="cy">objective is a surface</span> $z=xy$, and the constraint is a <b>wall</b> standing over its curve. Being stuck on the constraint means walking the <b>cut curve</b> where the wall slices the surface — and the best point is just its <b>high point</b>. The marker rides the cut as you slide.</p>
    <canvas id="cv3d" width="640" height="300"></canvas>

    <div class="task"><b>Find the biggest area</b>With the straight constraint $x+y=10$, slide to the largest rectangle. What is the maximum of $f=xy$?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Why is the tangent point the best? Walk the constraint.</b> Stuck on the curve, the only moves you have are <em>along</em> it. Measure your position by the distance $s$ you've walked; your objective $f$ becomes a plain function of the single variable $s$. Optimizing it is the one-variable rule you already have: keep going while the slope $df/ds\\neq0$, stop where $df/ds=0$. The chain rule turns that slope into a dot product:</p>
    <div class="eqbox">$$\\frac{df}{ds}=\\nabla f\\cdot\\mathbf T,\\qquad \\mathbf T=\\text{unit tangent to the constraint.}$$</div>
    <p>So the optimum is where $\\nabla f\\cdot\\mathbf T=0$: the objective's gradient has <b>no push along any direction you're allowed to move</b>. In the slider that's the instant $df/ds$ crosses zero — positive while a higher area lies ahead, negative once you've passed the peak, exactly like $f'(x)$ changing sign at a one-variable maximum.</p>
    <div class="eqbox">unconstrained: zero slope in <b>every</b> direction $(\\nabla f=\\mathbf 0)$ $\\qquad$ constrained: zero slope only in the <b>allowed</b> directions $(\\nabla f\\cdot\\mathbf T=0)$</div>

    <p><b>From "no push along the curve" to parallel gradients.</b> The figure below zooms in on the meeting point. <b>Flip the switch</b> from "curves cross" to "curves tangent" and watch the gradient arrows line up.</p>
    <div class="seg" id="seg2"></div>
    <canvas id="cv2" width="640" height="300"></canvas>
    <p class="small" id="obs2" style="margin-top:6px;color:#9fb0c4"></p>
    <p>&bull; $\\nabla g$ (green) points perpendicular to the constraint curve — a gradient is always perpendicular to its own level curve, and the constraint <em>is</em> the level curve $g=c$. So $\\nabla g$ is perpendicular to $\\mathbf T$.</p>
    <p>&bull; At the optimum $\\nabla f\\cdot\\mathbf T=0$ means $\\nabla f$ is <em>also</em> perpendicular to $\\mathbf T$.</p>
    <p>Two vectors perpendicular to the same tangent line (in the plane) can only point along one direction — they're <b>parallel</b>. Parallel means one is a scalar multiple of the other:</p>
    <div class="eqbox">$$\\nabla f=\\lambda\\,\\nabla g.$$</div>
    <p>The scalar $\\lambda$ — the <b>Lagrange multiplier</b> — just absorbs the difference in the gradients' lengths; they share a direction, not a size.</p>

    <p><b>Does this survive a curved constraint?</b> Flip the constraint toggle above from the line to the <b>circle</b> $x^2+y^2=18$ (same objective $f=xy$). Nothing in the argument used straightness: at each point the constraint still has one tangent direction $\\mathbf T$, and you still walk until $df/ds=\\nabla f\\cdot\\mathbf T=0$. The optimum lands at $(3,3)$ with area $9$, right where a hyperbola $xy=9$ kisses the circle and where $\\nabla f=(3,3)$ lines up with the radial $\\nabla g=(6,6)$. The cut curve in 3-D is now carved by a curved wall, but it's still a 1-D curve with a single top.</p>

    <p><b>What if the constraint is a surface?</b> In three variables a single constraint $g(x,y,z)=c$ is no longer a curve but a whole <b>surface</b>, and you're free to roam anywhere on it — the allowed directions fill a 2-D <b>tangent plane</b>. The optimum still needs $\\nabla f\\cdot\\mathbf d=0$ for <em>every</em> allowed direction $\\mathbf d$, and the only way a vector can be perpendicular to an entire plane of directions is to point straight along that surface's <b>normal</b>. The normal to a level surface is its gradient, so once again</p>
    <div class="eqbox">$$\\nabla f=\\lambda\\,\\nabla g,$$</div>
    <p>only now it says the two <em>level surfaces</em> — $f=\\text{const}$ and $g=c$ — are tangent, sharing a tangent plane, instead of two level curves sharing a tangent line. Pile on a second constraint surface $g_2=c_2$ and you're pinned to where the two surfaces <b>intersect</b>, usually a curve; the one allowed direction is that curve's tangent, perpendicular to both $\\nabla g_1$ and $\\nabla g_2$, which forces $\\nabla f$ into the plane they span:</p>
    <div class="eqbox">$$\\nabla f=\\lambda_1\\,\\nabla g_1+\\lambda_2\\,\\nabla g_2.$$</div>
    <p>One multiplier per constraint — exactly the general form behind the KKT conditions in ML. The rule "the gradient must be perpendicular to every allowed direction" never changed; only the number of allowed directions did. Tangent level curves were just its flat, two-variable shadow.</p>

    <p><b>Write the whole system.</b> The vector equation $\\nabla f=\\lambda\\nabla g$ is one scalar equation per component, plus the reminder that you're actually <em>on</em> the constraint:</p>
    <div class="eqbox">$$f_x=\\lambda\\,g_x,\\qquad f_y=\\lambda\\,g_y,\\qquad g(x,y)=c.$$</div>
    <p><b>Solve the line case.</b> Here $\\nabla f=(f_x,f_y)=(y,x)$ and $\\nabla g=(1,1)$. Component by component, then drop in the constraint:</p>
    <div class="eqbox">$$y=\\lambda\\cdot1,\\quad x=\\lambda\\cdot1\\ \\Rightarrow\\ x=y;\\qquad x+y=10\\ \\Rightarrow\\ x=y=5.$$</div>
    <p>So $x=y=5$ (with $\\lambda=5$): the best rectangle of a fixed perimeter is the <b>square</b>, area $25$. The recipe — set $\\nabla f=\\lambda\\nabla g$, add the constraint $g=c$, solve — is the whole method, and it scales straight up: many variables, one multiplier $\\lambda$ per constraint. It's the backbone of constrained optimization in ML — the dual view of support-vector machines, maximum-entropy models, and the KKT conditions that extend it to inequality constraints all start here.</p></div>`;

  const R=Math.sqrt(18);
  let cmode='line', u=0.18;                       // u in [0,1] along the constraint
  function arrow(c2,X0,Y0,X1,Y1,col){if(!c2)return;c2.strokeStyle=col;c2.lineWidth=2.5;c2.beginPath();c2.moveTo(X0,Y0);c2.lineTo(X1,Y1);c2.stroke();const a=Math.atan2(Y1-Y0,X1-X0);c2.fillStyle=col;c2.beginPath();c2.moveTo(X1,Y1);c2.lineTo(X1-11*Math.cos(a-0.4),Y1-11*Math.sin(a-0.4));c2.lineTo(X1-11*Math.cos(a+0.4),Y1-11*Math.sin(a+0.4));c2.closePath();c2.fill();}
  // constraint parametrization: point, unit tangent T, grad g
  function at(uu){if(cmode==='line'){const x=0.5+uu*9,y=10-x;return {x,y,Tx:1/Math.SQRT2,Ty:-1/Math.SQRT2,gx:1,gy:1};}
    const ph=0.06+uu*(Math.PI/2-0.12),x=R*Math.cos(ph),y=R*Math.sin(ph);return {x,y,Tx:-Math.sin(ph),Ty:Math.cos(ph),gx:2*x,gy:2*y};}

  // ================= contour map =================
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=30,ox=60,oy=340;
  const px=x=>ox+x*S,py=y=>oy-y*S;
  function hyp(k,col,w){if(!ctx)return;ctx.strokeStyle=col;ctx.lineWidth=w||1.2;ctx.beginPath();let st=false;for(let xx=Math.max(0.04,k/11);xx<=11;xx+=0.03){const yy=k/xx;if(yy>11)continue;const X=px(xx),Y=py(yy);st?ctx.lineTo(X,Y):ctx.moveTo(X,Y);st=true;}ctx.stroke();}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#16202f';ctx.lineWidth=1;for(let g=0;g<=11;g++){ctx.beginPath();ctx.moveTo(px(g),py(0));ctx.lineTo(px(g),py(11));ctx.stroke();ctx.beginPath();ctx.moveTo(px(0),py(g));ctx.lineTo(px(11),py(g));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px(0),py(0));ctx.lineTo(px(11),py(0));ctx.moveTo(px(0),py(0));ctx.lineTo(px(0),py(11));ctx.stroke();
    const P=at(u),fv=P.x*P.y;
    // objective level curves (hyperbolas)
    for(const k of [4,9,16,25]){hyp(k,'#233042',1.1);const xl=8.8;if(k/xl<=11){ctx.fillStyle='#33465e';ctx.font='10px sans-serif';ctx.fillText('xy='+k,px(xl)+2,py(k/xl));}}
    // active level curve through the point
    hyp(fv,'#e8b84b',2);
    // constraint
    ctx.strokeStyle='#7ab8ff';ctx.lineWidth=2.5;ctx.beginPath();
    if(cmode==='line'){ctx.moveTo(px(0),py(10));ctx.lineTo(px(10),py(0));}
    else{let st=false;for(let a=0;a<=Math.PI/2+0.001;a+=0.03){const X=px(R*Math.cos(a)),Y=py(R*Math.sin(a));st?ctx.lineTo(X,Y):ctx.moveTo(X,Y);st=true;}}
    ctx.stroke();
    // tangent direction (dashed) and gradients at the point
    ctx.strokeStyle='rgba(159,176,196,0.7)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(px(P.x-P.Tx*1.6),py(P.y-P.Ty*1.6));ctx.lineTo(px(P.x+P.Tx*1.6),py(P.y+P.Ty*1.6));ctx.stroke();ctx.setLineDash([]);
    const fn=Math.hypot(P.y,P.x)||1,gn=Math.hypot(P.gx,P.gy)||1;
    arrow(ctx,px(P.x),py(P.y),px(P.x+(P.y/fn)*1.6),py(P.y+(P.x/fn)*1.6),'#e8b84b');
    arrow(ctx,px(P.x),py(P.y),px(P.x+(P.gx/gn)*1.6),py(P.y+(P.gy/gn)*1.6),'#3fb98f');
    ctx.fillStyle='#dbe6f4';ctx.beginPath();ctx.arc(px(P.x),py(P.y),5,0,7);ctx.fill();
    ctx.fillStyle='#e8b84b';ctx.font='12px sans-serif';ctx.fillText('∇f',px(P.x+(P.y/fn)*1.6)+4,py(P.y+(P.x/fn)*1.6));
    ctx.fillStyle='#3fb98f';ctx.fillText('∇g',px(P.x+(P.gx/gn)*1.6)+4,py(P.y+(P.gy/gn)*1.6));
    ctx.fillStyle='#7ab8ff';ctx.fillText(cmode==='line'?'constraint x+y=10':'constraint x²+y²=18',px(4.3),py(cmode==='line'?2.0:0.6));
    const dfds=P.y*P.Tx+P.x*P.Ty, tang=Math.abs(dfds)<0.14;
    if(tang){ctx.fillStyle='#3fb98f';ctx.font='600 13px sans-serif';ctx.fillText('tangent — best point',px(P.x)+10,py(P.y)-12);}
    document.getElementById('pv').textContent='('+P.x.toFixed(2)+', '+P.y.toFixed(2)+')';
    document.getElementById('fv').textContent=fv.toFixed(2);
    document.getElementById('dv').textContent=(Math.abs(dfds)<0.005?0:dfds).toFixed(2);
    const ob=document.getElementById('obs');if(ob)ob.textContent=tang
      ?'df/ds = 0 — the objective stops changing as you walk, so ∇f ⟂ the constraint and ∇f ∥ ∇g. This is the optimum.'
      :(dfds>0?'df/ds > 0 — the area still rises as you walk forward, so keep going.':'df/ds < 0 — you have passed the peak; the area is falling.');}

  // ================= 3-D: wall cutting the objective surface =================
  const cv3=document.getElementById('cv3d');const c3=cv3&&cv3.getContext&&cv3.getContext('2d');const W3=cv3?cv3.width:0,H3=cv3?cv3.height:0;
  function proj(){return cmode==='line'?{L:22,V:7.2,Z:2.4,CX:300,CY:120,PX:10,CLIP:42,WTOP:30,pk:[5,5,25]}
                                       :{L:46,V:15,Z:8,CX:300,CY:140,PX:4.6,CLIP:14,WTOP:11,pk:[3,3,9]};}
  function draw3d(){if(!c3)return;c3.clearRect(0,0,W3,H3);const pr=proj();const Q=(x,y,z)=>[pr.CX+(x-y)*pr.L, pr.CY+(x+y)*pr.V - z*pr.Z];
    const o=Q(0,0,0),axx=Q(pr.PX,0,0),axy=Q(0,pr.PX,0);
    c3.strokeStyle='#1a2534';c3.lineWidth=1;c3.beginPath();c3.moveTo(o[0],o[1]);c3.lineTo(axx[0],axx[1]);c3.moveTo(o[0],o[1]);c3.lineTo(axy[0],axy[1]);c3.stroke();
    // objective surface mesh z=xy, clipped so the cut band stays prominent
    c3.strokeStyle='#243a52';c3.lineWidth=1;const N=10,hi=pr.PX;
    for(let i=0;i<=N;i++){const x=hi*i/N,ymax=Math.min(hi,x>0?pr.CLIP/x:hi);c3.beginPath();let st=false;for(let y=0;y<=ymax+1e-9;y+=hi/N/2){const q=Q(x,y,x*y);st?c3.lineTo(q[0],q[1]):c3.moveTo(q[0],q[1]);st=true;}c3.stroke();}
    for(let j=0;j<=N;j++){const y=hi*j/N,xmax=Math.min(hi,y>0?pr.CLIP/y:hi);c3.beginPath();let st=false;for(let x=0;x<=xmax+1e-9;x+=hi/N/2){const q=Q(x,y,x*y);st?c3.lineTo(q[0],q[1]):c3.moveTo(q[0],q[1]);st=true;}c3.stroke();}
    // constraint path points
    const fl=[],tp=[],cu=[];
    if(cmode==='line'){for(let x=0;x<=10.0001;x+=0.25){fl.push(Q(x,10-x,0));tp.push(Q(x,10-x,pr.WTOP));cu.push(Q(x,10-x,x*(10-x)));}}
    else{for(let a=0;a<=Math.PI/2+1e-9;a+=0.025){const x=R*Math.cos(a),y=R*Math.sin(a);fl.push(Q(x,y,0));tp.push(Q(x,y,pr.WTOP));cu.push(Q(x,y,x*y));}}
    // wall (translucent)
    c3.fillStyle='rgba(122,184,255,0.12)';c3.beginPath();c3.moveTo(fl[0][0],fl[0][1]);for(const p of fl)c3.lineTo(p[0],p[1]);for(let i=tp.length-1;i>=0;i--)c3.lineTo(tp[i][0],tp[i][1]);c3.closePath();c3.fill();
    // constraint on floor (dashed)
    c3.strokeStyle='#7ab8ff';c3.setLineDash([5,4]);c3.lineWidth=1.6;c3.beginPath();fl.forEach((p,i)=>i?c3.lineTo(p[0],p[1]):c3.moveTo(p[0],p[1]));c3.stroke();c3.setLineDash([]);
    // cut curve (bold)
    c3.strokeStyle='#e8b84b';c3.lineWidth=3;c3.beginPath();cu.forEach((p,i)=>i?c3.lineTo(p[0],p[1]):c3.moveTo(p[0],p[1]));c3.stroke();
    // peak + current marker
    const pk=Q(pr.pk[0],pr.pk[1],pr.pk[2]);c3.fillStyle='#3fb98f';c3.beginPath();c3.arc(pk[0],pk[1],5,0,7);c3.fill();
    const P=at(u),cur=Q(P.x,P.y,P.x*P.y);c3.fillStyle='#dbe6f4';c3.beginPath();c3.arc(cur[0],cur[1],5,0,7);c3.fill();
    c3.font='12px sans-serif';c3.fillStyle='#5d7186';c3.fillText('objective surface  z = xy',12,18);
    c3.fillStyle='#7ab8ff';c3.fillText(cmode==='line'?'straight wall over x+y=10':'curved wall over x²+y²=18',12,H3-10);
    c3.fillStyle='#3fb98f';c3.fillText('top = '+pr.pk[2],pk[0]+10,pk[1]+4);}

  // ================= tangency schematic (cross vs tangent) =================
  const cv2=document.getElementById('cv2');const g2=cv2&&cv2.getContext&&cv2.getContext('2d');const W2=cv2.width,H2=cv2.height;
  const Pc=[W2/2,160];let st2='cross';
  function rmark(uu,v,col){if(!g2)return;const s=15;g2.strokeStyle=col;g2.lineWidth=1.6;g2.beginPath();g2.moveTo(Pc[0]+uu[0]*s,Pc[1]+uu[1]*s);g2.lineTo(Pc[0]+(uu[0]+v[0])*s,Pc[1]+(uu[1]+v[1])*s);g2.lineTo(Pc[0]+v[0]*s,Pc[1]+v[1]*s);g2.stroke();}
  function draw2(){if(!g2)return;g2.clearRect(0,0,W2,H2);
    const aL=0.30, dL=[Math.cos(aL),Math.sin(aL)], nG=[Math.sin(aL),-Math.cos(aL)];
    const aF=(st2==='tan')?aL:aL+0.62, dF=[Math.cos(aF),Math.sin(aF)], nF=[Math.sin(aF),-Math.cos(aF)], mF=[-Math.sin(aF),Math.cos(aF)];
    g2.strokeStyle='#7ab8ff';g2.lineWidth=2.5;g2.beginPath();g2.moveTo(Pc[0]-dL[0]*300,Pc[1]-dL[1]*300);g2.lineTo(Pc[0]+dL[0]*300,Pc[1]+dL[1]*300);g2.stroke();
    g2.strokeStyle='#e8b84b';g2.lineWidth=2.5;g2.beginPath();let st=false;for(let t=-170;t<=170;t+=4){const q=0.0017*t*t;const X=Pc[0]+dF[0]*t+mF[0]*q,Y=Pc[1]+dF[1]*t+mF[1]*q;st?g2.lineTo(X,Y):g2.moveTo(X,Y);st=true;}g2.stroke();
    if(st2==='cross'){g2.strokeStyle='rgba(232,184,75,0.6)';g2.lineWidth=1.5;g2.setLineDash([6,4]);g2.beginPath();g2.moveTo(Pc[0]-dF[0]*150,Pc[1]-dF[1]*150);g2.lineTo(Pc[0]+dF[0]*150,Pc[1]+dF[1]*150);g2.stroke();g2.setLineDash([]);}
    arrow(g2,Pc[0],Pc[1],Pc[0]+nG[0]*74,Pc[1]+nG[1]*74,'#3fb98f');
    arrow(g2,Pc[0],Pc[1],Pc[0]+nF[0]*74,Pc[1]+nF[1]*74,'#e8b84b');
    rmark(nG,dL,'#3fb98f');rmark(nF,dF,'#e8b84b');
    g2.fillStyle='#dbe6f4';g2.beginPath();g2.arc(Pc[0],Pc[1],5,0,7);g2.fill();
    g2.font='12px sans-serif';
    g2.fillStyle='#3fb98f';g2.fillText('∇g',Pc[0]+nG[0]*82-6,Pc[1]+nG[1]*82);
    g2.fillStyle='#e8b84b';g2.fillText('∇f',Pc[0]+nF[0]*82-6,Pc[1]+nF[1]*82);
    g2.fillStyle='#7ab8ff';g2.fillText('constraint curve  g = c',Pc[0]+dL[0]*300-150,Pc[1]+dL[1]*300+16);
    g2.fillStyle='#caa64e';g2.fillText('objective level curve  f = const',Pc[0]-150,Pc[1]-120);
    if(st2==='tan'){g2.fillStyle='#9fb0c4';g2.font='600 12px sans-serif';g2.fillText('one shared tangent line',Pc[0]+dL[0]*150-30,Pc[1]+dL[1]*150-8);}
    const ob=document.getElementById('obs2');if(ob)ob.textContent=(st2==='tan')?'Tangent: the curves share one tangent line, so ∇f and ∇g are both perpendicular to it — they point the same way. Parallel ⇒ optimum.':'Crossing: the two curves have different tangent directions, so ∇f and ∇g point different ways — not parallel, and you can still improve.';}

  // controls
  function buildC(){const el=document.getElementById('segc');if(!el)return;el.innerHTML=`<span class="segb ${cmode==='line'?'on':''}" data-m="line">straight constraint</span><span class="segb ${cmode==='circle'?'on':''}" data-m="circle">curved constraint</span>`;
    el.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{cmode=b.dataset.m;u=0.18;draw();draw3d();});}
  function build2(){const el=document.getElementById('seg2');if(!el)return;el.innerHTML=`<span class="segb ${st2==='cross'?'on':''}" data-s="cross">curves cross (not optimal)</span><span class="segb ${st2==='tan'?'on':''}" data-s="tan">curves tangent (optimal)</span>`;
    el.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{st2=b.dataset.s;build2();draw2();});}
  buildC();build2();

  // drag the contour map (or the 3-D) to move along the constraint
  function bind(el){if(!el)return;el.style.touchAction='none';let drg=false;
    const setU=e=>{const r=el.getBoundingClientRect();const X=(e.clientX-r.left)*(el.width/Math.max(1,r.width));u=Math.max(0,Math.min(1,(X-ox)/(10*S)));if(el!==cv)u=Math.max(0,Math.min(1,X/el.width));draw();draw3d();};
    el.addEventListener('pointerdown',e=>{drg=true;try{el.setPointerCapture(e.pointerId);}catch(x){}setU(e);e.preventDefault();});
    el.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setU(e);}});
    const end=()=>drg=false;el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
  bind(cv);bind(cv3);
  draw();draw3d();draw2();

  numChk(stage.querySelector('.card'),25,()=>{addReveal(`<div class="rh">✓ 25</div><p>At $x=y=5$ the area is $25$ — exactly where $df/ds=(y-x)/\\sqrt2$ crosses zero, where the hyperbola $xy=25$ just kisses the line, and where $\\nabla f=(5,5)$ and $\\nabla g=(1,1)$ point the same way, so $\\nabla f=5\\,\\nabla g$ ($\\lambda=5$). Flip to the curved constraint and the same walk lands at $(3,3)$, area $9$.</p>`);});
  setHints([`Walk until df/ds = 0. For the line that forces x=y; the constraint x+y=10 then gives x=y=5.`,`x=y=5, so the maximum area is 25.`]);
}
function c7_optproblems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Locating critical points, classifying them with the Hessian, convexity, gradient descent, Newton's step, and Lagrange multipliers. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">critical points</span><div class="ph">Problem 1</div>
    <p>Find every critical point of $f(x,y)=x^2+y^2-4x+6y$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Set $\\nabla f=\\mathbf 0$: $f_x=2x-4=0\\Rightarrow x=2$, and $f_y=2y+6=0\\Rightarrow y=-3$. One critical point, $(2,-3)$. (Completing the square, $f=(x-2)^2+(y+3)^2-13$, shows it's the global minimum, value $-13$.)</p></div></details></div>

    <div class="prob"><span class="lvl">classify · second-derivative test</span><div class="ph">Problem 2</div>
    <p>Find and classify all critical points of $f(x,y)=x^3-3x+y^2$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(3x^2-3,\\;2y)=\\mathbf 0\\Rightarrow x=\\pm1,\\ y=0$ — two critical points. The Hessian is $H=\\begin{pmatrix}6x&0\\\\0&2\\end{pmatrix}$, so $D=\\det H=12x$.</p>
    <p>At $(1,0)$: $D=12&gt;0$ and $f_{xx}=6&gt;0$ — a <b>local minimum</b>. At $(-1,0)$: $D=-12&lt;0$ — a <b>saddle</b>. (The $x$-slice $x^3-3x$ has a min then a max; the $y^2$ makes the max a saddle.)</p></div></details></div>

    <div class="prob"><span class="lvl">Hessian with a cross-term</span><div class="ph">Problem 3</div>
    <p>Classify the critical point of $f(x,y)=x^2+xy+y^2$ at the origin.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x+y,\\;x+2y)=\\mathbf 0$ gives $(0,0)$. Second partials: $f_{xx}=2,\\ f_{yy}=2,\\ f_{xy}=1$, so $H=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ and $D=\\det H=2\\cdot2-1^2=3&gt;0$ with $f_{xx}=2&gt;0$ — a <b>local minimum</b>. The cross-term tilts the bowl but doesn't open a downhill direction.</p></div></details></div>

    <div class="prob"><span class="lvl">reading a saddle off the determinant</span><div class="ph">Problem 4</div>
    <p>Show that $f(x,y)=x^2-y^2$ has a saddle at the origin, using $\\det H$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,-2y)=\\mathbf 0\\Rightarrow(0,0)$. $H=\\begin{pmatrix}2&0\\\\0&-2\\end{pmatrix}$, so $D=\\det H=(2)(-2)=-4&lt;0$ — a <b>saddle</b>. A negative determinant means the two curvatures have opposite signs: uphill along $x$, downhill along $y$.</p></div></details></div>

    <div class="prob"><span class="lvl">convexity</span><div class="ph">Problem 5</div>
    <p>Is $f(x,y)=x^2+xy+y^2$ convex? If so, what does that tell you about the critical point from Problem 3?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>The Hessian $H=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ is constant. For any direction $\\mathbf p=(a,b)$, $\\mathbf p^{\\mathsf T}H\\mathbf p=2a^2+2ab+2b^2=a^2+b^2+(a+b)^2\\ge 0$ — positive-semidefinite (here strictly positive unless $\\mathbf p=\\mathbf 0$). So $f$ is <b>convex</b>, and a convex function has no saddles or false valleys: the single critical point $(0,0)$ is the <b>global minimum</b>.</p></div></details></div>

    <div class="prob"><span class="lvl">gradient descent · the learning rate</span><div class="ph">Problem 6</div>
    <p>Minimizing $f(x,y)=x^2+y^2$ by gradient descent from $(2,2)$, take one step with learning rate $\\alpha$. Which single $\\alpha$ lands exactly on the minimum $(0,0)$?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,2y)=(4,4)$ at $(2,2)$. The step is $\\mathbf x\\leftarrow\\mathbf x-\\alpha\\nabla f=(2-4\\alpha,\\;2-4\\alpha)$. This is $(0,0)$ when $2-4\\alpha=0$, i.e. $\\alpha=\\tfrac12$. Smaller $\\alpha$ undershoots (crawls in); larger overshoots past the floor and can diverge.</p></div></details></div>

    <div class="prob"><span class="lvl">Newton's method</span><div class="ph">Problem 7</div>
    <p>For $f(x,y)=x^2+4y^2$, take one Newton step $\\mathbf x\\leftarrow\\mathbf x-H^{-1}\\nabla f$ from $(3,1)$. Where does it land, and why in one step?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,8y)=(6,8)$; $H=\\begin{pmatrix}2&0\\\\0&8\\end{pmatrix}$, so $H^{-1}\\nabla f=\\left(\\tfrac{6}{2},\\tfrac{8}{8}\\right)=(3,1)$. The step gives $(3,1)-(3,1)=(0,0)$ — the exact minimum. Newton lands in one step on any quadratic, because the quadratic model <em>is</em> the function. Note how $H^{-1}$ rescales each direction by its own curvature — something a single learning rate can't do.</p></div></details></div>

    <div class="prob"><span class="lvl">Lagrange · closest point</span><div class="ph">Problem 8</div>
    <p>Find the point on the line $x+2y=5$ closest to the origin, by minimizing $f=x^2+y^2$ subject to $g=x+2y=5$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=\\lambda\\nabla g$: $(2x,2y)=\\lambda(1,2)$, so $2x=\\lambda$ and $2y=2\\lambda=4x\\Rightarrow y=2x$. Drop into the constraint: $x+2(2x)=5\\Rightarrow x=1,\\ y=2$. The closest point is $(1,2)$, at distance $\\sqrt{1^2+2^2}=\\sqrt5$. (As expected, the line from the origin to $(1,2)$ is perpendicular to the constraint line.)</p></div></details></div>

    <div class="prob"><span class="lvl">challenge · Lagrange on a circle</span><div class="ph">Problem 9</div>
    <p>Maximize $f(x,y)=xy$ subject to $x^2+y^2=8$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(y,x)$, $\\nabla g=(2x,2y)$. From $y=\\lambda\\,2x$ and $x=\\lambda\\,2y$: substituting, $x=2\\lambda(2\\lambda x)=4\\lambda^2 x$, so $4\\lambda^2=1$, $\\lambda=\\pm\\tfrac12$. Taking $\\lambda=\\tfrac12$ gives $y=x$; on the circle $x^2+x^2=8\\Rightarrow x=\\pm2$, so $(2,2)$ or $(-2,-2)$, each with $f=4$ — the <b>maximum</b>. ($\\lambda=-\\tfrac12$ gives $y=-x$ and $f=-4$, the minimum.) The product is largest where the level hyperbola $xy=4$ just kisses the circle.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
function c7_polar(){
  stage.innerHTML=`<div class="card"><h2>Polar coordinates: the $r$ that makes round regions easy</h2>
    <p>Disks, rings, wedges — anything round — are painful to integrate in $x,y$ (the limits involve $\\sqrt{1-x^2}$). Polar coordinates $x=r\\cos\\theta,\\ y=r\\sin\\theta$ describe them effortlessly. But you can't just swap $dx\\,dy$ for $dr\\,d\\theta$: a little polar cell is not the same size as a little square. Below is the polar grid — drag the gold cell outward and watch its area <em>grow</em> even though $dr$ and $d\\theta$ never change.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">radius r</div><div class="v" id="rv">—</div></div><div class="rdc"><div class="k">arc = r·dθ</div><div class="v" id="arcv">—</div></div><div class="rdc"><div class="k">cell area ≈ r·dr·dθ</div><div class="v" id="cav">—</div></div></div>
    <div class="task"><b>The payoff integral</b>With $dA=r\\,dr\\,d\\theta$, the unit disk's area is $\\int_0^{2\\pi}\\!\\!\\int_0^1 r\\,dr\\,d\\theta$. Do the inner piece first: evaluate $\\int_0^1 r\\,dr$.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Why the cell area is $r\\,dr\\,d\\theta$.</b> Look at one polar cell — between radii $r$ and $r+dr$, and angles $\\theta$ and $\\theta+d\\theta$. Two of its sides are straight radial segments of length $dr$. The other two are little arcs, and an arc that subtends angle $d\\theta$ at radius $r$ has length $r\\,d\\theta$ (arc $=$ radius $\\times$ angle). For a thin cell it's almost a rectangle:</p>
    <div class="eqbox">$$dA\\approx(\\text{radial side})\\times(\\text{arc side})=dr\\cdot(r\\,d\\theta)=r\\,dr\\,d\\theta.$$</div>
    <p>Same $dr$, same $d\\theta$ — but a cell far out at large $r$ has a longer arc, so it is bigger. That growing factor <em>is</em> the extra $r$, and it's exactly the arc-growth you dragged through.</p>
    <p><b>The payoff.</b> The unit disk's area now falls out in two one-line integrals:</p>
    <div class="eqbox">$$\\int_0^{2\\pi}\\!\\!\\int_0^1 r\\,dr\\,d\\theta=\\Big(\\int_0^{2\\pi}\\!d\\theta\\Big)\\Big(\\int_0^1 r\\,dr\\Big)=2\\pi\\cdot\\tfrac12=\\pi,$$</div>
    <p>the familiar $\\pi r^2$ with $r=1$ — where Cartesian coordinates would have fought those square-root limits the whole way. Next we'll ask the same question for <em>any</em> change of coordinates, not just polar.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=40,cx=W/2,cy=H/2;
  const dth=Math.PI/6,dr=0.6,th0=Math.PI/6;
  const P=(r,t)=>[cx+r*Math.cos(t)*S,cy-r*Math.sin(t)*S];
  let r0=1;
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#1c2838';ctx.lineWidth=1;
    for(let r=1;r<=4;r++){ctx.beginPath();for(let i=0;i<=80;i++){const t=i/80*2*Math.PI;const p=P(r,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
    for(let k=0;k<12;k++){const t=k*Math.PI/6;ctx.beginPath();const a=P(0,t),b=P(4.3,t);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    ctx.fillStyle='rgba(232,184,75,0.28)';ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<=20;i++){const t=th0+dth*i/20;const p=P(r0,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
    for(let i=20;i>=0;i--){const t=th0+dth*i/20;const p=P(r0+dr,t);ctx.lineTo(p[0],p[1]);}
    ctx.closePath();ctx.fill();ctx.stroke();
    const mid=th0+dth/2;ctx.fillStyle='#dbe6f4';ctx.font='12px sans-serif';
    const pa=P(r0+dr+0.15,mid);ctx.fillText('r·dθ',pa[0]-6,pa[1]);
    const pdr=P(r0+dr/2,th0-0.12);ctx.fillText('dr',pdr[0]+2,pdr[1]+4);
    ctx.fillStyle='#5d7186';ctx.fillText('x',P(4.4,0)[0],P(4.4,0)[1]+4);ctx.fillText('y',P(4.4,Math.PI/2)[0]-4,P(4.4,Math.PI/2)[1]-4);
    document.getElementById('rv').textContent=r0.toFixed(2);
    document.getElementById('arcv').textContent=(r0*dth).toFixed(2);
    document.getElementById('cav').textContent=(r0*dr*dth).toFixed(2);}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));r0=Math.max(0.3,Math.min(3.2,X/W*3.5));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ 1/2</div><p>$\\int_0^1 r\\,dr=\\big[\\tfrac{r^2}{2}\\big]_0^1=\\tfrac12$. The outer integral just sweeps the angle, $\\int_0^{2\\pi}d\\theta=2\\pi$, so the disk area is $2\\pi\\cdot\\tfrac12=\\pi$. The whole trick was replacing $dx\\,dy$ with $r\\,dr\\,d\\theta$ — and that extra $r$ is the arc-growth you dragged.</p>`);});
  setHints([`∫₀¹ r dr = [r²/2] from 0 to 1.`,`(1²/2) − 0 = 1/2 = 0.5.`]);
}

function c7_jacobian(){
  stage.innerHTML=`<div class="card"><h2>The Jacobian: the area factor for <em>any</em> change of variables</h2>
    <p>Polar handed us the factor $r$ by looking at one cell. But polar is one map among many — you might stretch coordinates to fit an ellipse, shear them, or invent coordinates $(u,v)$ tailored to a region (that's all $u,v$ are: <em>your</em> chosen replacements for $x,y$). Each change rescales area by its own factor, and one formula delivers it every time. The one-variable case already shows the shape of the answer.</p>
    <div class="eqbox">$$\\int f(x)\\,dx=\\int f(g(u))\\,\\underbrace{|g'(u)|}_{\\text{length stretch}}\\,du.$$</div>
    <p>That's $u$-substitution from Module 6. Substituting $x=g(u)$ turns $dx$ into $|g'(u)|\\,du$: a step $du$ becomes a step $g'(u)\\,du$ in $x$, so lengths are rescaled by $|g'(u)|$. In two variables we're rescaling <b>area</b>, not length — so we need the factor by which a tiny patch of area grows under the map. Build it in two moves: first the area of a parallelogram, then where the parallelogram comes from.</p>

    <p><b>Move 1 — a parallelogram's area is a determinant.</b> Forget curvy maps for a moment. If a little cell's two edges are the vectors $\\mathbf e_1$ and $\\mathbf e_2$, what area do they enclose? Drag the tip of $\\mathbf e_2$ and watch.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">e&#8321;</div><div class="v" id="e1v">(2, 0)</div></div><div class="rdc"><div class="k">e&#8322;</div><div class="v" id="e2v">—</div></div><div class="rdc"><div class="k">area = |e&#8321;&#8339;e&#8322;&#7527; &#8722; e&#8321;&#7527;e&#8322;&#8339;|</div><div class="v" id="arv">—</div></div></div>
    <div class="task"><b>Read off the area rule</b>With edges $\\mathbf e_1=(2,0)$ and $\\mathbf e_2=(1,3)$, what area do they span? (Drag to check, or compute $|e_{1x}e_{2y}-e_{1y}e_{2x}|$.)</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:14px">The parallelogram from $\\mathbf e_1=(a,b)$ and $\\mathbf e_2=(c,d)$ has area $|ad-bc|$ — largest when the edges are perpendicular, shrinking to $0$ as they line up (a flattened, degenerate cell). That combination is the <b>$2\\times2$ determinant</b>:</p>
    <div class="eqbox">$$\\text{area}=\\Big|\\det\\begin{pmatrix}a&c\\\\ b&d\\end{pmatrix}\\Big|=|ad-bc|.$$</div>

    <p><b>Move 2 — where the edge vectors come from.</b> A change of variables is a <b>map</b> with two output formulas: an $x$-formula $x(u,v)$ and a $y$-formula $y(u,v)$. Each is an ordinary function — give it $u$ and $v$, get a number back. The only question is: take one small step along a grid line, and where does the output point go?</p>
    <p><b>Step in $u$ only.</b> Hold $v$ fixed and raise $u$ by a small amount $du$. How far does each output coordinate shift? With $v$ pinned, $x$ depends on the single variable $u$, so the plain linear approximation behind the derivative — $\\text{change}\\approx\\text{rate}\\times\\text{step}$ — applies to the $x$-formula, and the same to the $y$-formula:</p>
    <div class="eqbox">$$\\Delta x\\approx\\frac{\\partial x}{\\partial u}\\,du,\\qquad \\Delta y\\approx\\frac{\\partial y}{\\partial u}\\,du.$$</div>
    <p>$\\partial x/\\partial u$ is just the rate the $x$-output climbs per unit of $u$ (with $v$ held still), so across a step $du$ the $x$-output moves by that rate times $du$; same for $y$. The point started at $(x,y)$ and now sits at $(x+\\Delta x,\\ y+\\Delta y)$. Draw the little arrow from the old spot to the new one — the <b>displacement</b> — and it is</p>
    <div class="eqbox">$$\\mathbf e_1=\\Big(\\frac{\\partial x}{\\partial u},\\ \\frac{\\partial y}{\\partial u}\\Big)\\,du.$$</div>
    <p>One component is how far the point slid sideways, the other how far up. (For polar, a step in $r$ works out to $(\\cos\\theta,\\sin\\theta)\\,dr$ — a short move straight out along the radius, which is exactly what raising $r$ does.)</p>
    <p><b>Step in $v$ only.</b> Now pin $u$ and nudge $v$ by $dv$ instead; the identical reasoning gives the other edge,</p>
    <div class="eqbox">$$\\mathbf e_2=\\Big(\\frac{\\partial x}{\\partial v},\\ \\frac{\\partial y}{\\partial v}\\Big)\\,dv.$$</div>
    <p>Those two arrows $\\mathbf e_1$ and $\\mathbf e_2$ are the sides of the little parallelogram the grid square turns into. Place the gold cell in the input grid on the left and watch where it lands on the right — the two arrows are exactly these edges.</p>
    <div class="seg" id="segm"></div>
    <canvas id="cvm" width="640" height="360"></canvas>
    <p class="small" id="obsm" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k">u-edge ∂(x,y)/∂u · du</div><div class="v" id="juv">—</div></div><div class="rdc"><div class="k">v-edge ∂(x,y)/∂v · dv</div><div class="v" id="jvv">—</div></div><div class="rdc"><div class="k">area factor |det J|</div><div class="v" id="detv">—</div></div></div>

    <p style="margin-top:16px"><b>Assemble it.</b> The two edge vectors are the columns of a matrix of partial derivatives — the <b>Jacobian</b> — and Move 1 says the cell's area is the absolute determinant of that matrix, times $du\\,dv$:</p>
    <div class="eqbox">$$dx\\,dy=|\\det J|\\,du\\,dv,\\qquad J=\\begin{pmatrix}\\tfrac{\\partial x}{\\partial u}&\\tfrac{\\partial x}{\\partial v}\\\\[3pt]\\tfrac{\\partial y}{\\partial u}&\\tfrac{\\partial y}{\\partial v}\\end{pmatrix}.$$</div>
    <p>It's the exact 2-D version of the 1-D line: $|g'(u)|$ rescaled length, $|\\det J|$ rescales area. The columns are the two edge arrows in the picture; the determinant turns them into the area they enclose.</p>

    <p><b>Check it against polar.</b> For $x=r\\cos\\theta,\\ y=r\\sin\\theta$ (so $u=r,\\ v=\\theta$), the two edge vectors are exactly the arrows you dragged: stepping $r$ gives $(\\cos\\theta,\\sin\\theta)$ — a unit radial step — and stepping $\\theta$ gives $(-r\\sin\\theta,\\ r\\cos\\theta)$ — a sideways step of length $r$. They're perpendicular, so the area is base $\\times$ height $=1\\cdot r$, and the determinant agrees:</p>
    <div class="eqbox">$$\\det J=\\cos\\theta\\,(r\\cos\\theta)-(-r\\sin\\theta)\\,\\sin\\theta=r(\\cos^2\\theta+\\sin^2\\theta)=r.$$</div>
    <p>That's the same $r$ the polar beat found by measuring the arc — now you can see why: the sideways edge <em>is</em> the arc $r\\,d\\theta$, and it grows with $r$ while the radial edge stays fixed. The formula reproduces it, and will hand you the factor for a stretch, a shear, or any coordinates you cook up.</p>

    <p><b>The full change-of-variables rule.</b> Swapping an integral into new coordinates, you replace $dx\\,dy$ by $|\\det J|\\,du\\,dv$ and re-express the region:</p>
    <div class="eqbox">$$\\iint_R f(x,y)\\,dx\\,dy=\\iint_S f\\big(x(u,v),y(u,v)\\big)\\,|\\det J|\\,du\\,dv.$$</div>
    <p>(ML echo: this is the machinery behind <b>normalizing flows</b>, where a network warps a simple distribution into a complex one and the log-likelihood picks up a $\\log|\\det J|$ term — the same Jacobian, tracking how the map stretches probability mass.)</p></div>`;

  const arrow=(c,X0,Y0,X1,Y1,col,w)=>{if(!c)return;c.strokeStyle=col;c.lineWidth=w||2.5;c.beginPath();c.moveTo(X0,Y0);c.lineTo(X1,Y1);c.stroke();const a=Math.atan2(Y1-Y0,X1-X0);c.fillStyle=col;c.beginPath();c.moveTo(X1,Y1);c.lineTo(X1-11*Math.cos(a-0.4),Y1-11*Math.sin(a-0.4));c.lineTo(X1-11*Math.cos(a+0.4),Y1-11*Math.sin(a+0.4));c.closePath();c.fill();};

  // ============ Move 1: parallelogram area = determinant ============
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=44,ox=150,oy=250;
  const px=x=>ox+x*S,py=y=>oy-y*S;
  const e1=[2,0];let e2=[1,2];
  function drawPar(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#16202f';ctx.lineWidth=1;for(let g=-1;g<=8;g++){ctx.beginPath();ctx.moveTo(px(g),py(-1));ctx.lineTo(px(g),py(4.5));ctx.stroke();ctx.beginPath();ctx.moveTo(px(-1),py(g));ctx.lineTo(px(8),py(g));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px(-1),py(0));ctx.lineTo(px(8),py(0));ctx.moveTo(px(0),py(-1));ctx.lineTo(px(0),py(4.5));ctx.stroke();
    const O=[px(0),py(0)],A=[px(e1[0]),py(e1[1])],B=[px(e1[0]+e2[0]),py(e1[1]+e2[1])],C=[px(e2[0]),py(e2[1])];
    ctx.fillStyle='rgba(122,184,255,0.16)';ctx.beginPath();ctx.moveTo(O[0],O[1]);ctx.lineTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(C[0],C[1]);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#3a4c66';ctx.lineWidth=1;ctx.stroke();
    arrow(ctx,O[0],O[1],A[0],A[1],'#7ab8ff');arrow(ctx,O[0],O[1],C[0],C[1],'#e8b84b');
    ctx.fillStyle='#7ab8ff';ctx.font='600 13px sans-serif';ctx.fillText('e₁',A[0]+6,A[1]+16);
    ctx.fillStyle='#e8b84b';ctx.fillText('e₂',C[0]-22,C[1]-2);
    const area=Math.abs(e1[0]*e2[1]-e1[1]*e2[0]);
    document.getElementById('e2v').textContent='('+e2[0].toFixed(1)+', '+e2[1].toFixed(1)+')';
    document.getElementById('arv').textContent=area.toFixed(2);}
  cv.style.touchAction='none';let drg=false;
  function setPar(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width)),Y=(e.clientY-r.top)*(H/Math.max(1,r.height));e2=[Math.max(-1.5,Math.min(4.5,(X-ox)/S)),Math.max(-1,Math.min(3.8,(oy-Y)/S))];drawPar();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setPar(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setPar(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  drawPar();

  // ============ Move 2: dual-grid map, cell -> parallelogram ============
  const MAPS={
    polar:{uname:'r',vname:'θ',umin:0.4,umax:3,vmin:0,vmax:2*Math.PI,du:0.5,dv:Math.PI/6,u0:1.5,v0:Math.PI/6,ug:0.5,vg:Math.PI/6,
      f:(u,v)=>[u*Math.cos(v),u*Math.sin(v)],Ju:(u,v)=>[Math.cos(v),Math.sin(v)],Jv:(u,v)=>[-u*Math.sin(v),u*Math.cos(v)],

      f:(u,v)=>[1.6*u,0.7*v],Ju:()=>[1.6,0],Jv:()=>[0,0.7],
      view:[0,5,0,2.6],det:()=>1.12,

      f:(u,v)=>[u+0.3*v,v+0.25*u*u],Ju:(u)=>[1,0.5*u],Jv:()=>[0.3,1],
      view:[0,4.2,0,5.8],det:(u)=>1-0.15*u,
      note:'Curvy: the grid bends and the cell shears. The factor |det J| = 1 − 0.15u changes from place to place — drag around and watch it.'}
  };
  let mkey='polar', u0=MAPS.polar.u0, v0=MAPS.polar.v0;
  const cvm=document.getElementById('cvm');const cm=cvm&&cvm.getContext&&cvm.getContext('2d');const Wm=cvm.width,Hm=cvm.height;
  const IX=40,IY=28,IW=250,IH=304, OXp=352,OYp=28,OW=256,OH=304;
  function drawMap(){if(!cm)return;cm.clearRect(0,0,Wm,Hm);const M=MAPS[mkey];
    // input isotropic
    const sIn=Math.min(IW/(M.umax-M.umin), IH/(M.vmax-M.vmin));const Cx=IX+IW/2,Cy=IY+IH/2,uc=(M.umin+M.umax)/2,vc=(M.vmin+M.vmax)/2;
    const Lx=u=>Cx+(u-uc)*sIn, Ly=v=>Cy-(v-vc)*sIn;
    // output isotropic
    const [xm,xM,ym,yM]=M.view;const sOut=Math.min(OW/(xM-xm),OH/(yM-ym));const Ox=OXp+OW/2,Oy=OYp+OH/2,xc=(xm+xM)/2,yc=(ym+yM)/2;
    const Rx=x=>Ox+(x-xc)*sOut, Ry=y=>Oy-(y-yc)*sOut;
    // pane frames
    cm.strokeStyle='#223247';cm.lineWidth=1;cm.strokeRect(IX,IY,IW,IH);cm.strokeRect(OXp,OYp,OW,OH);
    cm.fillStyle='#5d7186';cm.font='12px sans-serif';cm.fillText('input ('+M.uname+', '+M.vname+')',IX+4,IY-8);cm.fillText('output (x, y)',OXp+4,OYp-8);
    cm.fillStyle='#8095ab';cm.font='20px sans-serif';cm.fillText('↦',(IX+IW+OXp)/2-10,Hm/2);
    // input grid
    cm.strokeStyle='#1c2838';cm.lineWidth=1;
    for(let u=M.umin;u<=M.umax+1e-9;u+=M.ug){cm.beginPath();cm.moveTo(Lx(u),Ly(M.vmin));cm.lineTo(Lx(u),Ly(M.vmax));cm.stroke();}
    for(let v=M.vmin;v<=M.vmax+1e-9;v+=M.vg){cm.beginPath();cm.moveTo(Lx(M.umin),Ly(v));cm.lineTo(Lx(M.umax),Ly(v));cm.stroke();}
    // output warped grid
    cm.strokeStyle='#223a52';cm.lineWidth=1;
    for(let u=M.umin;u<=M.umax+1e-9;u+=M.ug){cm.beginPath();let st=false;for(let v=M.vmin;v<=M.vmax+1e-9;v+=(M.vmax-M.vmin)/60){const p=M.f(u,v);const X=Rx(p[0]),Y=Ry(p[1]);st?cm.lineTo(X,Y):cm.moveTo(X,Y);st=true;}cm.stroke();}
    for(let v=M.vmin;v<=M.vmax+1e-9;v+=M.vg){cm.beginPath();let st=false;for(let u=M.umin;u<=M.umax+1e-9;u+=(M.umax-M.umin)/60){const p=M.f(u,v);const X=Rx(p[0]),Y=Ry(p[1]);st?cm.lineTo(X,Y):cm.moveTo(X,Y);st=true;}cm.stroke();}
    // highlighted input cell
    cm.fillStyle='rgba(232,184,75,0.22)';cm.strokeStyle='#e8b84b';cm.lineWidth=2;

    // mapped cell (sample edges for curvature)

    const loop=[].concat(edge(u0,v0,u0+M.du,v0),edge(u0+M.du,v0,u0+M.du,v0+M.dv),edge(u0+M.du,v0+M.dv,u0,v0+M.dv),edge(u0,v0+M.dv,u0,v0));
    cm.fillStyle='rgba(232,184,75,0.22)';cm.strokeStyle='#e8b84b';cm.lineWidth=2;cm.beginPath();loop.forEach((p,i)=>i?cm.lineTo(p[0],p[1]):cm.moveTo(p[0],p[1]));cm.closePath();cm.fill();cm.stroke();
    // edge vectors from mapped corner

    const uend=[Rx(O[0]+ju[0]*M.du),Ry(O[1]+ju[1]*M.du)],vend=[Rx(O[0]+jv[0]*M.dv),Ry(O[1]+jv[1]*M.dv)];

  function buildSeg(){const el=document.getElementById('segm');if(!el)return;
