function c7_secondderiv(){
  stage.innerHTML=`<div class="card"><h2>Classifying a critical point: the second-derivative test</h2>
    <p>A zero gradient only says the surface is flat — it could be a valley, a peak, or a <b>saddle</b>. To tell them apart we look at the <em>curvature</em>, which lives in the second partials $f_{xx},f_{yy},f_{xy}$. Watch it happen on $f=x^2+c\\,xy+y^2$: the origin is always a critical point, but as you crank the cross-term $c$ the round bowl gets stretched, tips over, and finally splits into a saddle. Drag to change $c$.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">c (the xy term)</div><div class="v" id="cv0">—</div></div><div class="rdc"><div class="k">D = f&#8339;&#8339;f&#8339;&#8339;&#8722;f&#8339;&#8339;&#178;</div><div class="v" id="dv">—</div></div><div class="rdc"><div class="k">verdict</div><div class="v" id="vd">—</div></div></div>
    <div class="task"><b>Compute the discriminant</b>For $f=x^2+xy+y^2$ (that's $c=1$) the second partials are $f_{xx}=2$, $f_{yy}=2$, $f_{xy}=1$. Evaluate $D=f_{xx}\\,f_{yy}-f_{xy}^{\\,2}$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>Why one number decides it.</b> Shift the critical point to the origin with $f=0$ there. Since $\\nabla f=\\mathbf 0$, the first-order terms vanish and the Taylor expansion starts at second order — near the point the surface <em>is</em> a quadratic:</p>
    <div class="eqbox">$f(x,y)\\approx\\tfrac12\\big(f_{xx}\\,x^2+2f_{xy}\\,xy+f_{yy}\\,y^2\\big)=\\tfrac12\\,Q(x,y).$</div>
    <p>So the point is a minimum exactly when $Q&gt;0$ in every direction, a maximum when $Q&lt;0$ everywhere, and a saddle when $Q$ takes both signs. Write $A=f_{xx}$, $B=f_{xy}$, $C=f_{yy}$ and <b>complete the square</b> (assume $A\\neq0$):</p>
    <div class="eqbox">$Q=Ax^2+2Bxy+Cy^2=A\\Big(x+\\tfrac{B}{A}y\\Big)^{2}+\\Big(C-\\tfrac{B^2}{A}\\Big)y^{2}=A\\Big(x+\\tfrac{B}{A}y\\Big)^{2}+\\frac{AC-B^{2}}{A}\\,y^{2}.$</div>
    <p>Now $Q$ is a sum of two squares, with coefficients $A$ and $\\dfrac{AC-B^2}{A}$. Let $D=AC-B^{2}=f_{xx}f_{yy}-f_{xy}^{\\,2}$. Reading off the signs:</p>
    <p>&bull; <b>$D&gt;0$:</b> then $\\frac{AC-B^2}{A}$ has the same sign as $A$, so <em>both</em> squared terms carry that sign — $Q$ is one-signed. If $A=f_{xx}&gt;0$ it's a <b>minimum</b>; if $f_{xx}&lt;0$, a <b>maximum</b>.</p>
    <p>&bull; <b>$D&lt;0$:</b> the two coefficients have opposite signs, so $Q$ is positive along one axis and negative along another — a <b>saddle</b>.</p>
    <p>&bull; <b>$D=0$:</b> one square drops out; the quadratic is flat in a direction and the test is <b>inconclusive</b> (higher terms decide).</p>
    <p>That is the whole test. For $f=x^2+cxy+y^2$: $A=C=2$, $B=c$, so $D=4-c^2$. It is positive (a bowl) until $|c|=2$, then negative (a saddle) — exactly the flip you dragged through above.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=40,cx=W/2,cy=H/2;
  let c=0;
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    const step=3,wp=step/S,lvl=2.2;
    for(let X=0;X<W;X+=step)for(let Y=0;Y<H;Y+=step){
      const x=(X-cx)/S,y=(cy-Y)/S;const v=x*x+c*x*y+y*y;
      const gx=2*x+c*y,gy=c*x+2*y,g=Math.sqrt(gx*gx+gy*gy)+1e-6;
      const d=v-Math.round(v/lvl)*lvl;
      if(Math.abs(d)<0.7*g*wp){const near0=Math.abs(Math.round(v/lvl))<0.5;ctx.fillStyle=near0?'#e8b84b':'#4f7bb0';ctx.fillRect(X,Y,step,step);}}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
    ctx.fillStyle='#3fb98f';ctx.beginPath();ctx.arc(cx,cy,4,0,7);ctx.fill();
    const D=4-c*c;
    document.getElementById('cv0').textContent=c.toFixed(2);
    document.getElementById('dv').textContent=D.toFixed(2);
    document.getElementById('vd').textContent=D>0.06?'bowl → minimum':(D<-0.06?'saddle':'borderline');}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));c=Math.max(0,Math.min(3,X/W*3));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),3,()=>{addReveal(`<div class="rh">✓ D = 3</div><p>$D=(2)(2)-1^2=4-1=3&gt;0$, and $f_{xx}=2&gt;0$, so the origin is a <b>minimum</b> — the gently tilted bowl you see at $c=1$. Push $c$ past $2$ on the canvas and $D=4-c^2$ turns negative: the closed loops open into the crossing curves of a saddle, and the gold curve is the zero-level $Q=0$ where the two directions of curvature cancel.</p>`);});
  setHints([`D = f_xx·f_yy − f_xy². Here f_xx=2, f_yy=2, f_xy=1.`,`2·2 − 1·1 = 4 − 1 = 3. Positive with f_xx>0 ⇒ minimum.`]);
}

function c7_lagrange(){
  stage.innerHTML=`<div class="card"><h2>Lagrange multipliers: optimizing on a constraint</h2>
    <p>Often you don't want the free minimum of $f$ — you want the best value <em>along a curve</em> $g=c$. Concretely: split $10$ into two pieces $x+y=10$ so the product $f=xy$ is as large as possible (the largest rectangle of a fixed perimeter). Drag the split below; the rectangle's area $xy$ is the readout, and the faint hyperbolas are the level curves $xy=\\text{const}$.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">y = 10 &#8722; x</div><div class="v" id="yv">—</div></div><div class="rdc"><div class="k">area f = xy</div><div class="v" id="av">—</div></div></div>
    <div class="task"><b>Maximize the product</b>Slide to the largest area, or solve it: what is the maximum of $f=xy$ subject to $x+y=10$?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>The tangency idea.</b> Walk along the constraint curve $g=c$. The rate of change of $f$ as you move in the tangent direction $\\mathbf T$ is the directional derivative $\\nabla f\\cdot\\mathbf T$ (from the directional-derivative beat). At a constrained max or min there's no first-order change along the curve, so</p>
    <div class="eqbox">$\\nabla f\\cdot\\mathbf T=0\\quad\\Longrightarrow\\quad \\nabla f\\perp\\mathbf T.$</div>
    <p>But the constraint curve <em>is</em> a level curve of $g$, and the gradient is always perpendicular to its own level curves (the gradient beat), so $\\nabla g\\perp\\mathbf T$ too. Two vectors perpendicular to the same tangent line must be parallel:</p>
    <div class="eqbox">$\\boxed{\\;\\nabla f=\\lambda\\,\\nabla g\\;}$</div>
    <p>That single scalar $\\lambda$ (the <b>Lagrange multiplier</b>) plus the constraint $g=c$ give enough equations to solve. Geometrically it says: at the optimum the level curve of $f$ is <em>tangent</em> to the constraint — which is exactly the gold hyperbola kissing the line in the picture when you hit the best split.</p>
    <p><b>Solve our problem.</b> Here $f=xy$ and $g=x+y$, so $\\nabla f=(y,x)$ and $\\nabla g=(1,1)$:</p>
    <div class="eqbox">$(y,x)=\\lambda(1,1)\\;\\Rightarrow\\; y=\\lambda,\\ x=\\lambda\\;\\Rightarrow\\; x=y.$</div>
    <p>Combined with $x+y=10$ this gives $x=y=5$, so the maximum product is $f=5\\cdot5=25$. The best rectangle of fixed perimeter is the <b>square</b> — Lagrange recovers the classic result, and the same $\\nabla f=\\lambda\\nabla g$ scales up to constrained optimization in any number of variables.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=30,ox=60,oy=340;
  const px=x=>ox+x*S,py=y=>oy-y*S;
  let x0=2;
  function arrow(X0,Y0,X1,Y1,col){if(!ctx)return;ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.stroke();const a=Math.atan2(Y1-Y0,X1-X0);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X1-10*Math.cos(a-0.4),Y1-10*Math.sin(a-0.4));ctx.lineTo(X1-10*Math.cos(a+0.4),Y1-10*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);const y0=10-x0;
    ctx.strokeStyle='#16202f';ctx.lineWidth=1;for(let g=0;g<=11;g++){ctx.beginPath();ctx.moveTo(px(g),py(0));ctx.lineTo(px(g),py(11));ctx.stroke();ctx.beginPath();ctx.moveTo(px(0),py(g));ctx.lineTo(px(11),py(g));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px(0),py(0));ctx.lineTo(px(11),py(0));ctx.moveTo(px(0),py(0));ctx.lineTo(px(0),py(11));ctx.stroke();
    // faint level curves xy=k
    for(const k of [9,16,25]){ctx.strokeStyle=k===25?'#5a4a24':'#233042';ctx.lineWidth=k===25?1.6:1.2;ctx.beginPath();let st=false;for(let xx=k/11;xx<=11;xx+=0.05){const yy=k/xx;if(yy>11)continue;const X=px(xx),Y=py(yy);st?ctx.lineTo(X,Y):ctx.moveTo(X,Y);st=true;}ctx.stroke();}
    // current level curve xy=x0*y0 gold
    const k0=x0*y0;ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();let s2=false;for(let xx=Math.max(0.05,k0/11);xx<=11;xx+=0.03){const yy=k0/xx;if(yy>11)continue;const X=px(xx),Y=py(yy);s2?ctx.lineTo(X,Y):ctx.moveTo(X,Y);s2=true;}ctx.stroke();
    // rectangle
    ctx.fillStyle='rgba(122,184,255,0.10)';ctx.fillRect(px(0),py(y0),x0*S,y0*S);
    ctx.strokeStyle='#3a4c66';ctx.lineWidth=1;ctx.strokeRect(px(0),py(y0),x0*S,y0*S);
    // constraint line x+y=10
    ctx.strokeStyle='#7ab8ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(px(0),py(10));ctx.lineTo(px(10),py(0));ctx.stroke();
    // gradients at point
    arrow(px(x0),py(y0),px(x0)+y0*6,py(y0)-x0*6,'#e8b84b'); // grad f = (y,x)
    arrow(px(x0),py(y0),px(x0)+1*22,py(y0)-1*22,'#3fb98f'); // grad g = (1,1)
    ctx.fillStyle='#dbe6f4';ctx.beginPath();ctx.arc(px(x0),py(y0),5,0,7);ctx.fill();
    ctx.fillStyle='#5d7186';ctx.font='12px sans-serif';ctx.fillText('x + y = 10',px(6.4),py(4.2));
    document.getElementById('xv').textContent=x0.toFixed(2);
    document.getElementById('yv').textContent=y0.toFixed(2);
    document.getElementById('av').textContent=(x0*y0).toFixed(2);}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));x0=Math.max(0.5,Math.min(9.5,(X-ox)/S));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),25,()=>{addReveal(`<div class="rh">✓ 25</div><p>At $x=y=5$ the product is $25$. Notice on the canvas that this is exactly where the gold hyperbola $xy=25$ just touches the line $x+y=10$ — tangent — and where the two arrows $\\nabla f=(y,x)$ and $\\nabla g=(1,1)$ point the same way, i.e. $\\nabla f=\\lambda\\nabla g$. Move off the square and the hyperbola cuts the line instead of kissing it, and the area drops.</p>`);});
  setHints([`∇f=(y,x)=λ(1,1)=λ∇g forces x=y. Put that into x+y=10.`,`x=y=5, so f=xy=25.`]);
}

function c7_changevars(){
  stage.innerHTML=`<div class="card"><h2>Change of variables: where the extra r comes from</h2>
    <p>Some regions — disks, rings, anything round — are painful in $x,y$ but easy in <b>polar</b> coordinates $x=r\\cos\\theta,\\ y=r\\sin\\theta$. But you can't just swap $dx\\,dy$ for $dr\\,d\\theta$: a little polar cell isn't the same size as a little rectangle. Below is the polar grid; drag to move the gold cell outward and watch its area grow even though $dr$ and $d\\theta$ never change.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">radius r</div><div class="v" id="rv">—</div></div><div class="rdc"><div class="k">arc = r·dθ</div><div class="v" id="arcv">—</div></div><div class="rdc"><div class="k">cell area ≈ r·dr·dθ</div><div class="v" id="cav">—</div></div></div>
    <div class="task"><b>The payoff integral</b>With $dA=r\\,dr\\,d\\theta$, the unit disk's area is $\\int_0^{2\\pi}\\!\\!\\int_0^1 r\\,dr\\,d\\theta$. First do the inner piece: evaluate $\\int_0^1 r\\,dr$.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>Why the cell area is $r\\,dr\\,d\\theta$.</b> Look at one polar cell, between radii $r$ and $r+dr$ and angles $\\theta$ and $\\theta+d\\theta$. Two of its sides are straight radial segments of length $dr$. The other two are little arcs; an arc of angle $d\\theta$ at radius $r$ has length $r\\,d\\theta$ (arc $=$ radius $\\times$ angle). For a thin cell it's nearly a rectangle:</p>
    <div class="eqbox">$dA\\approx(\\text{radial side})\\times(\\text{arc side})=dr\\cdot(r\\,d\\theta)=r\\,dr\\,d\\theta.$</div>
    <p>Same $dr$, same $d\\theta$, but a cell out at large $r$ has a longer arc — so it's bigger. That growing factor is the $r$.</p>
    <p><b>The general rule.</b> Under any change $(u,v)\\mapsto(x,y)$, a $du\\times dv$ cell maps to a parallelogram. Its edges are the vectors $\\big(\\tfrac{\\partial x}{\\partial u},\\tfrac{\\partial y}{\\partial u}\\big)du$ and $\\big(\\tfrac{\\partial x}{\\partial v},\\tfrac{\\partial y}{\\partial v}\\big)dv$, and the area of a parallelogram spanned by $(a,b)$ and $(c,d)$ is $|ad-bc|$ — a $2\\times2$ determinant, the <b>Jacobian</b>:</p>
    <div class="eqbox">$dx\\,dy=|J|\\,du\\,dv,\\qquad J=\\frac{\\partial x}{\\partial u}\\frac{\\partial y}{\\partial v}-\\frac{\\partial x}{\\partial v}\\frac{\\partial y}{\\partial u}.$</div>
    <p>For polar, $\\tfrac{\\partial x}{\\partial r}=\\cos\\theta,\\ \\tfrac{\\partial y}{\\partial r}=\\sin\\theta,\\ \\tfrac{\\partial x}{\\partial\\theta}=-r\\sin\\theta,\\ \\tfrac{\\partial y}{\\partial\\theta}=r\\cos\\theta$, so</p>
    <div class="eqbox">$J=\\cos\\theta\\,(r\\cos\\theta)-(-r\\sin\\theta)\\,\\sin\\theta=r\\cos^2\\theta+r\\sin^2\\theta=r.$</div>
    <p>The determinant confirms the picture: $|J|=r$. And the payoff — the disk area $\\int_0^{2\\pi}\\!\\int_0^1 r\\,dr\\,d\\theta=2\\pi\\cdot\\tfrac12=\\pi$, i.e. $\\pi r^2$ with $r=1$ — falls out in two easy single integrals, where Cartesian would have fought $\\sqrt{1-x^2}$ limits.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height,S=40,cx=W/2,cy=H/2;
  const dth=Math.PI/6,dr=0.6,th0=Math.PI/6;
  const P=(r,t)=>[cx+r*Math.cos(t)*S,cy-r*Math.sin(t)*S];
  let r0=1;
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#1c2838';ctx.lineWidth=1;
    for(let r=1;r<=4;r++){ctx.beginPath();for(let i=0;i<=80;i++){const t=i/80*2*Math.PI;const p=P(r,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
    for(let k=0;k<12;k++){const t=k*Math.PI/6;ctx.beginPath();const a=P(0,t),b=P(4.3,t);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    // highlighted cell
    ctx.fillStyle='rgba(232,184,75,0.28)';ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<=20;i++){const t=th0+dth*i/20;const p=P(r0,t);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}
    for(let i=20;i>=0;i--){const t=th0+dth*i/20;const p=P(r0+dr,t);ctx.lineTo(p[0],p[1]);}
    ctx.closePath();ctx.fill();ctx.stroke();
    // labels dr and arc
    const mid=th0+dth/2;const pr=P(r0+dr/2,th0);ctx.fillStyle='#dbe6f4';ctx.font='12px sans-serif';
    const pa=P(r0+dr+0.15,mid);ctx.fillText('r·dθ',pa[0]-6,pa[1]);
    const pdr=P(r0+dr/2,th0-0.12);ctx.fillText('dr',pdr[0]+2,pdr[1]+4);
    ctx.fillStyle='#5d7186';ctx.fillText('x',P(4.4,0)[0],P(4.4,0)[1]+4);ctx.fillText('y',P(4.4,Math.PI/2)[0]-4,P(4.4,Math.PI/2)[1]-4);
    document.getElementById('rv').textContent=r0.toFixed(2);
    document.getElementById('arcv').textContent=(r0*dth).toFixed(2);
    document.getElementById('cav').textContent=(r0*dr*dth).toFixed(2);}
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));r0=Math.max(0.3,Math.min(3.2,X/W*3.5));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ 1/2</div><p>$\\int_0^1 r\\,dr=\\big[\\tfrac{r^2}{2}\\big]_0^1=\\tfrac12$. The outer integral just sweeps the angle: $\\int_0^{2\\pi}d\\theta=2\\pi$, so the disk area is $2\\pi\\cdot\\tfrac12=\\pi$ — the familiar $\\pi r^2$. The whole trick was replacing $dx\\,dy$ with $r\\,dr\\,d\\theta$; that extra $r$ is the Jacobian, and it's exactly the arc-growth you dragged through.</p>`);});
  setHints([`∫₀¹ r dr = [r²/2] from 0 to 1.`,`(1²/2) − 0 = 1/2 = 0.5.`]);
}

function c7_doubleint(){
  stage.innerHTML=`<div class="card"><h2>Double integrals: volume over a region</h2>
    <p>Integration also lifts to two variables. The <b>double integral</b> $\\iint_R f\\,dA$ is the signed volume between the surface $z=f(x,y)$ and the region $R$ in the plane — the 2-D echo of "area under a curve." Build it the same way: chop $R$ into little cells, multiply each cell's area by the height above it, and sum. Tap to refine the grid over the unit square with $f=x+y$ and watch the sum settle.</p>
    <div class="seg" id="seg"></div>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">grid</div><div class="v" id="nv">—</div></div><div class="rdc"><div class="k">Riemann sum</div><div class="v" id="sv">—</div></div></div>
    <div class="task"><b>The volume</b>What does $\\displaystyle\\iint_{[0,1]\\times[0,1]}(x+y)\\,dA$ come out to? (Read it off the refining sum, or compute — it's a round number.)</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>The definition.</b> Grid $R$ into cells of area $\\Delta A=\\Delta x\\,\\Delta y$, sample the height $f(x_i,y_j)$ in each, and take the limit as the cells shrink — a double Riemann sum:</p>
    <div class="eqbox">$$\\iint_R f\\,dA=\\lim_{\\Delta A\\to0}\\sum_i\\sum_j f(x_i,y_j)\\,\\Delta A$$</div>
    <p>For a positive $f$ each term is the volume of a thin box (base $\\Delta A$, height $f$), so the sum is the total volume. Exactly as in one variable, we don't want this limit by hand — the next beat turns it into ordinary single integrals.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const X0=180,X1=520,Y0=350,Y1=30;   // unit square region on canvas
  const px=x=>X0+x*(X1-X0),py=y=>Y0+y*(Y1-Y0);
  const f=(x,y)=>x+y;const ns=['4','8','16'];let sel='4';
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    const n=parseInt(sel),d=1/n;let S=0;
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){const xc=(i+0.5)*d,yc=(j+0.5)*d,h=f(xc,yc);S+=h*d*d;
      const t=h/2;ctx.fillStyle='rgb('+Math.round(50+t*170)+','+Math.round(90+t*90)+','+Math.round(210-t*140)+')';
      ctx.fillRect(px(i*d),py((j+1)*d),(X1-X0)/n,(Y0-Y1)/n);}
    ctx.strokeStyle='rgba(13,20,32,0.5)';ctx.lineWidth=1;
    for(let i=0;i<=n;i++){ctx.beginPath();ctx.moveTo(px(i*d),py(0));ctx.lineTo(px(i*d),py(1));ctx.stroke();ctx.beginPath();ctx.moveTo(px(0),py(i*d));ctx.lineTo(px(1),py(i*d));ctx.stroke();}
    ctx.strokeStyle='#8095ab';ctx.lineWidth=1.5;ctx.strokeRect(px(0),py(1),X1-X0,Y0-Y1);
    ctx.fillStyle='#5d7186';ctx.font='12px sans-serif';ctx.fillText('R = [0,1]×[0,1],  height f = x+y (dark→light)',X0,Y0+22);
    document.getElementById('nv').textContent=n+' × '+n;
    document.getElementById('sv').textContent=S.toFixed(4);}
  function build(){document.getElementById('seg').innerHTML=ns.map(k=>`<span class="segb ${k===sel?'on':''}" data-k="${k}">${k}×${k}</span>`).join('');
    document.querySelectorAll('#seg .segb').forEach(b=>b.onclick=()=>{sel=b.dataset.k;build();draw();});}
  build();draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ 1</div><p>The refining sums close in on $1$. By symmetry it's believable: the average height of $x+y$ over the unit square is $1$ (average of $x$ is $\\tfrac12$, of $y$ is $\\tfrac12$), times area $1$. The next beat computes it exactly with iterated integrals.</p>`);});
  setHints([`Crank the grid up and read the Riemann-sum box — it settles on a whole number.`,`It approaches 1.`]);
}

function c7_iterated(){
  stage.innerHTML=`<div class="card"><h2>Iterated integrals: slice, then stack</h2>
    <p>A double integral is computed as two ordinary integrals, one variable at a time (<b>Fubini's theorem</b>). The idea is exactly volume-by-slices from Module 6: at a fixed $y$, the slice through the solid has cross-sectional area $A(y)=\\int f(x,y)\\,dx$; sweeping $y$ and stacking those slices fills the volume $\\int A(y)\\,dy$. Below is the solid under $z=f(x,y)=x+y$ over $[0,3]\\times[0,2]$ in 3-D — drag left-to-right to sweep the gold slice and watch the solid build up.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">slice y</div><div class="v" id="yv">—</div></div><div class="rdc"><div class="k">slice area A(y)</div><div class="v" id="av">—</div></div><div class="rdc"><div class="k">volume so far</div><div class="v" id="vv">—</div></div></div>
    <div class="task"><b>Evaluate the whole thing</b>Sweep all the way, or compute: $\\displaystyle\\int_0^2\\!\\!\\int_0^3 (x+y)\\,dx\\,dy$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>Work it inside-out.</b> The <em>inner</em> integral treats $y$ as a constant and integrates over $x$ — that is the slice area:</p>
    <div class="eqbox">$$A(y)=\\int_0^3 (x+y)\\,dx=\\Big[\\tfrac{x^2}{2}+xy\\Big]_0^3=\\tfrac{9}{2}+3y$$</div>
    <p>Then the <em>outer</em> integral stacks the slices over $y$:</p>
    <div class="eqbox">$$\\int_0^2\\Big(\\tfrac{9}{2}+3y\\Big)dy=\\Big[\\tfrac92 y+\\tfrac{3}{2}y^2\\Big]_0^2=9+6=15$$</div>
    <p>So the volume is $15$. Fubini also lets you swap the order — integrate over $y$ first, then $x$ — and you get the same number; choose whichever is easier. That's the whole computational engine of multivariable integration.</p></div>`;
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const OX=150,OY=260,exX=50,exY=17,eyX=48,eyY=-31,ezZ=24;
  const P=(x,y,z)=>[OX+x*exX+y*eyX, OY+x*exY+y*eyY-z*ezZ];
  const f=(x,y)=>x+y;let y0=1;
  function poly(pts,fill,stroke,w){if(!ctx)return;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||1;ctx.stroke();}}
  function seg(a,b,color,w){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=w||1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    // base region (z=0)
    poly([P(0,0,0),P(3,0,0),P(3,2,0),P(0,2,0)],'rgba(20,30,45,0.65)',null);
    for(let gx=0;gx<=3;gx++)seg(P(gx,0,0),P(gx,2,0),'#243347',1);
    for(let gy=0;gy<=2;gy++)seg(P(0,gy,0),P(3,gy,0),'#243347',1);
    // fill the solid from y=0 up to y0, back(y0) to front(0) so nearer slices overlay
    const step=0.045;
    for(let y=y0;y>=-1e-9;y-=step){
      poly([P(0,y,0),P(3,y,0),P(3,y,f(3,y)),P(0,y,f(0,y))],'rgba(122,184,255,0.11)',null);}
    // current slice, gold
    poly([P(0,y0,0),P(3,y0,0),P(3,y0,f(3,y0)),P(0,y0,f(0,y0))],'rgba(232,184,75,0.30)','#e8b84b',2);
    // roof wireframe (surface boundary)
    seg(P(0,0,f(0,0)),P(3,0,f(3,0)),'#7ab8ff',1.5);
    seg(P(3,0,f(3,0)),P(3,2,f(3,2)),'#7ab8ff',1.5);
    seg(P(3,2,f(3,2)),P(0,2,f(0,2)),'#7ab8ff',1.5);
    seg(P(0,2,f(0,2)),P(0,0,f(0,0)),'#7ab8ff',1.5);
    // vertical edges
    seg(P(0,0,0),P(0,0,f(0,0)),'#3a4c66',1);seg(P(3,0,0),P(3,0,f(3,0)),'#3a4c66',1);
    seg(P(3,2,0),P(3,2,f(3,2)),'#3a4c66',1);seg(P(0,2,0),P(0,2,f(0,2)),'#3a4c66',1);
    ctx.fillStyle='#5d7186';ctx.font='12px sans-serif';
    ctx.fillText('z = x + y',P(0,2,f(0,2))[0]-4,P(0,2,f(0,2))[1]-8);
    ctx.fillText('x',P(3,0,0)[0]+6,P(3,0,0)[1]+4);ctx.fillText('y',P(0,2,0)[0]-14,P(0,2,0)[1]-2);
    document.getElementById('yv').textContent=y0.toFixed(2);
    document.getElementById('av').textContent=(4.5+3*y0).toFixed(2);
    document.getElementById('vv').textContent=(4.5*y0+1.5*y0*y0).toFixed(2);}
  let drg=false;cv.style.touchAction='none';
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));y0=Math.max(0,Math.min(2,(X-40)/(W-80)*2));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();
  numChk(stage.querySelector('.card'),15,()=>{addReveal(`<div class="rh">✓ 15</div><p>Inner integral (slice area) $A(y)=\\tfrac92+3y$; outer integral stacks the slices to $9+6=15$. Sweep the gold slice from $y=0$ to $2$ and the "volume so far" readout climbs to exactly $15$ — the slice areas run from $A(0)=4.5$ up to $A(2)=10.5$, and their accumulation is the solid's volume. Two single integrals, nested.</p>`);});
  setHints([`Inner first: ∫₀³(x+y)dx = 9/2 + 3y (treat y as constant). Then ∫₀²(9/2+3y)dy.`,`[9y/2 + 3y²/2] from 0 to 2 = 9 + 6 = 15.`]);
}

function c7_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Partials, gradients, optimization, and double integrals. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">partial derivatives</span><div class="ph">Problem 1</div>
    <p>For $f(x,y)=x^3y+y^2$, find $\\dfrac{\\partial f}{\\partial x}$ and $\\dfrac{\\partial f}{\\partial y}$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Holding $y$ fixed: $\\frac{\\partial f}{\\partial x}=3x^2y$. Holding $x$ fixed: $\\frac{\\partial f}{\\partial y}=x^3+2y$.</p></div></details></div>

    <div class="prob"><span class="lvl">gradient</span><div class="ph">Problem 2</div>
    <p>For $f(x,y)=x^2+3y^2$, find $\\nabla f$ at $(1,1)$ and its magnitude.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,6y)$, so at $(1,1)$ it is $(2,6)$. Magnitude $=\\sqrt{2^2+6^2}=\\sqrt{40}=2\\sqrt{10}\\approx6.32$.</p></div></details></div>

    <div class="prob"><span class="lvl">directional derivative</span><div class="ph">Problem 3</div>
    <p>For $f=x^2+y^2$ at $(3,4)$, find the directional derivative in the direction $\\mathbf u=\\left(\\tfrac35,\\tfrac45\\right)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(6,8)$; $\\mathbf u$ is a unit vector ($\\tfrac{9}{25}+\\tfrac{16}{25}=1$). $D_{\\mathbf u}f=(6,8)\\cdot(\\tfrac35,\\tfrac45)=\\tfrac{18}{5}+\\tfrac{32}{5}=\\tfrac{50}{5}=10$. It equals $|\\nabla f|$ — because $\\mathbf u$ points exactly along the gradient.</p></div></details></div>

    <div class="prob"><span class="lvl">critical point</span><div class="ph">Problem 4</div>
    <p>Find the critical point of $f(x,y)=x^2-4x+y^2+2y$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\frac{\\partial f}{\\partial x}=2x-4=0\\Rightarrow x=2$; $\\frac{\\partial f}{\\partial y}=2y+2=0\\Rightarrow y=-1$. Critical point $(2,-1)$ — a minimum (an upward bowl shifted off the origin).</p></div></details></div>

    <div class="prob"><span class="lvl">double integral</span><div class="ph">Problem 5</div>
    <p>Evaluate $\\displaystyle\\int_0^1\\!\\!\\int_0^2 xy\\,dx\\,dy$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Inner: $\\int_0^2 xy\\,dx=y\\big[\\tfrac{x^2}{2}\\big]_0^2=2y$. Outer: $\\int_0^1 2y\\,dy=[y^2]_0^1=1$.</p></div></details></div>

    <div class="prob"><span class="lvl">double integral</span><div class="ph">Problem 6</div>
    <p>Evaluate $\\displaystyle\\int_0^1\\!\\!\\int_0^1 (x^2+y^2)\\,dx\\,dy$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Inner: $\\int_0^1 (x^2+y^2)\\,dx=\\big[\\tfrac{x^3}{3}+xy^2\\big]_0^1=\\tfrac13+y^2$. Outer: $\\int_0^1(\\tfrac13+y^2)\\,dy=\\tfrac13+\\tfrac13=\\tfrac23$.</p></div></details></div>

    <div class="prob"><span class="lvl">steepest ascent</span><div class="ph">Problem 7</div>
    <p>At the point $(1,2)$ on $f(x,y)=x^2+y^2$, in which direction should you move to increase $f$ fastest, and how fast is that?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Fastest increase is along $\\nabla f=(2,4)$, i.e. direction $\\tfrac{1}{\\sqrt{20}}(2,4)=\\tfrac{1}{\\sqrt5}(1,2)$. The rate is $|\\nabla f|=\\sqrt{2^2+4^2}=\\sqrt{20}=2\\sqrt5\\approx4.47$.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — order swap</span><div class="ph">Problem 8</div>
    <p>Verify Fubini for $\\displaystyle\\iint_{[0,1]\\times[0,2]} x\\,dA$ by computing it both orders.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$dx$ first: $\\int_0^2\\!\\big(\\int_0^1 x\\,dx\\big)dy=\\int_0^2\\tfrac12\\,dy=1$. $dy$ first: $\\int_0^1\\!\\big(\\int_0^2 x\\,dy\\big)dx=\\int_0^1 2x\\,dx=1$. Same answer, $1$ — the order doesn't matter.</p></div></details></div>

    <div class="prob"><span class="lvl">second-derivative test</span><div class="ph">Problem 9</div>
    <p>The function $f(x,y)=x^2-y^2$ has a critical point at the origin. Classify it with $D=f_{xx}f_{yy}-f_{xy}^2$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$f_{xx}=2$, $f_{yy}=-2$, $f_{xy}=0$, so $D=(2)(-2)-0^2=-4&lt;0$. A negative discriminant means a <b>saddle</b> — it climbs along $x$ and falls along $y$, the textbook saddle surface.</p></div></details></div>

    <div class="prob"><span class="lvl">Lagrange multipliers</span><div class="ph">Problem 10</div>
    <p>Maximize $f(x,y)=x+y$ subject to $x^2+y^2=2$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(1,1)$, $\\nabla g=(2x,2y)$. Setting $(1,1)=\\lambda(2x,2y)$ gives $x=y$. The constraint $x^2+y^2=2$ then yields $2x^2=2$, so $x=y=1$ (taking the $+$ root for the max). Maximum $f=1+1=2$.</p></div></details></div>

    <div class="prob"><span class="lvl">change of variables</span><div class="ph">Problem 11</div>
    <p>Using $dA=r\\,dr\\,d\\theta$, find the area of the disk of radius $R$ by evaluating $\\displaystyle\\int_0^{2\\pi}\\!\\!\\int_0^{R} r\\,dr\\,d\\theta$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Inner: $\\int_0^{R} r\\,dr=\\tfrac{R^2}{2}$. Outer: $\\int_0^{2\\pi}\\tfrac{R^2}{2}\\,d\\theta=\\tfrac{R^2}{2}\\cdot2\\pi=\\pi R^2$ — the classic disk area, recovered in two one-line integrals thanks to the Jacobian factor $r$.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function c7_recap(){
  stage.innerHTML=`<div class="card"><h2>What you built</h2>
    <div class="eqbox" style="line-height:2.3">$$\\nabla f=\\Big(\\tfrac{\\partial f}{\\partial x},\\tfrac{\\partial f}{\\partial y}\\Big)\\ \\text{(steepest ascent, }\\perp\\text{ level curves)}\\qquad D_{\\mathbf u}f=\\nabla f\\cdot\\mathbf u$$
    <div style="text-align:center;line-height:2;color:#dbe6f4;margin-top:6px">partial = ordinary derivative, other variables held constant<br>critical points: $\\nabla f=\\mathbf 0$ · classify by $D=f_{xx}f_{yy}-f_{xy}^2$ · gradient descent: $\\mathbf x-\\alpha\\nabla f$<br>constrained optima: $\\nabla f=\\lambda\\nabla g$ · $\\iint_R f\\,dA=\\lim\\sum\\sum f\\,\\Delta A$ (volume)<br>iterated single integrals (Fubini), inside-out · change of variables: $dx\\,dy=|J|\\,du\\,dv$ (polar: $r\\,dr\\,d\\theta$)</div></div>
    <p>Multivariable calculus is single-variable calculus applied one direction at a time and then reassembled: partials are slice-slopes, the gradient bundles them into the steepest-ascent vector, second partials curve it into a min/max/saddle, and double integrals are areas-under-a-curve stacked into volumes. The gradient — and descending it — is the exact machinery underneath training a model.</p>
    <p><b>Next — Module 9:</b> <b>vector calculus</b>. Attach a vector to every point of the plane (a <em>vector field</em> — think flow or force), then integrate along curves and over surfaces; the Green, Stokes, and divergence theorems tie those integrals back to the derivatives from this module. Then Module 10 packs all these partials into <b>matrices</b> — the Jacobian, the Hessian, and the chain rule as matrix multiplication — the formal bridge into machine learning.</p></div>`;
  setHints([]);unlock();
}
