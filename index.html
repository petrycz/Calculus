/* ================= MODULE 5 — INTEGRATION & THE FTC ================= */
function c4_recall(){recallFrom(`Module 5 introduces the derivative's mirror image — so first rebuild the whole toolkit, from the function library through limits, the derivative, and its applications. Integration will lean on all of it.`,['c0','c1','c2','c3'],RECALL_HINT);}

function c4_intro(){
  stage.innerHTML=`<div class="card"><h2>The second pillar: accumulation</h2>
    <p>Module 1's intro named calculus's two questions. You've spent three modules on the first — <em>how fast is something changing?</em> — and answered it with the derivative. Now the second: <b>how much accumulates?</b></p>
    <p>Drive at a known speed and the distance covered is the <em>area</em> under the speed-vs-time graph. Pump water at a varying rate and the total delivered is the <em>area</em> under the rate curve. Accumulation is <b>area under a curve</b> — and that's the trouble. Geometry hands you the area of a rectangle or triangle, but the region under a curve like $y=x^2$ has a curved lid and no formula.</p>
    <p>The plan mirrors how the derivative was built. There, we approximated a tangent by secants and took a limit; here, we'll approximate a curved area by <b>rectangles</b> and take a limit — the <b>definite integral</b>. Then comes the surprise that names the module: the <b>Fundamental Theorem of Calculus</b>, which reveals that this area problem and the slope problem are <em>inverses</em> of each other. Accumulating and rating-of-change undo one another.</p>
    <div class="task"><b>Frame it</b>If $v(t)$ is speed at time $t$, what does the area under $v$ between $t=0$ and $t=5$ represent?</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['the total <b>distance</b> travelled over those 5 seconds','y'],['the <b>acceleration</b> at $t=5$','n'],['the top <b>speed</b> reached','n'],['the <b>slope</b> of the speed graph','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ Distance = area under the speed curve</div><p>Speed $\\times$ time is distance; when speed varies, you sum up speed over each tiny slice of time — exactly the area under $v(t)$. Rate integrated over an interval gives the total accumulated. That's the whole idea of the definite integral, and the next beat builds it from rectangles.</p>`);});
  setHints([`Speed × time = distance. Summing speed over each slice of time accumulates total distance.`]);
}

function c4_riemann(){
  stage.innerHTML=`<div class="card"><h2>Riemann sums: pave the area with rectangles</h2>
    <p>We can't yet find the area under $f(x)=x^2$ from $0$ to $3$ exactly — so let's trap it. Slice $[0,3]$ into $n$ equal strips of width $\\Delta x=\\tfrac3n$, cap each with a rectangle at its right edge $x_i=\\tfrac{3i}{n}$, and add the areas — the <b>Riemann sum</b> $R_n=\\sum_{i=1}^n f(x_i)\\,\\Delta x$. Tap to add rectangles and watch where the sum heads.</p>
    <div class="seg" id="seg"></div>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">n rectangles</div><div class="v" id="nv">—</div></div><div class="rdc"><div class="k">Rₙ (sum)</div><div class="v" id="rv">—</div></div></div>
    <div class="task"><b>Find the limit</b>As $n$ grows the staircase hugs the curve and $R_n$ closes in on one number. Read it off the trend and enter it.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>Now prove it.</b> You watched $R_n$ fall from $R_3=14$ toward that value; here it is exactly, by computing $R_n$ in closed form and taking the limit.</p>
    <p><b>1. The height</b> at the right edge $x_i=\\tfrac{3i}{n}$ is $f(x_i)=\\big(\\tfrac{3i}{n}\\big)^2=\\tfrac{9i^2}{n^2}$.</p>
    <p><b>2. Assemble the sum,</b> pulling the $i$-independent factors out front:</p>
    <div class="eqbox">$$R_n=\\sum_{i=1}^{n}\\frac{9i^2}{n^2}\\cdot\\frac{3}{n}=\\frac{27}{n^3}\\sum_{i=1}^{n}i^2$$</div>
    <p><b>3. Use the sum-of-squares identity</b> $\\sum_{i=1}^n i^2=\\tfrac{n(n+1)(2n+1)}{6}$ (provable by induction):</p>
    <div class="eqbox">$$R_n=\\frac{27}{n^3}\\cdot\\frac{n(n+1)(2n+1)}{6}=\\frac{27(n+1)(2n+1)}{6n^2}$$</div>
    <p><b>4. Divide through and take the limit,</b> using $(n+1)(2n+1)=2n^2+3n+1$:</p>
    <div class="eqbox">$$R_n=\\frac{9}{2}\\Big(2+\\frac{3}{n}+\\frac{1}{n^2}\\Big)\\;\\xrightarrow{\\,n\\to\\infty\\,}\\;\\frac{9}{2}\\cdot 2=9$$</div>
    <p>The $\\tfrac3n$ overshoot you watched shrink is exactly the term that vanishes. We name this limit the <b>definite integral</b>: $\\int_0^3 x^2\\,dx=\\lim_{n\\to\\infty}R_n=9$.</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.3,ymin:-0.6,ymax:9.8});
  const f=x=>x*x,A=0,B=3;let n=6;
  const riem=n=>{let s=0;const dx=(B-A)/n;for(let i=1;i<=n;i++)s+=f(A+i*dx)*dx;return s;};
  function draw(){pl.grid();const{ctx}=pl;const dx=(B-A)/n;
    for(let i=0;i<n;i++){const xl=A+i*dx,h=f(xl+dx);const X0=pl.px(xl),X1=pl.px(xl+dx),Y0=pl.py(0),Y1=pl.py(h);
      ctx.fillStyle='rgba(122,184,255,0.16)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);
      ctx.strokeStyle='rgba(122,184,255,0.55)';ctx.lineWidth=1;ctx.strokeRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');
    document.getElementById('nv').textContent=n;
    document.getElementById('rv').textContent=riem(n).toFixed(3);}
  function build(){const ns=[3,6,12,24,48,96];document.getElementById('seg').innerHTML=ns.map(k=>`<span class="segb ${k===n?'on':''}" data-k="${k}">${k}</span>`).join('');
    document.querySelectorAll('#seg .segb').forEach(b=>b.onclick=()=>{n=+b.dataset.k;build();draw();});}
  build();draw();
  numChk(stage.querySelector('.card'),9,()=>{addReveal(`<div class="rh">✓ Exactly 9</div><p>Staircase and closed-form limit agree: $\\int_0^3 x^2\\,dx=9$. The next beat formalizes what this limit means — including when the curve dips negative.</p>`);});
  setHints([`Read the Rₙ box as you raise n: 14, 11.4, 10.2, 9.6, 9.3, 9.1… what whole number is it converging to?`,`It approaches 9.`]);
}

function c4_defint(){
  stage.innerHTML=`<div class="card"><h2>The definite integral: signed area as a limit</h2>
    <p>The limit you just computed isn't special to $x^2$. For any continuous $f$, the Riemann sums converge to the same number however you slice (equal widths or not) and wherever inside each strip you sample the height. That common limit is the <b>definite integral</b>:</p>
    <div class="eqbox">$$\\int_a^b f(x)\\,dx = \\lim_{n\\to\\infty}\\sum_{i=1}^{n} f(x_i)\\,\\Delta x \\qquad \\color{#5d7186}{(\\text{strips shrinking as } n\\to\\infty)}$$</div>
    <p>The elongated S is a stretched "sum"; $a$ and $b$ are the limits of integration, $f(x)$ is the integrand, and $dx$ is the width shrinking to zero.</p>
    <p><b>Signed area.</b> The heights $f(x_i)$ carry a sign. Where the curve dips below the axis, $f(x_i)&lt;0$, so that strip contributes $f(x_i)\\,\\Delta x&lt;0$ — it <em>subtracts</em>. So the integral is not raw area but area above the axis <em>minus</em> area below. Drag the right edge across $f(x)=x$; the <span class="rd">red</span> region below the axis counts against the <span class="grn">green</span> one above.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">right edge b</div><div class="v" id="bv">—</div></div><div class="rdc"><div class="k">signed area ∫₋₂ᵇ</div><div class="v" id="av">—</div></div></div>
    <p><b>Four properties, all inherited from the sums.</b> Each is obvious for a finite sum and simply survives the limit:</p>
    <div class="eqbox">$$\\begin{gathered}\\textstyle\\int_a^a f=0 \\qquad \\int_b^a f=-\\int_a^b f \\\\[2pt] \\textstyle\\int_a^b(cf+g)=c\\!\\int_a^b f+\\int_a^b g \\qquad \\int_a^c f+\\int_c^b f=\\int_a^b f\\end{gathered}$$</div>
    <p>Reading them off, left to right: a zero-width interval encloses no strips, so the sum is $0$; running the interval backwards flips the sign of every $\\Delta x$, flipping the whole sum; a sum of scaled heights splits apart, $\\sum(cf+g)\\Delta x=c\\sum f\\Delta x+\\sum g\\Delta x$, which is <em>linearity</em>; and slicing $[a,c]$ and then $[c,b]$ is just one slicing of $[a,b]$, so the two integrals add (<em>additivity</em>).</p>
    <div class="task"><b>Signed area</b>What is $\\displaystyle\\int_{-2}^{2} x\\,dx$ — the net signed area of $f(x)=x$ from $-2$ to $2$?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-2.6,xmax:2.6,ymin:-2.6,ymax:2.6});
  const f=x=>x;let b=1.1;const sarea=b=>b*b/2-2;
  function draw(){pl.grid();const{ctx}=pl;const lo=-2,step=(b-lo)/200;
    if(step>0)for(let t=lo;t<b;t+=step){const y=f(t),X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(y);
      ctx.fillStyle=y>=0?'rgba(63,185,143,0.30)':'rgba(226,102,79,0.30)';ctx.fillRect(X0,Math.min(Y0,Y1),X1-X0,Math.abs(Y0-Y1));}
    pl.curve(f,'#7ab8ff');pl.vline(b,'#3a4c66',true);pl.point(b,f(b),'#e8b84b',5);
    document.getElementById('bv').textContent=b.toFixed(2);
    document.getElementById('av').textContent=sarea(b).toFixed(3);}
  xdrag(cv,pl,x=>{b=Math.max(-1.9,Math.min(2.5,x));draw();});draw();
  numChk(stage.querySelector('.card'),0,()=>{addReveal(`<div class="rh">✓ 0 — the halves cancel</div><p>From $-2$ to $0$ the curve is below the axis (a triangle of area $2$, counted <em>negative</em>); from $0$ to $2$ it's an equal triangle above (area $+2$). Net: $-2+2=0$. Signed area is why an integral can be zero over a nonempty region, and why $\\int$ of an odd function over a symmetric interval always vanishes. Those four properties are the algebra you'll compute with from here on.</p>`);});
  setHints([`Below the axis counts negative. The triangle on the left ($-2$ to $0$) and the one on the right ($0$ to $2$) are mirror images.`,`Equal negative and positive triangles cancel: 0.`]);
}

function c4_ftc1(){
  stage.innerHTML=`<div class="card"><h2>Fundamental Theorem, Part 1: the area function's slope is the height</h2>
    <p>Fix the left edge at $a$ and let the right edge $x$ slide; the area swept out becomes a function of $x$ — the <b>area-so-far function</b> $A(x)=\\int_a^x f(t)\\,dt$. What is its derivative? Explore first: $f(x)=x$ is blue, its area function $A(x)=\\int_0^x t\\,dt=\\tfrac{x^2}{2}$ is green. Drag $x$ and compare the green curve's <em>slope</em> to the blue curve's <em>height</em>.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">height f(x)</div><div class="v" id="hv">—</div></div><div class="rdc"><div class="k">area A(x)</div><div class="v" id="av">—</div></div></div>
    <div class="task"><b>What did you find?</b>As the right edge moves, the rate at which accumulated area grows equals which quantity?</div>
    <div class="choices" id="ch"></div>
    <p style="margin-top:16px"><b>Now prove it.</b> You saw the green area-curve climb with slope equal to the blue height. Here it is straight from the limit definition, $A'(x)=\\lim_{h\\to0}\\frac{A(x+h)-A(x)}{h}$.</p>
    <p><b>1. The top is a thin sliver of area.</b> By additivity, $A(x+h)-A(x)=\\int_x^{x+h} f(t)\\,dt$.</p>
    <p><b>2. So the fraction is an average height</b> of $f$ across $[x,x+h]$:</p>
    <div class="eqbox">$$\\frac{A(x+h)-A(x)}{h}=\\frac{1}{h}\\int_x^{x+h} f(t)\\,dt$$</div>
    <p><b>3. Trap it</b> between the lowest ($m$) and highest ($M$) values of $f$ on the sliver:</p>
    <div class="eqbox">$$m\\;\\le\\;\\frac{1}{h}\\int_x^{x+h} f(t)\\,dt\\;\\le\\;M$$</div>
    <p><b>4. Squeeze.</b> As $h\\to 0$ the interval collapses onto $x$, so $m\\to f(x)$ and $M\\to f(x)$ by continuity; the squeeze theorem (Module 2) forces the middle to the same limit:</p>
    <div class="eqbox">$$A'(x)=\\lim_{h\\to 0}\\frac{1}{h}\\int_x^{x+h} f(t)\\,dt=\\color{#e8b84b}{f(x)}$$</div>
    <p>So $A$ is an <em>antiderivative</em> of $f$: differentiation and area-accumulation are inverse operations. The next two beats cash that in.</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.2,ymin:-0.4,ymax:5});
  const f=x=>x,A=x=>x*x/2;let x0=1.5;
  function draw(){pl.grid();const{ctx}=pl;const step=x0/140;
    if(step>0)for(let t=0;t<x0;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(f(t));ctx.fillStyle='rgba(122,184,255,0.18)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.curve(A,'#3fb98f');pl.vline(x0,'#3a4c66',true);
    const m=f(x0);ctx.strokeStyle='rgba(63,185,143,0.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();
    const y0=A(x0)+m*(pl.xmin-x0),y1=A(x0)+m*(pl.xmax-x0);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();ctx.setLineDash([]);
    pl.point(x0,f(x0),'#7ab8ff',5);pl.point(x0,A(x0),'#3fb98f',5);
    document.getElementById('hv').textContent=f(x0).toFixed(2);
    document.getElementById('av').textContent=A(x0).toFixed(2);}
  xdrag(cv,pl,x=>{x0=Math.max(0,Math.min(3,x));draw();});draw();
  const opts=[['the <b>height</b> of the curve there, $f(x)$','y'],['the area itself, $A(x)$','n'],['zero — area accumulates at a constant rate','n'],['the width $dx$','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ The rate equals the height, f(x)</div><p>Exactly what the squeeze proof below establishes: $A'(x)=f(x)$, so the area function is an antiderivative of $f$.</p>`);});
  setHints([`Compare the two readouts as you drag: at x=2 the height reads 2 — is the green area-curve's slope also 2 there?`]);
}

function c4_antideriv(){
  stage.innerHTML=`<div class="card"><h2>Antiderivatives and the reverse power rule</h2>
    <p>Part 1 showed the area function satisfies $A'=f$. A function whose derivative is $f$ earns a name:</p>
    <div class="defn"><span class="dt">Definition — antiderivative</span>$F$ is an <b>antiderivative</b> of $f$ if $F'(x)=f(x)$.</div>
    <p><b>Why "$+C$": there is exactly one degree of freedom.</b> Suppose $F$ and $G$ are <em>both</em> antiderivatives of the same $f$, so $F'=f$ and $G'=f$. Look at their difference $D=F-G$ and differentiate:</p>
    <div class="eqbox">$$D'(x)=F'(x)-G'(x)=f(x)-f(x)=0$$</div>
    <p>A function whose derivative is zero on an interval must be <b>constant</b> there — the Mean Value Theorem corollary from Module 4 (between any two points, $D(b)-D(a)=D'(c)(b-a)=0$, so $D$ never changes). Hence $F-G=C$: any two antiderivatives of $f$ differ only by a constant. So once you find <em>one</em> antiderivative $F$, the whole family is $F(x)+C$, written as the <b>indefinite integral</b>:</p>
    <div class="eqbox">$$\\int f(x)\\,dx = F(x)+C$$</div>
    <p><b>The reverse power rule, by guess-and-check.</b> We want a function whose derivative is $x^n$. The power rule <em>lowers</em> an exponent by one, so to undo it we should <em>raise</em> the exponent by one. Guess $x^{n+1}$ and differentiate to see what comes out:</p>
    <div class="eqbox">$$\\frac{d}{dx}\\,x^{n+1}=(n+1)\\,x^{n}$$</div>
    <p>That's $x^n$, but with an unwanted factor of $(n+1)$ in front. Cancel it by dividing the guess by $(n+1)$:</p>
    <div class="eqbox">$$\\frac{d}{dx}\\!\\left[\\frac{x^{n+1}}{n+1}\\right]=\\frac{(n+1)\\,x^{n}}{n+1}=x^{n}\\quad ✓$$</div>
    <p>So the antiderivative of $x^n$ is $\\dfrac{x^{n+1}}{n+1}$, plus the constant:</p>
    <div class="eqbox">$$\\int x^{n}\\,dx=\\frac{x^{n+1}}{n+1}+C\\qquad(n\\ne -1)$$</div>
    <p>The lone exception is $n=-1$: raising the exponent gives $x^0$ and dividing by $n+1=0$ is illegal. That missing case is $\\int\\frac{dx}{x}$ — the gap flagged since Module 3, filled two beats from now.</p>
    <p><b>Worked example.</b> Suppose all you know about $F$ is its rate, $F'(x)=3x^2$, and one value, $F(0)=5$. Antidifferentiate: $\\int 3x^2\\,dx=3\\cdot\\frac{x^3}{3}+C=x^3+C$, so $F(x)=x^3+C$. The one data point fixes the constant: $F(0)=0^3+C=C$, and that equals $5$, so $C=5$ and $F(x)=x^3+5$. Now every value is available — find $F(2)$.</p>
    <div class="task"><b>Recover the value</b>With $F'(x)=3x^2$ and $F(0)=5$, compute $F(2)$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),13,()=>{addReveal(`<div class="rh">✓ F(2) = 13</div><p>$F(x)=x^3+5$, so $F(2)=8+5=13$. Notice the $+C$ doing real work: without the datum $F(0)=5$ you'd only know $F$ up to a constant — the initial condition is what selects the one antiderivative you want from the whole vertical family of parallel curves.</p>`);});
  setHints([`Antiderivative of 3x² is x³ + C. Use F(0)=5 to find C, then evaluate at 2.`,`F(x)=x³+5, so F(2)=8+5=13.`]);
}

function c4_ftc2(){
  stage.innerHTML=`<div class="card"><h2>Fundamental Theorem, Part 2: evaluate by antiderivative</h2>
    <p>Part 1 showed antiderivatives exist. Part 2 is the payoff: to get a definite integral, evaluate <em>any</em> antiderivative at the endpoints and subtract — $\\int_a^b f=F(b)-F(a)$. Try it on the shaded area below, $\\int_0^3 x^2\\,dx$ — the number you ground out of Riemann sums. An antiderivative of $x^2$ is $F(x)=\\tfrac{x^3}{3}$.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="task"><b>Evaluate</b>Compute $F(3)-F(0)=\\tfrac{27}{3}-0$. Does it match the Riemann answer?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>Now prove it holds in general.</b> Let $F$ be any antiderivative ($F'=f$) and cut $[a,b]$ into slices $a=x_0&lt;x_1&lt;\\dots&lt;x_n=b$.</p>
    <p><b>1. Telescope.</b> The total change in $F$ is the sum of the per-slice changes; interior values cancel in pairs:</p>
    <div class="eqbox">$$F(b)-F(a)=\\sum_{i=1}^{n}\\big(F(x_i)-F(x_{i-1})\\big)$$</div>
    <p><b>2. MVT on each slice</b> gives a point $c_i$ with $F(x_i)-F(x_{i-1})=F'(c_i)\\,\\Delta x_i=f(c_i)\\,\\Delta x_i$.</p>
    <p><b>3. That's a Riemann sum:</b> $\\;F(b)-F(a)=\\sum_{i=1}^{n}f(c_i)\\,\\Delta x_i$, exact for every slicing.</p>
    <p><b>4. Refine.</b> As the slices shrink, the right side $\\to\\int_a^b f$ (the definition), while the left side never moves — so they are equal:</p>
    <div class="eqbox">$$\\int_a^b f(x)\\,dx=F(b)-F(a)\\qquad\\color{#5d7186}{\\text{written }\\big[F(x)\\big]_a^b}$$</div>
    <p>Integration and differentiation are inverse operations — every derivative rule, read backwards, is now an integration formula.</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.3,ymin:-0.6,ymax:9.8});
  const f=x=>x*x;
  function draw(){pl.grid();const{ctx}=pl;const step=3/200;
    for(let t=0;t<3;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(f(t));ctx.fillStyle='rgba(122,184,255,0.18)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.label(1.05,7.4,'∫₀³ x² dx','#9fb0c4');}
  draw();
  numChk(stage.querySelector('.card'),9,()=>{addReveal(`<div class="rh">✓ 9 — the same number, in one subtraction</div><p>The limit of sums you laboured over is now a single evaluation. The proof below shows why $\\int_a^b f=F(b)-F(a)$ always works.</p>`);});
  setHints([`Evaluate the antiderivative x³/3 at 3 and at 0, then subtract.`,`27/3 − 0 = 9 — matching the Riemann limit.`]);
}

function c4_ln(){
  stage.innerHTML=`<div class="card"><h2>Defining the natural logarithm from area</h2>
    <p>The reverse power rule left one hole: $n=-1$, the integral $\\int\\frac{dx}{x}$. Saying "that's just $\\ln x$" would be circular — to use $\\log_e$ we'd first need $e^x$ for every real $x$ and $(e^x)'=e^x$. The integral needs nothing new, so we turn the gap into a definition:</p>
    <div class="defn"><span class="dt">Definition — natural logarithm</span>$\\displaystyle \\ln x := \\int_1^x \\frac{dt}{t} \\quad (x>0)$ — the signed area under $\\tfrac1t$ from $1$ to $x$. (This retraces history: de Sarasa saw the area under $\\tfrac1t$ act like a logarithm in 1649, before $e$ was named.)</div>
    <p>Drag $x$ and read $\\ln x$ off the shaded area — watch it hit $0$ at $x=1$, go positive to the right, negative to the left, and always climb.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">ln x = shaded area</div><div class="v" id="lv">—</div></div></div>
    <div class="task"><b>Apply FTC to ln</b>By FTC Part 1, differentiating an area function returns its integrand. So what is $(\\ln x)'$ at $x=2$? (Enter a decimal.)</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <p style="margin-top:16px"><b>The derivative, for free.</b> This is FTC Part 1 with $a=1$ and $f(t)=\\tfrac1t$: the area function's derivative is its integrand's height, so $(\\ln x)'=\\tfrac1x$ — the missing antiderivative of $\\tfrac1x$, now rigorous. At $x=2$ it is $\\tfrac12$.</p>
    <p><b>Why it really is a logarithm.</b> A logarithm turns products into sums, $\\ln(ab)=\\ln a+\\ln b$. We can prove our area does this. Fix $a&gt;0$ and let $g(x)=\\ln(ax)-\\ln x$. Differentiate the first term by the chain rule (inner $ax$, derivative $a$):</p>
    <div class="eqbox">$$\\frac{d}{dx}\\ln(ax)=\\frac{1}{ax}\\cdot a=\\frac{1}{x}\\;\\Rightarrow\\; g'(x)=\\frac1x-\\frac1x=0$$</div>
    <p>Zero derivative means constant (MVT, Module 4), so $g(x)=g(1)=\\ln a-\\ln 1=\\ln a$ for all $x$. Thus $\\ln(ax)=\\ln x+\\ln a$; setting $x=b$:</p>
    <div class="eqbox">$$\\color{#e8b84b}{\\ln(ab)=\\ln a+\\ln b}$$</div>
    <p>Proven, not asserted. And since the integrand $\\tfrac1t>0$, $\\ln$ is strictly increasing — which gives it an inverse, the doorway to $e$ and $e^x$, next.</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:5,ymin:-0.4,ymax:3.6});
  const f=t=>t>0.06?1/t:NaN;let x0=2;
  const lnA=x=>{const n=500,dx=(x-1)/n;let s=0;for(let i=0;i<n;i++){const t=1+(i+0.5)*dx;s+=(1/t)*dx;}return s;};
  function draw(){pl.grid();const{ctx}=pl;const lo=Math.min(1,x0),hi=Math.max(1,x0),step=(hi-lo)/220;
    if(step>0)for(let t=lo;t<hi;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(1/t);ctx.fillStyle=x0>=1?'rgba(63,185,143,0.26)':'rgba(226,102,79,0.26)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.vline(1,'#2b3a4f',true);pl.vline(x0,'#3a4c66',true);
    document.getElementById('xv').textContent=x0.toFixed(3);
    document.getElementById('lv').textContent=lnA(x0).toFixed(3);}
  xdrag(cv,pl,x=>{x0=Math.max(0.3,Math.min(5,x));draw();});draw();
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ (ln 2)′ = ½ = 0.5</div><p>Straight from FTC Part 1, as spelled out below — and the same beat proves this area genuinely obeys the log law.</p>`);},s=>parseFloat(s));
  setHints([`FTC Part 1: the derivative of ∫₁ˣ (1/t)dt is just the integrand 1/x. Put x = 2.`,`1/2 = 0.5.`]);
}

function c4_e(){
  stage.innerHTML=`<div class="card"><h2>The number e and the function eˣ</h2>
    <p>$\\ln$ climbs continuously from $-\\infty$ (as $x\\to 0^+$) up to $+\\infty$, hitting every height exactly once. In particular there is a single input where the area equals exactly $1$ — a special number worth finding. Drag $x$ until the shaded area reaches $1$, and notice where you land.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">area = ln x</div><div class="v" id="lv">—</div></div></div>
    <div class="task"><b>Use the derivative</b>That spot (call it $e$) makes $e^x$ the inverse of $\\ln$, and it turns out $(e^x)'=e^x$. Given that and $e^0=1$, what is the slope of $e^x$ at $x=0$?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>
    <div class="defn" style="margin-top:16px"><span class="dt">Definition — the number e</span>$e$ is the unique number with $\\ln e=1$ — the spot you dragged to, $\\approx 2.71828$. (It exists and is unique because $\\ln$ is continuous and strictly increasing over all reals, so by the Intermediate Value Theorem it takes the value $1$ exactly once.)</div>
    <div class="defn"><span class="dt">Definition — the exponential function</span>$e^x$ is the inverse of $\\ln$: $\\ln(e^x)=x$ and $e^{\\ln x}=x$. This defines $e^x$ for <em>every</em> real $x$, irrational exponents included.</div>
    <p><b>Its derivative, step by step.</b> Set $y=e^x$, so $\\ln y=x$. Differentiate both sides in $x$; the left needs the chain rule (outer $\\ln$ gives $\\tfrac1y$, times inner $\\tfrac{dy}{dx}$):</p>
    <div class="eqbox">$$\\frac{1}{y}\\cdot\\frac{dy}{dx}=1\\;\\Longrightarrow\\;\\frac{dy}{dx}=y\\;\\Longrightarrow\\;\\color{#e8b84b}{(e^x)'=e^x}$$</div>
    <p>So the slope at $0$ is $e^0=1$. $e^x$ is its own derivative — the growth property teased in Module 1, now earned. The whole $e$–$\\ln$ pair is built from the integral alone: no unproven limit, no circular appeal to "log base $e$."</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:5,ymin:-0.4,ymax:3.6});
  const f=t=>t>0.06?1/t:NaN;let x0=1.5;
  const lnA=x=>{const n=500,dx=(x-1)/n;let s=0;for(let i=0;i<n;i++){const t=1+(i+0.5)*dx;s+=(1/t)*dx;}return s;};
  function draw(){pl.grid();const{ctx}=pl;const ln=lnA(x0),atE=Math.abs(ln-1)<0.02;const step=(x0-1)/220;
    if(step>0)for(let t=1;t<x0;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(1/t);ctx.fillStyle=atE?'rgba(232,184,75,0.32)':'rgba(63,185,143,0.24)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.vline(1,'#2b3a4f',true);pl.vline(x0,atE?'#e8b84b':'#3a4c66',true);
    if(atE)pl.label(x0-0.02,3.35,'x = e','#e8b84b');
    document.getElementById('xv').textContent=x0.toFixed(3);
    document.getElementById('lv').textContent=ln.toFixed(3);
    if(!draw.hitE&&ln>=1){draw.hitE=true;flash('✓ area = 1 → x = e ≈ 2.718');}}
  xdrag(cv,pl,x=>{x0=Math.max(0.3,Math.min(5,x));draw();});draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ slope = 1 at x = 0</div><p>Because $e^x$ is its own derivative and $e^0=1$. The definitions and the derivation are spelled out below.</p>`);});
  setHints([`(eˣ)′ = eˣ, and e⁰ = 1, so the slope at 0 is just e⁰.`,`e⁰ = 1.`]);
}

function c4_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Uses Modules 1–5 — and now $\\ln$ and $e^x$ are fair game. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">Riemann sum</span><div class="ph">Problem 1</div>
    <p>Estimate $\\displaystyle\\int_0^2 x^2\\,dx$ with $n=4$ right-endpoint rectangles, and compare to the exact value.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\Delta x = \\tfrac12$; right endpoints $0.5,1,1.5,2$ with heights $0.25,1,2.25,4$. $R_4 = \\tfrac12(0.25+1+2.25+4) = \\tfrac12(7.5) = 3.75$. Exact: $\\big[\\tfrac{x^3}{3}\\big]_0^2 = \\tfrac{8}{3} \\approx 2.67$. The estimate overshoots (increasing curve, right endpoints), as expected.</p></div></details></div>

    <div class="prob"><span class="lvl">FTC evaluation</span><div class="ph">Problem 2</div>
    <p>Evaluate $\\displaystyle\\int_1^3 2x\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Antiderivative of $2x$ is $x^2$. So $\\big[x^2\\big]_1^3 = 9 - 1 = 8$.</p></div></details></div>

    <div class="prob"><span class="lvl">trig integral</span><div class="ph">Problem 3</div>
    <p>Evaluate $\\displaystyle\\int_0^{\\pi} \\sin x\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Since $(\\cos x)' = -\\sin x$, an antiderivative of $\\sin x$ is $-\\cos x$. So $\\big[-\\cos x\\big]_0^{\\pi} = -\\cos\\pi - (-\\cos 0) = -(-1) + 1 = 2$.</p></div></details></div>

    <div class="prob"><span class="lvl">initial condition</span><div class="ph">Problem 4</div>
    <p>Find $F$ with $F'(x) = x^2 + 1$ and $F(0) = 2$, then compute $F(3)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$F(x) = \\tfrac{x^3}{3} + x + C$. From $F(0)=2$: $C=2$. So $F(x) = \\tfrac{x^3}{3} + x + 2$, and $F(3) = 9 + 3 + 2 = 14$.</p></div></details></div>

    <div class="prob"><span class="lvl">signed area</span><div class="ph">Problem 5</div>
    <p>Evaluate $\\displaystyle\\int_{-2}^{2} x^3\\,dx$, and explain the result geometrically.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\big[\\tfrac{x^4}{4}\\big]_{-2}^{2} = \\tfrac{16}{4} - \\tfrac{16}{4} = 0$. Geometrically, $x^3$ is odd: the negative signed area on $[-2,0]$ exactly cancels the positive area on $[0,2]$.</p></div></details></div>

    <div class="prob"><span class="lvl">FTC Part 1</span><div class="ph">Problem 6</div>
    <p>Compute $\\displaystyle\\frac{d}{dx}\\int_0^x (t^2 + 1)\\,dt$ <em>without</em> evaluating the integral.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>FTC Part 1 says the derivative of the area function is the integrand at the top limit: $\\frac{d}{dx}\\int_0^x (t^2+1)\\,dt = x^2 + 1$. (No antiderivative needed — that's the point of Part 1.)</p></div></details></div>

    <div class="prob"><span class="lvl">logarithm</span><div class="ph">Problem 7</div>
    <p>Using $\\ln x = \\int_1^x \\tfrac{dt}{t}$: state $\\ln 1$, and find $\\frac{d}{dx}\\ln(x^2)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\ln 1 = \\int_1^1 \\tfrac{dt}{t} = 0$ (empty interval). For the derivative, chain rule with $(\\ln u)' = \\tfrac1u$: $\\frac{d}{dx}\\ln(x^2) = \\tfrac{1}{x^2}\\cdot 2x = \\tfrac{2}{x}$. (Or note $\\ln(x^2)=2\\ln x$, derivative $\\tfrac{2}{x}$ — same answer.)</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — defining e</span><div class="ph">Problem 8</div>
    <p>Evaluate $\\displaystyle\\int_1^{e} \\frac{dt}{t}$, and say what it reveals about $e$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\int_1^{e}\\tfrac{dt}{t} = \\ln e - \\ln 1 = 1 - 0 = 1$. This is the <em>definition</em> of $e$ read as area: $e$ is precisely the upper limit at which the area under $\\tfrac1t$ (starting at $1$) first equals $1$. The number $e\\approx 2.718$ isn't pulled from nowhere — it's where that area hits one.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function c4_recap(){
  stage.innerHTML=`<div class="card"><h2>What you built</h2>
    <div class="eqbox" style="line-height:2.3">$$\\int_a^b f(x)\\,dx = \\lim_{n\\to\\infty}\\sum_{i=1}^n f(x_i)\\,\\Delta x \\quad \\color{#5d7186}{\\text{(signed area)}}$$
    <div style="text-align:center;line-height:2;color:#dbe6f4;margin-top:6px">FTC Part 1: $\\frac{d}{dx}\\int_a^x f = f(x)$ — area function's slope is the height<br>FTC Part 2: $\\int_a^b f = F(b)-F(a)$ — evaluate by any antiderivative<br>reverse power rule: $\\int x^n dx = \\frac{x^{n+1}}{n+1}+C\\ (n\\ne -1)$<br>$\\ln x := \\int_1^x \\frac{dt}{t}$, so $(\\ln x)'=\\frac1x$ · $\\ln e=1$ · $(e^x)'=e^x$</div></div>
    <p>Integration is accumulation, and the Fundamental Theorem is the whole subject's keystone: it welds area to slope, making them inverse operations. That single link let us define $\\ln$ and $e^x$ from area and close the $n=-1$ gap left open since Module 3 — nothing assumed, everything derived.</p>
    <p><b>Next — Module 6:</b> the FTC turns integration into "guess the antiderivative," so the game becomes technique. <b>Substitution</b> reverses the chain rule, <b>integration by parts</b> reverses the product rule, and partial fractions and trig methods round out the toolkit — plus area, volume, and arc-length payoffs.</p></div>`;
  setHints([]);unlock();
}

/* ================= MODULE 6 — TECHNIQUES & APPLICATIONS OF INTEGRATION ================= */
function c5_recall(){recallFrom(`Module 6 is where you cash in the Fundamental Theorem — so rebuild the whole machine first, from functions and limits through the derivative, its applications, and the integral that ties them together.`,['c0','c1','c2','c3','c4'],RECALL_HINT);}

function c5_intro(){
  stage.innerHTML=`<div class="card"><h2>Integration is a craft, not an algorithm</h2>
    <p>The Fundamental Theorem recast integration as <em>antidifferentiation</em>: to compute $\\int f$, find a function whose derivative is $f$. But there's an asymmetry worth naming. Differentiation is mechanical — the power, product, quotient, and chain rules crank out the derivative of <em>anything</em> you can write down. Integration runs those rules <em>backwards</em>, and reversing isn't mechanical: you have to recognize which rule could have produced the integrand.</p>
    <p>So this module is a toolbox, and each tool is one differentiation rule read in reverse:</p>
    <div class="eqbox" style="line-height:2">substitution &nbsp;$\\longleftarrow$&nbsp; the chain rule<br>integration by parts &nbsp;$\\longleftarrow$&nbsp; the product rule<br>partial fractions &nbsp;$\\longleftarrow$&nbsp; algebra, to expose those forms</div>
    <p>Then we spend the second half turning integrals into geometry — area between curves, volumes, arc length. First, the mindset:</p>
    <div class="task"><b>Why is integration harder than differentiation?</b></div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['Reversing a rule means <em>recognizing</em> what could have produced the integrand — and some functions have no elementary antiderivative at all','y'],['Integrals are always larger numbers, so they are harder to compute','n'],['Differentiation is actually the harder of the two','n'],['There is a single master formula for integrals we simply haven\'t covered yet','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ Reversing requires recognition</div><p>Differentiation is a forward crank; integration is pattern-matching in reverse, and it genuinely runs out — functions like $e^{-x^2}$ (the bell curve) have <em>no</em> antiderivative expressible in elementary functions, so no technique will ever give a closed form. That's not a gap in your training; it's a theorem. The tools here handle the large, important class that <em>does</em> submit — and for the rest, the definite integral still exists and is computed numerically (the Riemann sums of Module 5).</p>`);});
  setHints([`Think about what "run the chain rule backwards" actually demands of you compared to just applying it forwards.`]);
}

function c5_usub(){
  stage.innerHTML=`<div class="card"><h2>Substitution: the chain rule, reversed</h2>
    <p>The chain rule says $\\frac{d}{dx}F(g(x)) = F'(g(x))\\,g'(x)$. Read that as an antiderivative statement and you have <b>substitution</b>: if an integrand looks like "(a function of $g$) times $g'$," you can collapse it back into the outer function.</p>
    <div class="eqbox">$$\\int f(g(x))\\,g'(x)\\,dx = \\int f(u)\\,du \\qquad \\text{where } u=g(x),\\ du=g'(x)\\,dx$$</div>
    <p>The move: spot an inner function $u=g(x)$ whose derivative $g'(x)$ is also sitting in the integrand, rename it, and the integral simplifies. For a <em>definite</em> integral, convert the limits too — they're $x$-values, so translate them into $u$-values.</p>
    <p>Worked example: $\\displaystyle\\int_0^1 2x\\,(x^2+1)^3\\,dx$. Let $u=x^2+1$, so $du=2x\\,dx$ — and the $2x\\,dx$ is right there. Limits: $x=0\\Rightarrow u=1$, $x=1\\Rightarrow u=2$. The integral becomes $\\int_1^2 u^3\\,du = \\big[\\tfrac{u^4}{4}\\big]_1^2 = \\tfrac{16-1}{4}$.</p>
    <div class="task"><b>Finish it</b>Evaluate $\\displaystyle\\int_1^2 u^3\\,du = \\frac{16-1}{4}$. (Enter a decimal.)</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),3.75,()=>{addReveal(`<div class="rh">✓ 15/4 = 3.75</div><p>$\\big[\\tfrac{u^4}{4}\\big]_1^2 = \\tfrac{16}{4}-\\tfrac14 = \\tfrac{15}{4} = 3.75$. Substitution worked because the integrand was <em>exactly</em> a chain-rule output: the outer $u^3$ times the inner derivative $2x$. The whole skill is training your eye to see that structure — "is a piece of this integrand the derivative of another piece?" When yes, rename and collapse.</p>`);},s=>parseFloat(s));
  setHints([`u = x²+1 turned it into ∫₁² u³ du. Now use the reverse power rule and evaluate.`,`[u⁴/4] from 1 to 2 = (16−1)/4 = 15/4.`]);
}

function c5_parts(){
  stage.innerHTML=`<div class="card"><h2>Integration by parts: the product rule, reversed</h2>
    <p>The product rule says $(uv)' = u'v + uv'$. Integrate both sides over the whole thing — the left becomes $uv$ — and rearrange to solve for one of the two pieces on the right:</p>
    <div class="eqbox">$$\\int u\\,dv = uv - \\int v\\,du$$</div>
    <p>It trades one integral for another. The art is choosing $u$ and $dv$ so the <em>new</em> integral $\\int v\\,du$ is easier than the one you started with — usually by picking $u$ to be the part that gets simpler when differentiated.</p>
    <p>Worked example: $\\displaystyle\\int_0^1 x\\,e^x\\,dx$. Choose $u=x$ (its derivative $du=dx$ is simpler) and $dv=e^x dx$ (so $v=e^x$). Then</p>
    <div class="eqbox">$$\\int_0^1 x e^x dx = \\big[x e^x\\big]_0^1 - \\int_0^1 e^x dx = \\big[x e^x - e^x\\big]_0^1.$$</div>
    <p>The $\\int v\\,du = \\int e^x dx$ is one we now know cold (from Module 5).</p>
    <div class="task"><b>Evaluate it</b>Compute $\\big[x e^x - e^x\\big]_0^1$. (Use $e^0=1$; the $e$'s at $x=1$ cancel.)</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ 1</div><p>At $x=1$: $1\\cdot e - e = 0$. At $x=0$: $0\\cdot 1 - 1 = -1$. So the integral is $0 - (-1) = 1$. Parts turned $\\int x e^x$, which no basic rule handles, into $uv$ minus an integral we already owned. Picking $u=x$ was the key: differentiating it to $1$ made the leftover integral trivial. (Had we picked $u=e^x$, the new integral would have been <em>worse</em> — choice matters.)</p>`);});
  setHints([`Plug in the endpoints: at x=1 the two e terms cancel to 0; at x=0 you get 0 − 1 = −1.`,`0 − (−1) = 1.`]);
}

function c5_partialfrac(){
  stage.innerHTML=`<div class="card"><h2>Partial fractions: split a hard rational into easy ones</h2>
    <p>A ratio of polynomials often looks unintegrable as written — but algebra can break it into a <em>sum</em> of simpler fractions, each of which integrates to a logarithm. The trick is to reverse the "common denominator" step you learned in algebra.</p>
    <p>Take $\\dfrac{1}{x^2-1}=\\dfrac{1}{(x-1)(x+1)}$. Assume it splits as</p>
    <div class="eqbox">$$\\frac{1}{(x-1)(x+1)} = \\frac{A}{x-1} + \\frac{B}{x+1}.$$</div>
    <p>Multiply through by $(x-1)(x+1)$: $\\;1 = A(x+1) + B(x-1)$. Set $x=1$: $\\;1 = A(2)$, so $A=\\tfrac12$. Set $x=-1$: $\\;1 = B(-2)$, so $B=-\\tfrac12$. Now each piece integrates: $\\int\\frac{dx}{x^2-1} = \\tfrac12\\ln|x-1| - \\tfrac12\\ln|x+1| + C$.</p>
    <div class="task"><b>Find the coefficient</b>In $\\dfrac{1}{(x-1)(x+1)} = \\dfrac{A}{x-1}+\\dfrac{B}{x+1}$, what is $A$? (Enter a decimal.)</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),0.5,()=>{addReveal(`<div class="rh">✓ A = ½ = 0.5</div><p>The fast route (the "cover-up" method): to get $A$, cover the $(x-1)$ factor and evaluate what's left at $x=1$: $\\tfrac{1}{x+1}\\big|_{x=1}=\\tfrac12$. Likewise $B=\\tfrac{1}{x-1}\\big|_{x=-1}=-\\tfrac12$. Once split, the integral is just two logarithms — which is why partial fractions and $\\ln$ are a package deal. Any rational function with distinct linear factors integrates this way.</p>`);},s=>parseFloat(s));
  setHints([`Multiply both sides by (x−1)(x+1) to get 1 = A(x+1)+B(x−1), then substitute x=1 to isolate A.`,`1 = A(1+1) = 2A, so A = 1/2.`]);
}

function c5_improper(){
  stage.innerHTML=`<div class="card"><h2>Improper integrals: finite area over an infinite region</h2>
    <p>What is the area under a curve stretching to infinity? You can't plug $\\infty$ into an antiderivative, so you take a <b>limit</b>: integrate up to $b$, then let $b\\to\\infty$.</p>
    <div class="eqbox">$$\\int_1^{\\infty} f(x)\\,dx = \\lim_{b\\to\\infty}\\int_1^{b} f(x)\\,dx$$</div>
    <p>Below is $f(x)=\\tfrac{1}{x^2}$. Drag the right edge $b$ outward and watch the shaded area: it equals $1-\\tfrac1b$, so it climbs toward $1$ but never passes it. The region is infinitely long, yet its area is finite — the integral <b>converges</b>.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">b</div><div class="v" id="bv">—</div></div><div class="rdc"><div class="k">area = 1 − 1/b</div><div class="v" id="av">—</div></div></div>
    <div class="task"><b>Take the limit</b>As $b\\to\\infty$, $1-\\tfrac1b\\to$ ? That value is $\\displaystyle\\int_1^{\\infty}\\tfrac{1}{x^2}\\,dx$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0.4,xmax:12,ymin:-0.15,ymax:1.5});
  const f=x=>x>0.2?1/(x*x):NaN;let b=3;
  function draw(){pl.grid();const{ctx}=pl;const step=(b-1)/240;
    if(step>0)for(let t=1;t<b;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Y0=pl.py(0),Y1=pl.py(1/(t*t));ctx.fillStyle='rgba(122,184,255,0.20)';ctx.fillRect(X0,Y1,X1-X0,Y0-Y1);}
    pl.curve(f,'#7ab8ff');pl.hline(1,'#3fb98f',true);pl.vline(1,'#2b3a4f',true);pl.vline(b,'#3a4c66',true);
    document.getElementById('bv').textContent=b.toFixed(2);
    document.getElementById('av').textContent=(1-1/b).toFixed(4);}
  xdrag(cv,pl,x=>{b=Math.max(1.05,Math.min(12,x));draw();});draw();
  numChk(stage.querySelector('.card'),1,()=>{addReveal(`<div class="rh">✓ Converges to 1</div><p>$\\int_1^b \\tfrac{1}{x^2}dx = \\big[-\\tfrac1x\\big]_1^b = 1-\\tfrac1b \\to 1$. Infinite length, area exactly $1$. But convergence is not automatic — contrast $\\int_1^\\infty \\tfrac1x\\,dx = \\lim_{b\\to\\infty}\\ln b = \\infty$, which <b>diverges</b>. Same-looking curves, opposite fates: $\\tfrac1{x^2}$ decays fast enough to enclose finite area, $\\tfrac1x$ doesn't. That knife-edge (which powers of $x$ converge) is exactly what the series tests in Module 7 will hinge on.</p>`);});
  setHints([`Drag b far right. The area reads 1 − 1/b: at b=10 it's 0.9, at b=100 it's 0.99… what's it heading to?`,`1 − 1/b → 1 as b → ∞.`]);
}

function c5_area(){
  stage.innerHTML=`<div class="card"><h2>Area between two curves</h2>
    <p>The definite integral gives area between a curve and the axis. Between <em>two</em> curves it's the same idea applied to the gap: at each $x$, the vertical strip has height (top curve − bottom curve), so integrate that difference.</p>
    <div class="eqbox">$$\\text{Area} = \\int_a^b \\big(\\,y_{\\text{top}} - y_{\\text{bottom}}\\,\\big)\\,dx$$</div>
    <p>Here are $y=x$ and $y=x^3$ on $[0,1]$, where the line sits above the cubic. Drag the sweep line and read the gap $x-x^3$ you're integrating; the shaded region is the total area.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">gap x − x³</div><div class="v" id="gv">—</div></div></div>
    <div class="task"><b>Compute the area</b>Evaluate $\\displaystyle\\int_0^1 (x-x^3)\\,dx$. (Enter a decimal.)</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.15,xmax:1.2,ymin:-0.15,ymax:1.2});
  const top=x=>x, bot=x=>x*x*x;let xs=0.5;
  function draw(){pl.grid();const{ctx}=pl;const step=1/200;
    for(let t=0;t<1;t+=step){const X0=pl.px(t),X1=pl.px(t+step),Yt=pl.py(top(t)),Yb=pl.py(bot(t));ctx.fillStyle='rgba(122,184,255,0.18)';ctx.fillRect(X0,Yt,X1-X0,Yb-Yt);}
    pl.curve(top,'#7ab8ff');pl.curve(bot,'#3fb98f');
    ctx.strokeStyle='#e8b84b';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(pl.px(xs),pl.py(bot(xs)));ctx.lineTo(pl.px(xs),pl.py(top(xs)));ctx.stroke();
    pl.point(xs,top(xs),'#7ab8ff',4);pl.point(xs,bot(xs),'#3fb98f',4);
    document.getElementById('xv').textContent=xs.toFixed(2);
    document.getElementById('gv').textContent=(top(xs)-bot(xs)).toFixed(3);}
  xdrag(cv,pl,x=>{xs=Math.max(0,Math.min(1,x));draw();});draw();
  numChk(stage.querySelector('.card'),0.25,()=>{addReveal(`<div class="rh">✓ 1/4 = 0.25</div><p>$\\int_0^1 (x-x^3)\\,dx = \\big[\\tfrac{x^2}{2}-\\tfrac{x^4}{4}\\big]_0^1 = \\tfrac12-\\tfrac14 = \\tfrac14$. The gold strip you dragged is the integrand: at each $x$ its length is the top minus the bottom, and summing those strips across $[0,1]$ is the area. Always integrate top − bottom; if the curves cross, split the interval where they swap.</p>`);},s=>parseFloat(s));
  setHints([`Integrate the gap: ∫₀¹(x − x³)dx, using the reverse power rule on each term.`,`[x²/2 − x⁴/4] from 0 to 1 = 1/2 − 1/4 = 1/4.`]);
}

function c5_volume(){
  stage.innerHTML=`<div class="card"><h2>Volumes of revolution: stack the disks</h2>
    <p>Spin a region around an axis and it sweeps out a solid. Slice the solid perpendicular to the axis into thin <b>disks</b>: at position $x$, the disk has radius $f(x)$, so face area $\\pi f(x)^2$ and volume $\\pi f(x)^2\\,dx$. Add them up:</p>
    <div class="eqbox">$$V = \\int_a^b \\pi\\,f(x)^2\\,dx$$</div>
    <p>Rotate the line $y=x$ on $[0,3]$ about the $x$-axis and you get a cone. Below is its silhouette ($y=\\pm x$); drag $x$ to see the disk sliced there — its radius is $f(x)=x$. Stacking all such disks gives the volume.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">radius f(x)</div><div class="v" id="rv">—</div></div><div class="rdc"><div class="k">disk area πr²</div><div class="v" id="av">—</div></div></div>
    <div class="task"><b>Find the volume</b>$V=\\displaystyle\\int_0^3 \\pi x^2\\,dx = k\\pi$. Enter $k$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.3,ymin:-3.6,ymax:3.6});
  const f=x=>x;let xs=1.5;
  function draw(){pl.grid();const{ctx}=pl;
    ctx.fillStyle='rgba(122,184,255,0.10)';ctx.beginPath();ctx.moveTo(pl.px(0),pl.py(0));ctx.lineTo(pl.px(3),pl.py(3));ctx.lineTo(pl.px(3),pl.py(-3));ctx.closePath();ctx.fill();
    pl.curve(f,'#7ab8ff');pl.curve(x=>-x,'#7ab8ff');
    ctx.strokeStyle='#e8b84b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pl.px(xs),pl.py(-f(xs)));ctx.lineTo(pl.px(xs),pl.py(f(xs)));ctx.stroke();
    pl.point(xs,f(xs),'#e8b84b',4);pl.point(xs,-f(xs),'#e8b84b',4);
    document.getElementById('xv').textContent=xs.toFixed(2);
    document.getElementById('rv').textContent=f(xs).toFixed(2);
    document.getElementById('av').textContent=(Math.PI*f(xs)*f(xs)).toFixed(2);}
  xdrag(cv,pl,x=>{xs=Math.max(0,Math.min(3,x));draw();});draw();
  numChk(stage.querySelector('.card'),9,()=>{addReveal(`<div class="rh">✓ k = 9, so V = 9π</div><p>$V=\\int_0^3 \\pi x^2 dx = \\pi\\big[\\tfrac{x^3}{3}\\big]_0^3 = \\pi\\cdot 9 = 9\\pi$. Sanity check against geometry: a cone of radius $r=3$ and height $h=3$ has volume $\\tfrac13\\pi r^2 h = \\tfrac13\\pi(9)(3)=9\\pi$ ✓ — the calculus reproduces the classical formula, and in fact <em>derives</em> it (that $\\tfrac13$ is just $\\int_0^h x^2/h^2\\,dx$ in disguise). The disk method handles any shape whose profile you can integrate, not just cones.</p>`);});
  setHints([`Pull the π out: V = π∫₀³ x² dx. Evaluate the integral to get the coefficient k.`,`∫₀³ x² dx = 27/3 = 9, so V = 9π and k = 9.`]);
}

function c5_arclength(){
  stage.innerHTML=`<div class="card"><h2>Arc length: Pythagoras on a tiny scale</h2>
    <p>How long is a curve? Zoom in on a tiny piece: it's nearly straight, a little right triangle with horizontal leg $dx$ and vertical leg $dy$. By Pythagoras its length is $ds=\\sqrt{dx^2+dy^2}$. Factor out $dx$ and use $\\tfrac{dy}{dx}=f'(x)$:</p>
    <div class="eqbox">$$ds = \\sqrt{1+\\big(f'(x)\\big)^2}\\,dx \\qquad\\Rightarrow\\qquad L = \\int_a^b \\sqrt{1+\\big(f'(x)\\big)^2}\\,dx$$</div>
    <p>Below is $y=\\tfrac23 x^{3/2}$, so $f'(x)=\\sqrt{x}$ and the integrand is $\\sqrt{1+x}$. Drag along the curve to see the little $dx$–$dy$–$ds$ triangle, and read the integrand.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">slope f′(x)=√x</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">√(1+f′²)</div><div class="v" id="iv">—</div></div></div>
    <div class="task"><b>Evaluate the integrand</b>At $x=3$, the arc-length integrand $\\sqrt{1+(f'(x))^2}=\\sqrt{1+x}$ equals?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.3,xmax:3.5,ymin:-0.5,ymax:4});
  const f=x=>x>=0?(2/3)*Math.pow(x,1.5):NaN, fp=x=>Math.sqrt(Math.max(0,x));let xs=1.2;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');
    const{ctx}=pl;const dx=0.6,x2=Math.min(xs+dx,3.4),y1=f(xs),y2=f(x2);
    ctx.strokeStyle='#3fb98f';ctx.lineWidth=1.8;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(pl.px(xs),pl.py(y1));ctx.lineTo(pl.px(x2),pl.py(y1));ctx.stroke();
    ctx.beginPath();ctx.moveTo(pl.px(x2),pl.py(y1));ctx.lineTo(pl.px(x2),pl.py(y2));ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#e8b84b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pl.px(xs),pl.py(y1));ctx.lineTo(pl.px(x2),pl.py(y2));ctx.stroke();
    pl.label((xs+x2)/2-0.05,y1-0.28,'dx','#3fb98f');pl.label(x2+0.04,(y1+y2)/2,'dy','#3fb98f');pl.label(xs-0.02,(y1+y2)/2+0.28,'ds','#e8b84b');
    pl.point(xs,y1,'#e8b84b',4);
    document.getElementById('xv').textContent=xs.toFixed(2);
    document.getElementById('sv').textContent=fp(xs).toFixed(3);
    document.getElementById('iv').textContent=Math.sqrt(1+xs).toFixed(3);}
  xdrag(cv,pl,x=>{xs=Math.max(0,Math.min(2.7,x));draw();});draw();
  numChk(stage.querySelector('.card'),2,()=>{addReveal(`<div class="rh">✓ 2</div><p>At $x=3$: $\\sqrt{1+3}=\\sqrt4=2$. The full length is $\\int_0^3 \\sqrt{1+x}\\,dx = \\big[\\tfrac23(1+x)^{3/2}\\big]_0^3 = \\tfrac23(8-1)=\\tfrac{14}{3}$. This example was chosen because $\\sqrt{1+x}$ antidifferentiates cleanly — most arc-length integrands (even for something as simple as $y=x^2$, giving $\\sqrt{1+4x^2}$) have no elementary antiderivative and must be integrated numerically. The <em>formula</em> is exact and universal; whether it evaluates in closed form is luck.</p>`);});
  setHints([`The integrand is √(1+x). Put x = 3.`,`√(1+3) = √4 = 2.`]);
}

function c5_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Mixed techniques — decide which tool each integrand calls for. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">substitution</span><div class="ph">Problem 1</div>
    <p>Evaluate $\\displaystyle\\int 2x\\cos(x^2)\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Let $u=x^2$, $du=2x\\,dx$. The integral becomes $\\int \\cos u\\,du = \\sin u + C = \\sin(x^2)+C$. (Check by differentiating: $\\cos(x^2)\\cdot 2x$ ✓.)</p></div></details></div>

    <div class="prob"><span class="lvl">substitution</span><div class="ph">Problem 2</div>
    <p>Evaluate $\\displaystyle\\int_0^1 \\frac{2x}{x^2+1}\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$u=x^2+1$, $du=2x\\,dx$; limits $1\\to 2$. $\\int_1^2 \\tfrac{du}{u} = \\big[\\ln u\\big]_1^2 = \\ln 2 - \\ln 1 = \\ln 2 \\approx 0.693$.</p></div></details></div>

    <div class="prob"><span class="lvl">by parts</span><div class="ph">Problem 3</div>
    <p>Evaluate $\\displaystyle\\int x\\sin x\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$u=x\\Rightarrow du=dx$; $dv=\\sin x\\,dx\\Rightarrow v=-\\cos x$. Then $\\int x\\sin x\\,dx = -x\\cos x - \\int(-\\cos x)\\,dx = -x\\cos x + \\sin x + C$.</p></div></details></div>

    <div class="prob"><span class="lvl">by parts</span><div class="ph">Problem 4</div>
    <p>Evaluate $\\displaystyle\\int_1^{e} \\ln x\\,dx$. (Hint: $u=\\ln x$, $dv=dx$.)</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$u=\\ln x\\Rightarrow du=\\tfrac1x dx$; $dv=dx\\Rightarrow v=x$. So $\\int \\ln x\\,dx = x\\ln x - \\int x\\cdot\\tfrac1x dx = x\\ln x - x + C$. Evaluate $\\big[x\\ln x - x\\big]_1^{e} = (e\\cdot 1 - e) - (0 - 1) = 0 - (-1) = 1$.</p></div></details></div>

    <div class="prob"><span class="lvl">partial fractions</span><div class="ph">Problem 5</div>
    <p>Evaluate $\\displaystyle\\int \\frac{1}{x(x+1)}\\,dx$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\tfrac{1}{x(x+1)} = \\tfrac{A}{x}+\\tfrac{B}{x+1}$. Cover-up: $A=\\tfrac{1}{x+1}\\big|_{x=0}=1$, $B=\\tfrac{1}{x}\\big|_{x=-1}=-1$. So $\\int\\big(\\tfrac1x - \\tfrac{1}{x+1}\\big)dx = \\ln|x| - \\ln|x+1| + C = \\ln\\big|\\tfrac{x}{x+1}\\big| + C$.</p></div></details></div>

    <div class="prob"><span class="lvl">improper</span><div class="ph">Problem 6</div>
    <p>Does $\\displaystyle\\int_1^{\\infty}\\frac{1}{\\sqrt{x}}\\,dx$ converge or diverge?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\int_1^b x^{-1/2}dx = \\big[2\\sqrt{x}\\big]_1^b = 2\\sqrt{b}-2 \\to \\infty$ as $b\\to\\infty$. It <b>diverges</b>. ($\\tfrac{1}{\\sqrt x}=x^{-1/2}$ decays too slowly — the exponent $-\\tfrac12$ is above the $-1$ borderline where things start to converge.)</p></div></details></div>

    <div class="prob"><span class="lvl">area</span><div class="ph">Problem 7</div>
    <p>Find the area enclosed between $y=x^2$ and $y=x$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>They meet where $x^2=x$, i.e. $x=0$ and $x=1$. On $(0,1)$, $x\\ge x^2$, so top is $x$. Area $=\\int_0^1(x-x^2)\\,dx = \\big[\\tfrac{x^2}{2}-\\tfrac{x^3}{3}\\big]_0^1 = \\tfrac12-\\tfrac13 = \\tfrac16$.</p></div></details></div>

    <div class="prob"><span class="lvl">volume</span><div class="ph">Problem 8</div>
    <p>The region under $y=\\sqrt{x}$ on $[0,4]$ is rotated about the $x$-axis. Find the volume.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Disks of radius $\\sqrt{x}$: $V=\\int_0^4 \\pi(\\sqrt{x})^2\\,dx = \\pi\\int_0^4 x\\,dx = \\pi\\big[\\tfrac{x^2}{2}\\big]_0^4 = \\pi\\cdot 8 = 8\\pi$.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function c5_recap(){
  stage.innerHTML=`<div class="card"><h2>What you built</h2>
    <div class="eqbox" style="line-height:2.2">$$\\int f(g(x))g'(x)\\,dx=\\int f(u)\\,du \\qquad \\int u\\,dv = uv-\\int v\\,du$$
    <div style="text-align:center;line-height:2;color:#dbe6f4;margin-top:6px">partial fractions: split a rational into $\\tfrac{A}{x-r}$ pieces $\\to$ logs<br>improper: $\\int_1^\\infty f = \\lim_{b\\to\\infty}\\int_1^b f$ (converge vs diverge)<br>area $=\\int(y_{\\text{top}}-y_{\\text{bottom}})\\,dx$ · volume $=\\int \\pi f(x)^2\\,dx$<br>arc length $=\\int \\sqrt{1+(f')^2}\\,dx$</div></div>
    <p>Every technique was a differentiation rule reversed, and every application was the same reflex: slice the thing into pieces, write one piece as an integrand, integrate. You can now integrate the large class of functions that submit to these tools — and you know, honestly, that some functions don't.</p>
    <p><b>Next — Module 7:</b> what if you add up <em>infinitely many</em> terms? <b>Sequences and series</b> ask when an infinite sum settles to a finite value — the convergence tests echo the improper-integral knife-edge you just saw — and culminate in <b>Taylor series</b>, which rebuild functions like $e^x$, $\\sin x$, and $\\cos x$ as infinite polynomials.</p></div>`;
  setHints([]);unlock();
}
