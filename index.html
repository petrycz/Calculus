function c7_doubleint(){
  stage.innerHTML=`<div class="card"><h2>Double integrals: adding up a solid</h2>
    <p>In one variable you found the <b>area</b> under a curve by slicing $[a,b]$ into thin strips, giving each strip a height and a width, and adding. Nothing about that recipe cared that the domain was a line. Lift the domain to a <b>patch of the plane</b> $R$ and the same recipe builds the <b>volume</b> between a surface $z=f(x,y)$ and that patch.</p>

    <p><b>Start from the one-variable sum and change one thing at a time.</b></p>
    <div class="eqbox">$$\\underbrace{\\int_a^b f(x)\\,dx}_{\\text{area}}=\\lim_{\\Delta x\\to0}\\sum_i f(x_i)\\,\\underbrace{\\Delta x}_{\\text{width}}$$</div>
    <p>A strip is a thin <em>rectangle</em>: width $\\Delta x$, height $f(x_i)$, so each term $f(x_i)\\,\\Delta x$ is a sliver of <b>area</b>. Now the domain is 2-D, so a "strip" becomes a little <b>tile</b> of the plane with its own small area $\\Delta A=\\Delta x\\,\\Delta y$. Perch the height $f(x_i,y_j)$ on top of that tile and the term $f(x_i,y_j)\\,\\Delta A$ is no longer a sliver of area — it's a thin <b>box</b>, a sliver of <b>volume</b>.</p>
    <div class="eqbox">$$\\underbrace{\\iint_R f(x,y)\\,dA}_{\\text{volume}}=\\lim_{\\Delta A\\to0}\\sum_i\\sum_j f(x_i,y_j)\\,\\underbrace{\\Delta A}_{\\text{tile area}}$$</div>
    <p class="small" style="color:#9fb0c4">One sum became a <em>double</em> sum because tiling a 2-D patch needs two indices — a row index and a column index — where the line needed one. That is the whole leap: $\\int\\to\\iint$, strip $\\to$ tile, area $\\to$ volume.</p>

    <p style="margin-top:16px"><b>Watch the boxes fill the solid.</b> Here $f(x,y)=x+y$ over the square $R=[0,2]\\times[0,2]$ — a tilted roof. Each box stands on one tile; its height is $f$ sampled at the tile's <b>lower-left corner</b>. Drag to refine the grid and watch the staircase of boxes climb to fill the wedge under the roof.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <p class="small" id="obs" style="margin-top:6px;color:#9fb0c4">Drag left–right to change the grid.</p>
    <div class="readout"><div class="rdc"><div class="k">grid</div><div class="v" id="nv">—</div></div><div class="rdc"><div class="k">box sum</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">true volume</div><div class="v">8</div></div><div class="rdc"><div class="k">gap left</div><div class="v" id="gapv">—</div></div></div>

    <p style="margin-top:16px"><b>Build the coarsest sum by hand.</b> Take the $2\\times2$ grid: four square tiles, each $1\\times1$, so every tile has area $\\Delta A=1$. The height on each tile is $f$ at its lower-left corner. The picture below marks those four corners and their heights $f=x+y$:</p>
    <canvas id="cv2" width="640" height="260"></canvas>
    <div class="task"><b>The 2×2 box sum</b>Add the four box volumes: $\\displaystyle\\sum f(\\text{corner})\\cdot\\Delta A$ with $\\Delta A=1$. What total do you get?</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Why it undershoots, and where it lands.</b> $f=x+y$ <em>grows</em> across each tile, so the lower-left corner is the tile's <b>lowest</b> point — every box sits entirely under the roof and the sum underestimates. Refine and the boxes slide up into the leftover wedge. For this example the corner sum has a clean closed form:</p>
    <div class="eqbox">$$S_N=8\\left(1-\\tfrac1N\\right)\\;\\xrightarrow[\\;N\\to\\infty\\;]{}\\;8.$$</div>
    <p>So $N=2$ gives $8(1-\\tfrac12)=4$ (your hand sum), $N=4$ gives $6$, $N=10$ gives $7.2$, climbing to the true volume $8$. That limit <em>is</em> the double integral:</p>
    <div class="eqbox">$$\\iint_{[0,2]^2}(x+y)\\,dA=8.$$</div>
    <p>Two reminders that carry over from one variable. The integral is a <b>signed</b> volume: where $f\\lt0$ the boxes hang below the plane and count negative. And this limit-of-a-double-sum is the <em>definition</em>, not a method — nobody evaluates it by summing boxes forever. The next beat collapses $\\iint$ into two ordinary one-variable integrals.</p></div>`;

  // ---- 3-D Riemann-box interactive ----
  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const sx=68,sy=30,sz=24,cx=300,cy=232;
  const P=(x,y,z)=>[cx+(x-y)*sx, cy+(x+y)*sy - z*sz];
  const f=(x,y)=>x+y;
  let N=4;
  function face(p,fill,stroke){if(!ctx)return;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
  function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    const d=2/N,dA=d*d;let S=0;
    // floor outline of the region R
    face([P(0,0,0),P(2,0,0),P(2,2,0),P(0,2,0)],'rgba(122,184,255,0.05)','#223247');
    // target roof plane z=x+y (drawn first, behind the tall front boxes it is mostly hidden; light wireframe)
    ctx.strokeStyle='rgba(232,184,75,0.45)';ctx.lineWidth=1.2;
    for(const yy of [0,2]){const A=P(0,yy,f(0,yy)),B=P(2,yy,f(2,yy));ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
    for(const xx of [0,2]){const A=P(xx,0,f(xx,0)),B=P(xx,2,f(xx,2));ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
    // collect + painter-sort boxes back(small i+j)->front(large i+j)
    const cells=[];for(let i=0;i<N;i++)for(let j=0;j<N;j++)cells.push([i,j]);
    cells.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
    for(const [i,j] of cells){const x=i*d,y=j*d,h=f(x,y);S+=h*dA;
      if(h<=0)continue;
      const t=Math.max(0,Math.min(1,h/4));
      const top='rgb('+Math.round(60+t*150)+','+Math.round(110+t*80)+','+Math.round(210-t*120)+')';
      const rt='rgb('+Math.round(40+t*110)+','+Math.round(80+t*60)+','+Math.round(160-t*90)+')';
      const ft='rgb('+Math.round(28+t*85)+','+Math.round(60+t*45)+','+Math.round(120-t*70)+')';
      const x1=x+d,y1=y+d;
      // right (+x) face
      face([P(x1,y,0),P(x1,y1,0),P(x1,y1,h),P(x1,y,h)],rt,'rgba(13,20,32,0.55)');
      // front (+y) face
      face([P(x,y1,0),P(x1,y1,0),P(x1,y1,h),P(x,y1,h)],ft,'rgba(13,20,32,0.55)');
      // top
      face([P(x,y,h),P(x1,y,h),P(x1,y1,h),P(x,y1,h)],top,'rgba(13,20,32,0.55)');}
    ctx.fillStyle='#5d7186';ctx.font='12px sans-serif';ctx.fillText('z = f(x,y) = x + y   over   [0,2]×[0,2]',14,22);
    document.getElementById('nv').textContent=N+' × '+N;
    document.getElementById('sv').textContent=S.toFixed(3);
    document.getElementById('gapv').textContent=(8-S).toFixed(3);
    const ob=document.getElementById('obs');if(ob)ob.textContent=N<=2?'Coarsest grid: four fat boxes, far under the roof — sum 4, a gap of 4 still empty.':(N>=10?'Fine grid: the staircase nearly fills the wedge — sum 7.2, only 0.8 to go.':'Boxes climbing into the wedge under the roof. Each refinement shrinks the gap.');}
  cv.style.touchAction='none';let drg=false;
  function setN(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)/Math.max(1,r.width);N=Math.max(2,Math.min(10,Math.round(2+X*8)));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setN(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setN(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();

  // ---- 2-D companion: the 2x2 grid with corner samples labelled ----
  (function(){const c=document.getElementById('cv2');const g=c&&c.getContext&&c.getContext('2d');if(!g)return;const CW=c.width,CH=c.height;
    const ax=150,bx=470,ay=230,by=30;const qx=x=>ax+(x/2)*(bx-ax),qy=y=>ay+(y/2)*(by-ay);
    g.clearRect(0,0,CW,CH);
    // tiles
    for(let i=0;i<2;i++)for(let j=0;j<2;j++){const h=i+j;const t=h/2;
      g.fillStyle='rgba('+Math.round(60+t*150)+','+Math.round(110+t*80)+','+Math.round(210-t*120)+',0.28)';
      g.fillRect(qx(i),qy(j+1),(bx-ax)/2,(ay-by)/2);}
    g.strokeStyle='#45586f';g.lineWidth=1.3;
    for(let k=0;k<=2;k++){g.beginPath();g.moveTo(qx(k),qy(0));g.lineTo(qx(k),qy(2));g.stroke();g.beginPath();g.moveTo(qx(0),qy(k));g.lineTo(qx(2),qy(k));g.stroke();}
    // axes ticks
    g.fillStyle='#5d7186';g.font='12px sans-serif';
    g.fillText('x',bx+8,qy(0)+4);g.fillText('y',qx(0)-6,by-8);
    g.fillText('0',qx(0)-10,qy(0)+16);g.fillText('1',qx(1)-4,qy(0)+16);g.fillText('2',qx(2)-4,qy(0)+16);
    g.fillText('1',qx(0)-16,qy(1)+4);g.fillText('2',qx(0)-16,qy(2)+4);
    // corner samples (lower-left of each tile)
    const corners=[[0,0],[1,0],[0,1],[1,1]];
    for(const [i,j] of corners){const h=i+j;g.fillStyle='#e8b84b';g.beginPath();g.arc(qx(i),qy(j),5,0,7);g.fill();
      g.fillStyle='#f2e3c0';g.font='600 13px sans-serif';g.fillText('f = '+h,qx(i)+9,qy(j)-7);}
    g.fillStyle='#7f93a8';g.font='12px sans-serif';g.fillText('each tile 1×1  →  ΔA = 1',ax,ay+28);

  numChk(stage.querySelector('.card'),4,()=>{addReveal(`<div class="rh">✓ 4</div><p>The four corner heights are $0,1,1,2$ and each tile has area $\\Delta A=1$, so the box sum is $(0+1+1+2)\\cdot1=4$. Drag the grid down to $2\\times2$ and the readout confirms it. Refine and the sum climbs: $4\\to6\\to7.2\\to\\cdots\\to8$, the true volume under the roof.</p>`);});
  setHints([`Four tiles, each ΔA=1. Read the four corner heights off the picture: 0, 1, 1, 2.`,`(0+1+1+2)·1 = 4.`]);

function c7_iterated(){
  stage.innerHTML=`<div class="card"><h2>Iterated integrals: slice, then stack</h2>
    <p>The double integral $\\iint_R f\\,dA$ is defined as a limit of a double sum — and nobody wants to take that limit directly. The way out is to reduce it to something we can already do: ordinary one-variable integrals. Watch what happens if we add up the little boxes <b>one row at a time</b>.</p>
    <p>Group the double sum by rows. Fix a row at height $y_j$ and sum across it first; then add up the rows:</p>
    <div class="eqbox">$$\\sum_j\\bigg(\\underbrace{\\sum_i f(x_i,y_j)\\,\\Delta x}_{\\text{a 1-D sum along the row}}\\bigg)\\Delta y.$$</div>
    <p>The inner sum is just a one-variable Riemann sum along a single row — $y_j$ is held still while $x$ runs. In the limit it becomes an ordinary integral in $x$, a number that depends on which row you picked. Call it the <b>slice area</b> $A(y)$:</p>
    <div class="eqbox">$$A(y)=\\int_a^b f(x,y)\\,dx\\qquad(\\text{integrate over }x,\\ \\text{treat }y\\text{ as a constant}).$$</div>
    <p>Then the outer sum stacks those slices and becomes an integral in $y$. Two nested one-variable integrals — this is <b>Fubini's theorem</b>:</p>
    <div class="eqbox">$$\\iint_R f\\,dA=\\int_c^d\\!\\!\\underbrace{\\bigg(\\int_a^b f(x,y)\\,dx\\bigg)}_{A(y)}dy.$$</div>

    <p>It's the volume-by-slices idea from Module 6, lifted one dimension: back then a slice was a flat area; here each slice is itself a flat area $A(y)$, and stacking them sweeps out a volume. Below is the solid under $z=f(x,y)=x+y$ over $[0,3]\\times[0,2]$. <b>Drag to sweep the gold slice</b>; the panel beneath shows that same slice flattened, with its area $A$ shaded — the inner integral, live.</p>
    <div class="seg" id="segm"></div>
    <canvas id="cv" width="640" height="380"></canvas>
    <canvas id="cvS" width="640" height="240"></canvas>
    <p class="small" id="obsI" style="margin-top:6px;color:#9fb0c4"></p>
    <div class="readout"><div class="rdc"><div class="k" id="k1">slice at</div><div class="v" id="yv">—</div></div><div class="rdc"><div class="k" id="k2">slice area A</div><div class="v" id="av">—</div></div><div class="rdc"><div class="k">volume so far</div><div class="v" id="vv">—</div></div></div>
    <div class="task"><b>Evaluate the whole thing</b>Sweep all the way, or compute: $\\displaystyle\\int_0^2\\!\\!\\int_0^3 (x+y)\\,dx\\,dy$.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div>

    <p style="margin-top:16px"><b>Work it inside-out.</b> The <em>inner</em> integral holds $y$ fixed and integrates over $x$ — the shaded slice area:</p>
    <div class="eqbox">$$A(y)=\\int_0^3 (x+y)\\,dx=\\Big[\\tfrac{x^2}{2}+xy\\Big]_0^3=\\tfrac{9}{2}+3y.$$</div>
    <p>Then the <em>outer</em> integral stacks the slices over $y$:</p>
    <div class="eqbox">$$\\int_0^2\\Big(\\tfrac{9}{2}+3y\\Big)dy=\\Big[\\tfrac92 y+\\tfrac{3}{2}y^2\\Big]_0^2=9+6=15.$$</div>

    <p><b>Slice the other way — same solid, same volume.</b> Flip the switch above the picture to sweep in $x$ instead. Now the inner integral runs over $y$ with $x$ held fixed, $B(x)=\\int_0^2(x+y)\\,dy=2x+2$, and the outer integral stacks those:</p>
    <div class="eqbox">$$\\int_0^3\\!\\!\\int_0^2 (x+y)\\,dy\\,dx=\\int_0^3(2x+2)\\,dx=\\big[x^2+2x\\big]_0^3=9+6=15.$$</div>
    <p>Both orders give $15$. That freedom is the useful half of Fubini: pick whichever inner integral is easier. (On a rectangle the inner limits are plain numbers; over a curved region they can depend on the outer variable — the next beats handle that.) This is the entire computational engine of multivariable integration.</p></div>`;

  const cv=document.getElementById('cv');const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const OX=150,OY=260,exX=50,exY=17,eyX=48,eyY=-31,ezZ=24;
  const P=(x,y,z)=>[OX+x*exX+y*eyX, OY+x*exY+y*eyY-z*ezZ];
  const f=(x,y)=>x+y;
  let mode='y', t=1;                       // t = outer sweep position
  const Tmax=()=>mode==='y'?2:3;
  function poly(pts,fill,stroke,w){if(!ctx)return;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||1;ctx.stroke();}}
  function seg(a,b,color,w){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=w||1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  function sliceQuad(u){return mode==='y'
    ? [P(0,u,0),P(3,u,0),P(3,u,f(3,u)),P(0,u,f(0,u))]
    : [P(u,0,0),P(u,2,0),P(u,2,f(u,2)),P(u,0,f(u,0))];}
  function draw3d(){if(!ctx)return;ctx.clearRect(0,0,W,H);
    poly([P(0,0,0),P(3,0,0),P(3,2,0),P(0,2,0)],'rgba(20,30,45,0.65)',null);
    for(let gx=0;gx<=3;gx++)seg(P(gx,0,0),P(gx,2,0),'#243347',1);
    for(let gy=0;gy<=2;gy++)seg(P(0,gy,0),P(3,gy,0),'#243347',1);
    const step=0.045;
    for(let u=t;u>=-1e-9;u-=step)poly(sliceQuad(u),'rgba(122,184,255,0.11)',null);
    poly(sliceQuad(t),'rgba(232,184,75,0.30)','#e8b84b',2);
    seg(P(0,0,f(0,0)),P(3,0,f(3,0)),'#7ab8ff',1.5);
    seg(P(3,0,f(3,0)),P(3,2,f(3,2)),'#7ab8ff',1.5);
    seg(P(3,2,f(3,2)),P(0,2,f(0,2)),'#7ab8ff',1.5);
    seg(P(0,2,f(0,2)),P(0,0,f(0,0)),'#7ab8ff',1.5);
    seg(P(0,0,0),P(0,0,f(0,0)),'#3a4c66',1);seg(P(3,0,0),P(3,0,f(3,0)),'#3a4c66',1);
    seg(P(3,2,0),P(3,2,f(3,2)),'#3a4c66',1);seg(P(0,2,0),P(0,2,f(0,2)),'#3a4c66',1);
    ctx.fillStyle='#5d7186';ctx.font='12px sans-serif';
    ctx.fillText('z = x + y',P(0,2,f(0,2))[0]-4,P(0,2,f(0,2))[1]-8);
    ctx.fillText('x',P(3,0,0)[0]+6,P(3,0,0)[1]+4);ctx.fillText('y',P(0,2,0)[0]-14,P(0,2,0)[1]-2);
    // readouts
    const A=mode==='y'?(4.5+3*t):(2*t+2);
    const V=mode==='y'?(4.5*t+1.5*t*t):(t*t+2*t);
    document.getElementById('yv').textContent=t.toFixed(2);
    document.getElementById('av').textContent=A.toFixed(2);
    document.getElementById('vv').textContent=V.toFixed(2);
    document.getElementById('k1').textContent=mode==='y'?'slice y':'slice x';
    document.getElementById('k2').textContent=mode==='y'?'slice area A(y)=∫f dx':'slice area A(x)=∫f dy';
    const ob=document.getElementById('obsI');if(ob)ob.textContent=mode==='y'
      ?'Slicing ⟂ y: each gold slice has area A(y)=∫₀³(x+y)dx. Sweep y from 0 to 2 and the areas stack into the volume.'
      :'Slicing ⟂ x: each gold slice has area B(x)=∫₀²(x+y)dy. Sweep x from 0 to 3 — the volume comes out the same, 15.';}

  // ---- 2-D inset: the current slice, flattened, with its area shaded (the inner integral) ----
  const cvs=document.getElementById('cvS');const cs=cvs&&cvs.getContext&&cvs.getContext('2d');const Ws=cvs.width,Hs=cvs.height;
  const ml=56,mr=20,mt=22,mb=42,zmax=5.6;
  function drawSlice(){if(!cs)return;cs.clearRect(0,0,Ws,Hs);
    const T=mode==='y'?3:2;                 // inner variable range
    const inner=mode==='y'?'x':'y';const held=mode==='y'?('y = '+t.toFixed(2)):('x = '+t.toFixed(2));
    const pw=Ws-ml-mr,ph=Hs-mt-mb;
    const sx=u=>ml+(u/T)*pw, sy=z=>mt+ph-(z/zmax)*ph;
    // axes
    cs.strokeStyle='#2b3a4f';cs.lineWidth=1.2;cs.beginPath();cs.moveTo(ml,mt);cs.lineTo(ml,mt+ph);cs.lineTo(ml+pw,mt+ph);cs.stroke();
    // height along the slice: z = (inner var) + (held value), from the held line up
    const hv=t;                              // held value equals t in both modes (f=x+y)
    const z0=u=>u+hv;
    // shaded area under the profile
    cs.fillStyle='rgba(232,184,75,0.22)';cs.beginPath();cs.moveTo(sx(0),sy(0));
    for(let u=0;u<=T+1e-9;u+=T/120)cs.lineTo(sx(u),sy(z0(u)));
    cs.lineTo(sx(T),sy(0));cs.closePath();cs.fill();
    // profile line
    cs.strokeStyle='#e8b84b';cs.lineWidth=2.6;cs.beginPath();for(let u=0;u<=T+1e-9;u+=T/120){const X=sx(u),Y=sy(z0(u));u?cs.lineTo(X,Y):cs.moveTo(X,Y);}cs.stroke();
    // ticks + labels
    cs.fillStyle='#5d7186';cs.font='12px sans-serif';
    cs.fillText(inner,ml+pw-6,mt+ph+28);cs.fillText('z',ml-30,mt+8);
    cs.fillText('0',ml-14,mt+ph+16);cs.fillText(String(T),ml+pw-4,mt+ph+16);
    const A=mode==='y'?(4.5+3*t):(2*t+2);
    cs.fillStyle='#e8b84b';cs.font='600 13px sans-serif';
    cs.fillText('inner integral = shaded area  A = '+A.toFixed(2),ml+8,mt+16);
    cs.fillStyle='#9fb0c4';cs.font='12px sans-serif';
    cs.fillText('slice at '+held+'  ·  height z = '+inner+' + '+t.toFixed(2),ml+8,mt+ph+28-0);}

  function draw(){draw3d();drawSlice();}

  // ---- Fubini direction toggle ----
  function buildSeg(){const el=document.getElementById('segm');if(!el)return;
    el.innerHTML=`<span class="segb ${mode==='y'?'on':''}" data-m="y">slice ⟂ y  (inner ∫dx)</span><span class="segb ${mode==='x'?'on':''}" data-m="x">slice ⟂ x  (inner ∫dy)</span>`;
    el.querySelectorAll('.segb').forEach(b=>b.onclick=()=>{mode=b.dataset.m;t=Tmax()/2;buildSeg();draw();});}
  buildSeg();

  // drag the 3-D solid to sweep
  cv.style.touchAction='none';let drg=false;
  function setP(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(W/Math.max(1,r.width));t=Math.max(0,Math.min(Tmax(),(X-40)/(W-80)*Tmax()));draw();}
  cv.addEventListener('pointerdown',e=>{drg=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}setP(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(drg){e.preventDefault();setP(e);}});
  const end=()=>drg=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  draw();

  numChk(stage.querySelector('.card'),15,()=>{addReveal(`<div class="rh">✓ 15</div><p>Inner integral (slice area) $A(y)=\\tfrac92+3y$; the outer integral stacks the slices to $9+6=15$. Sweep the gold slice from $y=0$ to $2$ and the "volume so far" readout climbs to exactly $15$, as the slice areas run from $A(0)=4.5$ up to $A(2)=10.5$. Flip the switch and slice the other way: $\\int_0^3(2x+2)\\,dx=15$ too. Two single integrals, nested either way.</p>`);});
  setHints([`Inner first: ∫₀³(x+y)dx = 9/2 + 3y (treat y as constant). Then ∫₀²(9/2+3y)dy.`,`[9y/2 + 3y²/2] from 0 to 2 = 9 + 6 = 15.`]);
}
function c7_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Surfaces, partials, the tangent plane, the gradient, directional derivatives, and the chain rule. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">partial derivatives</span><div class="ph">Problem 1</div>
    <p>For $f(x,y)=x^3y+y^2$, find $\\dfrac{\\partial f}{\\partial x}$ and $\\dfrac{\\partial f}{\\partial y}$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Holding $y$ fixed, $x^3y\\to 3x^2y$ and $y^2$ is constant: $\\frac{\\partial f}{\\partial x}=3x^2y$. Holding $x$ fixed: $\\frac{\\partial f}{\\partial y}=x^3+2y$.</p></div></details></div>

    <div class="prob"><span class="lvl">contour map</span><div class="ph">Problem 2</div>
    <p>Describe the level curves (contours) of $f(x,y)=y-x^2$. What does the surface look like?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>A contour is $y-x^2=c$, i.e. $y=x^2+c$ — a parabola, one for each height $c$, stacked vertically as $c$ grows. The surface is a parabolic trough (a "half-pipe") running along the $y$-direction, rising as you move up and to the sides.</p></div></details></div>

    <div class="prob"><span class="lvl">tangent plane · linear approx</span><div class="ph">Problem 3</div>
    <p>For $f(x,y)=x^2+xy$ at $P=(1,2)$, write the tangent-plane approximation $L$ and use it to estimate $f(1.1,\\,1.9)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$f(P)=1+2=3$, $f_x=2x+y=4$, $f_y=x=1$, so $L=3+4\\,\\Delta x+1\\,\\Delta y$. At $(1.1,1.9)$: $\\Delta x=0.1,\\ \\Delta y=-0.1$, giving $L=3+0.4-0.1=3.3$. (True value $f=1.21+2.09=3.30$ — the plane nails it to two decimals.)</p></div></details></div>

    <div class="prob"><span class="lvl">gradient</span><div class="ph">Problem 4</div>
    <p>For $f(x,y)=x^2+3y^2$, find $\\nabla f$ at $(1,1)$ and its magnitude.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(2x,6y)$, so at $(1,1)$ it is $(2,6)$. Magnitude $=\\sqrt{2^2+6^2}=\\sqrt{40}=2\\sqrt{10}\\approx6.32$ — the steepest slope there, pointing across the contour toward higher ground.</p></div></details></div>

    <div class="prob"><span class="lvl">directional derivative</span><div class="ph">Problem 5</div>
    <p>For $f=x^2+y^2$ at $(3,4)$, find the directional derivative in the unit direction $\\mathbf u=\\left(\\tfrac35,\\tfrac45\\right)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\nabla f=(6,8)$, and $\\mathbf u$ is a unit vector ($\\tfrac{9}{25}+\\tfrac{16}{25}=1$). $D_{\\mathbf u}f=(6,8)\\cdot(\\tfrac35,\\tfrac45)=\\tfrac{18}{5}+\\tfrac{32}{5}=10$. It equals $|\\nabla f|$ — because $\\mathbf u$ points exactly along the gradient (steepest ascent).</p></div></details></div>

    <div class="prob"><span class="lvl">directional derivative — normalize first</span><div class="ph">Problem 6</div>
    <p>For $f=x^2+y^2$ at $(3,4)$, find the rate of change heading <em>toward the origin</em>, i.e. along the vector $\\mathbf v=(-3,-4)$.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\mathbf v$ isn't a unit vector: $|\\mathbf v|=5$, so $\\mathbf u=(-\\tfrac35,-\\tfrac45)$. Then $D_{\\mathbf u}f=(6,8)\\cdot(-\\tfrac35,-\\tfrac45)=-\\tfrac{18}{5}-\\tfrac{32}{5}=-10=-|\\nabla f|$. Heading straight at the valley floor is the steepest <em>descent</em> — the direction $-\\nabla f$. (Forget to normalize and you'd wrongly get $-50$.)</p></div></details></div>

    <div class="prob"><span class="lvl">steepest ascent</span><div class="ph">Problem 7</div>
    <p>At $(1,2)$ on $f(x,y)=x^2+y^2$, which direction increases $f$ fastest, and how fast?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Fastest increase is along $\\nabla f=(2,4)$, i.e. the unit direction $\\tfrac{1}{\\sqrt5}(1,2)$. The rate is $|\\nabla f|=\\sqrt{2^2+4^2}=\\sqrt{20}=2\\sqrt5\\approx4.47$.</p></div></details></div>

    <div class="prob"><span class="lvl">multivariable chain rule</span><div class="ph">Problem 8</div>
    <p>Let $z=x^2y$ with $x=t^2$ and $y=t$. Find $\\dfrac{dz}{dt}$ at $t=1$ by the chain rule, and check directly.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\frac{dz}{dt}=\\frac{\\partial z}{\\partial x}\\frac{dx}{dt}+\\frac{\\partial z}{\\partial y}\\frac{dy}{dt}=(2xy)(2t)+(x^2)(1)$. At $t=1$ ($x=1,y=1$): $(2)(2)+(1)=5$. Direct check: $z=(t^2)^2\\,t=t^5$, so $\\frac{dz}{dt}=5t^4=5$ at $t=1$. The two routes ($4$ through $x$, $1$ through $y$) sum to the whole.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — walking a contour</span><div class="ph">Problem 9</div>
    <p>With $z=x^2+y^2$ and the path $x=\\cos t,\\ y=\\sin t$, compute $\\dfrac{dz}{dt}$. Explain the answer in one sentence.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>$\\frac{dz}{dt}=\\nabla z\\cdot(x',y')=(2\\cos t,\\,2\\sin t)\\cdot(-\\sin t,\\,\\cos t)=-2\\cos t\\sin t+2\\sin t\\cos t=0$. The path is the unit circle — a level curve of $z=x^2+y^2$ — so you're walking along a contour and your height never changes. (Equivalently, the velocity is perpendicular to $\\nabla z$, so the dot product is zero.)</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}

function c7_recap(){
  stage.innerHTML=`<div class="card"><h2>What you built</h2>
    <div class="eqbox" style="line-height:2.2">$$z=f(x,y)\\ \\text{(a surface / contour map)}\\qquad \\frac{\\partial f}{\\partial x}=\\text{slope holding }y\\text{ fixed}$$</div>
    <div style="text-align:center;line-height:2.1;color:#dbe6f4;margin-top:4px">tangent plane: $f(P{+}\\mathbf p)\\approx f(P)+f_x\\,\\Delta x+f_y\\,\\Delta y$ — the local flat model everything rests on<br>gradient $\\nabla f=(f_x,f_y)$: steepest ascent, $\\perp$ contours, $|\\nabla f|$ = steepest slope<br>directional derivative $D_{\\mathbf u}f=\\nabla f\\cdot\\mathbf u=|\\nabla f|\\cos\\varphi$ (slope in any direction)<br>chain rule $\\dfrac{dz}{dt}=\\displaystyle\\sum_i\\frac{\\partial z}{\\partial x_i}\\frac{dx_i}{dt}$ — multiply along each route, add the routes (backprop)</div>
    <p>With several inputs, calculus works one direction at a time and then reassembles. A partial derivative is the slope of a vertical slice. Zooming in, the whole surface flattens to a <b>tangent plane</b> built from those slopes — the local linear model that quietly powers everything else. Bundle the slopes into the <b>gradient</b> and it points straight uphill, perpendicular to the contours, with length equal to the steepest slope; dot it with any unit direction to get the slope <em>that</em> way. And when the inputs are themselves moving, the <b>chain rule</b> threads the rates through the composition — the same "multiply along routes, add routes" that, run backward through a giant graph, is backpropagation.</p>
    <p><b>Next — Module 9: Multivariable Optimization.</b> Now that you can measure slope in every direction, you can hunt for the best point: where $\\nabla f=\\mathbf 0$, whether it's a peak, valley, or saddle (the Hessian decides), how gradient descent and Newton's method walk downhill, and how Lagrange multipliers optimize under a constraint — the mathematical core of training a model. <b>Module 10</b> then turns to <b>multiple integrals</b>: accumulating a function over a region.</p></div>`;
  setHints([]);unlock();
}
