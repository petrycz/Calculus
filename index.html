<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Calculus, Refreshed</title>
<style>
  :root{--bg:#0d1420;--grid:#172233;--panel:#131d2c;--panel2:#182437;--ink:#e9eef6;
    --muted:#8095ab;--muted2:#5d6f85;--accent:#7ab8ff;--good:#3fb98f;--good2:#1e4a3d;--bad:#e2664f;--bad2:#4a2620;
    --gold:#e8b84b;--line:#243347;--rad:15px;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
  .wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px calc(24px + env(safe-area-inset-bottom));}
  header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 0 9px;background:linear-gradient(var(--bg) 80%,transparent);}
  .htop{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-height:24px;}
  .back{color:var(--accent);font-size:14px;cursor:pointer;font-weight:500;padding:4px 2px;}
  .kick{font-weight:600;font-size:12px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kick.course{color:var(--accent);text-transform:uppercase;letter-spacing:.7px;font-size:11px;}
  .step{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .pbar{height:5px;border-radius:4px;background:var(--panel);overflow:hidden;border:1px solid var(--line);}
  .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s;}
  main{flex:1;}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--rad);padding:18px 15px;box-shadow:0 16px 38px -26px rgba(0,0,0,.8);animation:in .3s cubic-bezier(.2,.7,.2,1);margin-top:6px;}
  @keyframes in{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}
  h1{font-weight:800;font-size:22px;letter-spacing:-.4px;margin:2px 2px 6px;line-height:1.2;}
  h2{font-weight:750;font-size:19px;letter-spacing:-.3px;margin:0 0 11px;line-height:1.28;}
  .lede{color:var(--muted);font-size:14px;line-height:1.55;margin:0 2px 15px;}
  p{font-size:15.5px;line-height:1.62;color:#d6e0ee;margin:0 0 13px;}
  p.small{font-size:13.5px;color:var(--muted);}
  em{color:var(--ink);font-style:italic;} b,strong{color:var(--ink);font-weight:650;}
  .mono{font-family:var(--mono);color:var(--accent);font-size:.94em;}
  .cy{color:var(--accent);} .gld{color:var(--gold);} .grn{color:var(--good);} .rd{color:var(--bad);}
  .eqbox{font-family:var(--mono);font-size:14.5px;line-height:1.8;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;color:#dbe6f4;overflow-x:auto;}
  .eqbox .hl{color:var(--gold);}
  .mathrow{text-align:center;margin:14px 0;font-family:var(--mono);font-size:15px;overflow-x:auto;white-space:nowrap;}
  sub,sup{font-size:.72em;}
  canvas{width:100%;height:auto;display:block;border-radius:12px;background:#0a111b;border:1px solid var(--line);touch-action:none;}
  .readout{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .rdc{flex:1;min-width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
  .rdc .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .rdc .v{font-family:var(--mono);font-weight:700;font-size:16px;margin-top:2px;}
  .ctrls{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .slabel{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:74px;}
  input[type=range]{flex:1;min-width:140px;accent-color:var(--accent);height:30px;}
  .task{background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.28);border-radius:11px;padding:12px 13px;margin:14px 0;font-size:14.5px;line-height:1.55;color:#f0e2c2;}
  .task b{color:var(--gold);font-size:11px;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px;}
  .entry{display:flex;gap:9px;align-items:center;margin-top:12px;}
  .entry input{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;color:var(--ink);font-family:var(--mono);font-size:16px;padding:12px 13px;outline:none;min-width:0;}
  .entry input:focus{border-color:var(--accent);}
  .miniout{margin-top:9px;font-size:13.5px;line-height:1.5;} .miniout.ok{color:var(--good);} .miniout.no{color:var(--bad);}
  .choices{display:grid;grid-template-columns:1fr;gap:9px;margin-top:13px;}
  .choice{background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;font-size:14px;line-height:1.4;transition:.12s;}
  .choice .cm{font-family:var(--mono);}
  .choice.correct{border-color:var(--good);background:var(--good2);color:#c7f4e3;} .choice.wrong{border-color:var(--bad);background:var(--bad2);color:#f6cdc4;} .choice.dim{opacity:.45;} .choice.locked{cursor:default;}
  .code{background:#0a1019;border:1px solid var(--line);border-radius:11px;margin:13px 0;overflow:hidden;}
  .code .ch{font-family:var(--mono);font-size:11px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--line);background:#0c131e;letter-spacing:.4px;}
  .code pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#cfe0f2;-webkit-overflow-scrolling:touch;}
  .prob{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin:13px 0;background:var(--panel2);}
  .prob .ph{font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.3px;margin-bottom:7px;}
  .prob .lvl{float:right;font-size:10px;color:var(--muted2);border:1px solid var(--line);border-radius:20px;padding:1px 7px;letter-spacing:.4px;}
  details{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;}
  summary{cursor:pointer;color:var(--gold);font-size:13px;font-weight:600;list-style:none;}
  summary::-webkit-details-marker{display:none;} summary::before{content:'▸ ';}
  details[open] summary::before{content:'▾ ';}
  .sol{font-size:14px;line-height:1.6;color:#d0dcea;margin-top:9px;} .sol p{font-size:14px;margin:0 0 9px;}
  .reveal{margin-top:15px;border-left:3px solid var(--good);background:rgba(63,185,143,.07);border-radius:0 11px 11px 0;padding:12px 14px;animation:in .3s ease;}
  .reveal .rh{font-weight:750;font-size:13px;color:var(--good);margin-bottom:6px;}
  .reveal p{font-size:14px;color:#d7e6df;margin:0 0 8px;} .reveal p:last-child{margin:0;}
  .reveal .note{font-family:var(--mono);font-size:13px;color:var(--accent);}
  .flash{position:fixed;left:50%;top:calc(16% + env(safe-area-inset-top));transform:translateX(-50%);background:var(--good);color:#06231a;font-weight:750;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;z-index:50;}
  .flash.show{animation:flash 1.1s ease;}
  @keyframes flash{0%{opacity:0;transform:translate(-50%,6px);}15%{opacity:1;transform:translate(-50%,0);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-8px);}}
  footer{position:sticky;bottom:0;padding:11px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 32%);display:flex;gap:10px;align-items:center;}
  .btn{font-weight:650;font-size:15px;border:none;border-radius:11px;padding:14px 18px;cursor:pointer;transition:.1s;font-family:var(--sans);}
  .btn:active{transform:scale(.98);}
  .btn.primary{flex:1;background:var(--accent);color:#08131b;} .btn.primary:disabled{background:var(--panel2);color:var(--muted2);cursor:default;}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.hint{background:transparent;color:var(--gold);border:1px solid var(--line);}
  .hintbox{font-size:13.5px;line-height:1.55;color:#f0e2c2;background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.25);border-radius:10px;padding:11px 13px;margin-top:12px;display:none;}
  .hintbox.show{display:block;}
  .mcard{cursor:pointer;transition:border-color .15s,transform .08s;} .mcard.lock{opacity:.55;cursor:default;}
  .mtop{display:flex;align-items:center;gap:9px;} .mnum{font-family:var(--mono);font-size:12px;color:var(--muted2);}
  .mstat{margin-left:auto;font-weight:650;font-size:11px;padding:3px 9px;border-radius:999px;}
  .mstat.done{color:var(--good);background:var(--good2);} .mstat.todo{color:var(--accent);background:rgba(122,184,255,.14);} .mstat.soon{color:var(--muted2);background:#141e2c;}
  .mtitle{font-weight:750;font-size:17px;margin:8px 0 5px;} .msub{color:var(--muted);font-size:13.5px;line-height:1.5;}
  .rvlink{color:var(--gold);cursor:pointer;font-size:12px;white-space:nowrap;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htop"><span class="back" id="backBtn" style="display:none">‹ Menu</span><span class="kick course" id="kick">Calculus, Refreshed</span><span class="step" id="stepLbl"></span></div>
    <div class="pbar" id="pbarWrap" style="display:none"><i id="pfill" style="width:0%"></i></div>
  </header>
  <main><div id="stage"></div><div class="hintbox" id="hintbox"></div></main>
  <footer id="footer" style="display:none"><button class="btn ghost" id="prevBtn" style="display:none">Back</button><button class="btn hint" id="hintBtn">Hint</button><button class="btn primary" id="contBtn" disabled>Continue</button></footer>
</div>
<div class="flash" id="flash">✓</div>
<script>
"use strict";
const stage=document.getElementById('stage'),hintBtn=document.getElementById('hintBtn'),contBtn=document.getElementById('contBtn'),
      hintbox=document.getElementById('hintbox'),flashEl=document.getElementById('flash'),footer=document.getElementById('footer');
let view='menu',curM=0,beat=0,unlocked=false,hints=[],hintIdx=0,recallReturn=null;
const completed={};
const MODULES=[
 {id:'c1',title:'Limits & Continuity',sub:'The ε-δ foundation: what it means to approach a value, and when a function has no breaks.',ready:true,
  outro:`A limit is the value a function approaches — made rigorous by the ε-δ challenge. Continuity is "the limit equals the value," and it powers the Intermediate Value Theorem. Everything in calculus is built on this.`,
  beats:[c1_intro,c1_intuitive,c1_epsdelta,c1_laws,c1_indet,c1_continuity,c1_infinity,c1_problems,c1_recap]},
 {id:'c2',title:'The Derivative',sub:'Instantaneous rate of change as a limit; the rules and the chain rule.',ready:true,
  outro:`A derivative is one specific limit — the secant slope as the gap closes. Written f′(x) or dy/dx, precomputed into the power/product/quotient rules and composed by the chain rule. Differentiable implies continuous, but corners and cusps show the converse fails.`,
  beats:[c2_recall,c2_intro,c2_notation,c2_rules,c2_chain,c2_diffcont,c2_problems,c2_recap]},
 {id:'c3',title:'Applications of the Derivative',sub:'Extrema, the Mean Value Theorem, optimization, related rates, L\u2019H\u00f4pital.',ready:false},
 {id:'c4',title:'Integration & the FTC',sub:'Riemann sums, the definite integral, and the Fundamental Theorem of Calculus.',ready:false},
 {id:'c5',title:'Techniques & Applications of Integration',sub:'Substitution, parts, partial fractions, improper integrals; area, volume, arc length.',ready:false},
 {id:'c6',title:'Sequences & Series',sub:'Convergence tests, power series, and Taylor/Maclaurin expansions.',ready:false},
 {id:'c7',title:'Multivariable Calculus',sub:'Partial derivatives, the gradient, directional derivatives, and multiple integrals.',ready:false},
 {id:'c8',title:'Vector Calculus',sub:'Vector fields, line & surface integrals, and the Green/Stokes/divergence theorems.',ready:false},
];
function setHints(a){hints=a||[];hintIdx=0;hintBtn.style.display=hints.length?'block':'none';}
function unlock(){if(unlocked)return;unlocked=true;contBtn.disabled=false;}
function flash(t){flashEl.textContent=t||'✓';flashEl.className='flash show';setTimeout(()=>flashEl.className='flash',1100);}
function addReveal(html){const r=document.createElement('div');r.className='reveal';r.innerHTML=html;stage.querySelector('.card').appendChild(r);unlock();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}}

function renderMenu(){
  view='menu';footer.style.display='none';hintbox.className='hintbox';hintbox.innerHTML='';
  document.getElementById('backBtn').style.display='none';document.getElementById('pbarWrap').style.display='none';
  document.getElementById('kick').className='kick course';document.getElementById('kick').textContent='Calculus, Refreshed';
  document.getElementById('stepLbl').textContent='';
  let html=`<div class="card"><h1>Calculus, Refreshed</h1><p class="lede">A rigorous reactivation of the standard college sequence — Calc 1 through multivariable and vector calculus — for anyone who once knew it and wants it sharp again. Real definitions and theorems, guided discovery, worked problems. (The matrix-calculus view of gradients lives in a separate ML course.)</p></div>`;
  MODULES.forEach((m,i)=>{const done=completed[m.id];const st=done?['done','✓ Done']:(m.ready?['todo','Start']:['soon','Soon']);
    html+=`<div class="card mcard${m.ready?'':' lock'}" data-i="${i}"><div class="mtop"><span class="mnum">Module ${i+1}</span><span class="mstat ${st[0]}">${st[1]}</span></div>
      <div class="mtitle">${m.title}</div><div class="msub">${m.sub}</div></div>`;});
  stage.innerHTML=html;
  stage.querySelectorAll('.mcard').forEach(c=>{const i=parseInt(c.dataset.i);if(MODULES[i].ready)c.onclick=()=>openModule(i);});
  scrollTop();
}
function openModule(i){curM=i;beat=0;view='module';footer.style.display='flex';contBtn.style.display='';hintBtn.style.display='';
  document.getElementById('backBtn').style.display='block';document.getElementById('pbarWrap').style.display='block';
  document.getElementById('kick').className='kick';renderBeat();}
function renderBeat(){
  unlocked=false;contBtn.disabled=true;hintbox.className='hintbox';hintbox.innerHTML='';setHints([]);stage.innerHTML='';
  const M=MODULES[curM];M.beats[beat]();
  document.getElementById('kick').textContent=M.title;
  document.getElementById('stepLbl').textContent=(beat+1)+' / '+M.beats.length;
  document.getElementById('pfill').style.width=Math.round((beat+1)/M.beats.length*100)+'%';
  contBtn.textContent=beat===M.beats.length-1?'Finish':'Continue';document.getElementById('prevBtn').style.display=(beat>0||recallReturn)?'block':'none';scrollTop();
}
hintBtn.onclick=()=>{if(hintIdx<hints.length){hintbox.innerHTML=hints[hintIdx];hintbox.className='hintbox show';hintIdx++;if(hintIdx>=hints.length)unlock();}};
contBtn.onclick=()=>{const M=MODULES[curM];if(beat<M.beats.length-1){beat++;renderBeat();}else finish();};
document.getElementById('backBtn').onclick=renderMenu;
document.getElementById('prevBtn').onclick=()=>{if(recallReturn){curM=recallReturn.mod;beat=recallReturn.beat;recallReturn=null;renderBeat();return;}if(beat>0){beat--;renderBeat();}};
function finish(){const M=MODULES[curM];completed[M.id]=true;const next=(curM+1<MODULES.length&&MODULES[curM+1].ready)?MODULES[curM+1]:null;
  footer.style.display='none';document.getElementById('pfill').style.width='100%';
  stage.innerHTML=`<div class="card" style="text-align:center;padding:30px 18px"><div style="font-size:40px">✦</div><h2 style="margin-top:8px">Module complete</h2><p>${M.outro}</p>
    <div style="display:flex;gap:10px;margin-top:14px">${next?`<button class="btn primary" id="nx">Next →</button>`:''}<button class="btn ghost" id="mn" style="${next?'':'flex:1'}">Back to menu</button></div></div>`;
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>openModule(curM+1);document.getElementById('mn').onclick=renderMenu;scrollTop();}

/* ============ function-plotting engine ============ */
function plot(cv,o){const ctx=cv.getContext&&cv.getContext('2d');const W=cv.width,H=cv.height;
  const xmin=o.xmin,xmax=o.xmax,ymin=o.ymin,ymax=o.ymax;
  const px=x=>(x-xmin)/(xmax-xmin)*W, py=y=>H-(y-ymin)/(ymax-ymin)*H;
  const mx=X=>xmin+X/W*(xmax-xmin), my=Y=>ymin+(H-Y)/H*(ymax-ymin);
  function grid(){if(!ctx)return;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#16202f';ctx.lineWidth=1;
    for(let x=Math.ceil(xmin);x<=xmax;x++){ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),H);ctx.stroke();}
    for(let y=Math.ceil(ymin);y<=ymax;y++){ctx.beginPath();ctx.moveTo(0,py(y));ctx.lineTo(W,py(y));ctx.stroke();}
    ctx.strokeStyle='#2b3a4f';ctx.lineWidth=1.5;
    if(ymin<0&&ymax>0){ctx.beginPath();ctx.moveTo(0,py(0));ctx.lineTo(W,py(0));ctx.stroke();}
    if(xmin<0&&xmax>0){ctx.beginPath();ctx.moveTo(px(0),0);ctx.lineTo(px(0),H);ctx.stroke();}}
  function curve(f,color,lw){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=lw||2.5;let prevY=null,started=false;const span=ymax-ymin;ctx.beginPath();
    const N=500;for(let i=0;i<=N;i++){const x=xmin+(xmax-xmin)*i/N;let y;try{y=f(x);}catch(e){y=NaN;}
      if(!isFinite(y)||y>ymax+span*3||y<ymin-span*3){started=false;prevY=y;continue;}
      if(prevY!=null&&isFinite(prevY)&&Math.abs(y-prevY)>span*1.4){started=false;}
      const X=px(x),Y=py(y);if(!started){ctx.moveTo(X,Y);started=true;}else ctx.lineTo(X,Y);prevY=y;}
    ctx.stroke();}
  function point(x,y,color,r,hollow){if(!ctx)return;ctx.lineWidth=2.5;ctx.strokeStyle=color;
    ctx.beginPath();ctx.arc(px(x),py(y),r||5,0,7);if(hollow){ctx.fillStyle='#0a111b';ctx.fill();ctx.stroke();}else{ctx.fillStyle=color;ctx.fill();}}
  function vline(x,color,dash){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=1.5;if(dash)ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),H);ctx.stroke();ctx.setLineDash([]);}
  function hline(y,color,dash){if(!ctx)return;ctx.strokeStyle=color;ctx.lineWidth=1.5;if(dash)ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,py(y));ctx.lineTo(W,py(y));ctx.stroke();ctx.setLineDash([]);}
  function bandY(y0,y1,color){if(!ctx)return;ctx.fillStyle=color;ctx.fillRect(0,py(y1),W,py(y0)-py(y1));}
  function bandX(x0,x1,color){if(!ctx)return;ctx.fillStyle=color;ctx.fillRect(px(x0),0,px(x1)-px(x0),H);}
  function label(x,y,s,color){if(!ctx)return;ctx.fillStyle=color||'#9fb0c4';ctx.font='600 13px '+getComputedStyle(document.body).fontFamily;ctx.fillText(s,px(x),py(y));}
  return {ctx,W,H,px,py,mx,my,grid,curve,point,vline,hline,bandY,bandX,label,xmin,xmax,ymin,ymax};
}
function xdrag(cv,pl,onX){let dragging=false;cv.style.touchAction='none';
  function set(e){const r=cv.getBoundingClientRect();const X=(e.clientX-r.left)*(cv.width/Math.max(1,r.width));onX(Math.max(pl.xmin,Math.min(pl.xmax,pl.mx(X))));}
  cv.addEventListener('pointerdown',e=>{dragging=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}set(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(dragging){e.preventDefault();set(e);}});
  const end=()=>dragging=false;cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);}
function numChk(host,ans,onok,fmt){const inp=host.querySelector('input'),mo=host.querySelector('.miniout'),btn=host.querySelector('button');
  function go(){const raw=(inp.value||'').trim();const got=(fmt||(s=>parseFloat(s)))(raw);
    let ok=Array.isArray(ans)?(Array.isArray(got)&&ans.every((a,i)=>Math.abs(got[i]-a)<1e-6)):Math.abs(got-ans)<1e-6;
    if(ok){mo.className='miniout ok';mo.textContent='✓ Correct.';flash();inp.disabled=true;btn.style.display='none';onok();}
    else{mo.className='miniout no';mo.textContent='Not yet — check it and try again.';}}
  btn.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
function mcChoices(host,opts,onDone){shuffle(opts);let done=false;host.innerHTML=opts.map((o,i)=>`<div class="choice" data-i="${i}">${o[0]}</div>`).join('');
  host.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{if(done)return;const i=+el.dataset.i,ok=opts[i][1]==='y';
    host.querySelectorAll('.choice').forEach((c,j)=>{c.classList.add('locked');if(opts[j][1]==='y')c.classList.add('correct');else if(j===i)c.classList.add('wrong');else c.classList.add('dim');});done=true;if(ok)flash();onDone(ok);});}

/* ================= RECALL SYSTEM ================= */
const RECALL={
 c1:{title:'Module 1 — Limits & Continuity', cues:[
   {q:'What does <span class="mono">lim<sub>x→a</sub> f(x) = L</span> mean, intuitively and via the ε-δ definition?',

/* ================= MODULE 1 — LIMITS & CONTINUITY ================= */
function c1_intro(){
  stage.innerHTML=`<div class="card"><h2>Calculus is built on one idea: getting arbitrarily close</h2>
    <p>All of calculus rests on two questions, and both are answered by the same tool. <b>How fast is something changing at an instant?</b> (the derivative) and <b>how much accumulates over an interval?</b> (the integral). Neither can be answered by ordinary algebra, because both ask about a process that never quite completes — and that process is the <b>limit</b>.</p>
    <p>Take instantaneous speed. Average speed over an interval is easy: distance ÷ time. But "speed at exactly <span class="mono">t = 2</span>" divides zero distance by zero time. The fix is to compute average speed over shorter and shorter intervals and ask what value it <em>approaches</em>. Same with the slope of a curve at a point: take the slope of a line through two nearby points (a secant), then slide the second point in — the secant slopes approach the <b>tangent</b> slope.</p>
    <div class="eqbox">slope of secant = <sup>f(x) − f(a)</sup>⁄<sub>x − a</sub>&nbsp;&nbsp;→&nbsp;&nbsp;slope of tangent, as x → a</div>
    <p>That arrow "→" is the whole subject in miniature: approach, never arrive, and take the value you're heading toward. This module makes "approach" precise — first intuitively, then with the rigorous <b>ε-δ</b> definition — and defines <b>continuity</b>, the property of having no breaks. Get this right and the derivative and integral become easy; skip it and they stay mysterious.</p></div>`;
  setHints([]);unlock();
}
function c1_intuitive(){
  stage.innerHTML=`<div class="card"><h2>Approaching a value — even where the function isn't defined</h2>
    <p>Here's the key subtlety the limit captures. Consider <span class="mono">f(x) = (x² − 1)/(x − 1)</span>. At <span class="mono">x = 1</span> it's <span class="mono">0/0</span> — <em>undefined</em>. But everywhere else it simplifies: <span class="mono">(x−1)(x+1)/(x−1) = x + 1</span>. So the graph is the line <span class="mono">x + 1</span> with a single <b>hole</b> punched at <span class="mono">x = 1</span>.</p>
    <p>The limit asks not "what is <span class="mono">f(1)</span>?" but "what value does <span class="mono">f(x)</span> approach as <span class="mono">x</span> nears 1?" Drag <span class="cy">x</span> toward 1 from either side and read <span class="mono">f(x)</span>.</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="readout"><div class="rdc"><div class="k">x</div><div class="v" id="xv">—</div></div><div class="rdc"><div class="k">f(x)</div><div class="v" id="fv">—</div></div></div>
    <div class="task"><b>Close in on the hole</b>Drag x to within 0.1 of 1 (from the left or the right) and watch where f is heading.</div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-1,xmax:3,ymin:-1,ymax:4.5});
  const f=x=>x+1;let xc=2.4,done=false;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');pl.point(1,2,'#7ab8ff',6,true);
    pl.vline(xc,'#3a4c66',true);pl.point(xc,f(xc),'#e8b84b',5);
    document.getElementById('xv').textContent=xc.toFixed(3);
    document.getElementById('fv').textContent=Math.abs(xc-1)<1e-9?'undefined':f(xc).toFixed(3);
    if(!done&&Math.abs(xc-1)<0.1&&Math.abs(xc-1)>1e-6){done=true;flash('✓ Heading to 2');
      addReveal(`<div class="rh">✓ The limit is 2, even though f(1) doesn't exist</div><p>From both sides <span class="mono">f(x) → 2</span>. We write <span class="mono">lim<sub>x→1</sub> f(x) = 2</span>. The value <span class="mono">f(1)</span> is irrelevant — the limit only cares about x <em>near</em> 1, never x <em>equal</em> to 1. That's exactly why it can measure instantaneous behavior, which always lands on a 0/0.</p><p>A limit <b>exists</b> only when both one-sided limits agree. It <em>fails</em> to exist when the two sides disagree (a jump), when the function blows up (→ ±∞), or when it oscillates without settling.</p>`);}}
  xdrag(cv,pl,x=>{xc=x;draw();});draw();
  setHints([`Slide the point along the axis until x reads about 0.9 or 1.1. What number is f closing in on?`]);
}
function c1_epsdelta(){
  stage.innerHTML=`<div class="card"><h2>Making "approaches" rigorous: the ε-δ definition</h2>
    <p>"Gets close" is intuition, not mathematics. The rigorous version is a challenge-response game. To claim <span class="mono">lim<sub>x→a</sub> f(x) = L</span> is to guarantee: <em>however close you demand the output be to L, I can force it by keeping the input close enough to a.</em> Formally:</p>
    <div class="eqbox">for every <span class="hl">ε &gt; 0</span> &nbsp;there exists&nbsp; <span class="hl">δ &gt; 0</span> &nbsp;such that&nbsp; 0 &lt; |x − a| &lt; δ &nbsp;⟹&nbsp; |f(x) − L| &lt; ε</div>
    <p>Read it as a game: <b>you</b> pick a tolerance <span class="cy">ε</span> (a horizontal band of half-width ε around L). <b>I</b> must produce a <span class="gld">δ</span> (a vertical band of half-width δ around a) so that the whole curve inside my δ-band lands inside your ε-band. If I can always win, the limit is L.</p>
    <p>Try it on <span class="mono">f(x) = x²</span> at <span class="mono">a = 1</span>, <span class="mono">L = 1</span>. The <span class="cy">ε-band</span> is fixed. Shrink <span class="gld">δ</span> until no part of the curve inside the δ-band pokes outside the ε-band.</p>
    <div class="ctrls"><span class="slabel" id="dl">δ = 0.50</span><input type="range" id="sl" min="4" max="60" value="50"></div>
    <canvas id="cv" width="640" height="360"></canvas>
    <p class="small" id="obs" style="margin-top:8px"></p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:0,xmax:2,ymin:0,ymax:3});
  const f=x=>x*x, a=1, L=1, eps=0.4;const sl=document.getElementById('sl');let done=false;
  function draw(){const del=+sl.value/100;pl.grid();
    pl.bandY(L-eps,L+eps,'rgba(122,184,255,0.12)');pl.bandX(a-del,a+del,'rgba(232,184,75,0.10)');
    pl.hline(L-eps,'#7ab8ff',true);pl.hline(L+eps,'#7ab8ff',true);pl.vline(a-del,'#e8b84b',true);pl.vline(a+del,'#e8b84b',true);
    pl.curve(f,'#d6e0ee');
    // portion of curve inside δ-band that escapes ε-band, drawn red
    const{ctx}=pl;ctx.strokeStyle='#e2664f';ctx.lineWidth=3;ctx.beginPath();let st=false;
    for(let x=a-del;x<=a+del;x+=(2*del)/120){const y=f(x);const bad=Math.abs(y-L)>eps;if(bad){const X=pl.px(x),Y=pl.py(y);if(!st){ctx.moveTo(X,Y);st=true;}else ctx.lineTo(X,Y);}else st=false;}
    ctx.stroke();
    pl.point(a,L,'#7ab8ff',5);
    document.getElementById('dl').textContent='δ = '+del.toFixed(2);
    // check success: max deviation over [a-del,a+del]
    let maxdev=0;for(let x=a-del;x<=a+del;x+=(2*del)/200)maxdev=Math.max(maxdev,Math.abs(f(x)-L));
    const ok=maxdev<=eps+1e-9;
    document.getElementById('obs').innerHTML= ok
      ? '✓ The whole curve inside the δ-band stays within the ε-band — this δ works.'
      : 'The red arcs escape the ε-band — this δ is too big. Shrink it.';
    if(!done&&ok&&del<0.6){done=true;flash('✓ δ found');
      addReveal(`<div class="rh">✓ You won the ε-δ game</div><p>For this ε you found a δ that traps the curve inside the tolerance band. The definition demands you can do this for <em>every</em> ε — and here you can: for <span class="mono">f(x)=x²</span> at 1, choosing <span class="mono">δ = min(1, ε/3)</span> always works (a smaller ε just forces a smaller δ). That "always winnable" guarantee is exactly what <span class="mono">lim<sub>x→1</sub> x² = 1</span> <em>means</em> — no vague "gets close," just a promise you can always keep.</p>`);}}
  sl.addEventListener('input',draw);draw();
  setHints([`Drag the slider left to shrink δ. You're done when the observation line stops mentioning red arcs.`]);
}
function c1_laws(){
  stage.innerHTML=`<div class="card"><h2>The limit laws — and when you can just plug in</h2>
    <p>You rarely run the ε-δ game by hand; instead you use laws that ε-δ <em>justifies</em>. If <span class="mono">lim f</span> and <span class="mono">lim g</span> both exist, then limits pass through the arithmetic:</p>
    <div class="eqbox" style="line-height:2">lim(f + g) = lim f + lim g&nbsp;&nbsp;·&nbsp;&nbsp;lim(f·g) = (lim f)(lim g)<br>lim(c·f) = c·lim f&nbsp;&nbsp;·&nbsp;&nbsp;lim(f/g) = lim f / lim g&nbsp;&nbsp;<span style="color:#5d7186">(if lim g ≠ 0)</span></div>
    <p>The big consequence: for any function built from polynomials, roots, and the usual continuous pieces, <b>the limit is just the value</b> — you substitute. <span class="mono">lim<sub>x→a</sub> f(x) = f(a)</span> whenever f is continuous at a (which polynomials always are). The interesting limits are exactly the ones where substitution <em>fails</em> — the 0/0 cases from the last beat, handled next.</p>
    <div class="task"><b>Substitute</b>Evaluate <span class="mono">lim<sub>x→2</sub> (x² + 3x − 1)</span>.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),9,()=>{addReveal(`<div class="rh">✓ 9</div><p>The expression is a polynomial — continuous everywhere — so the limit is the value: <span class="mono">2² + 3·2 − 1 = 4 + 6 − 1 = 9</span>. No ε-δ needed; the laws (plus "polynomials are continuous") license the plug-in.</p>`);});
  setHints([`It's a polynomial, so lim = value. Put x = 2 into x² + 3x − 1.`,`4 + 6 − 1 = 9.`]);
}
function c1_indet(){
  stage.innerHTML=`<div class="card"><h2>When substitution gives 0/0: the real techniques</h2>
    <p>A <span class="mono">0/0</span> is called an <b>indeterminate form</b> — it doesn't mean "no limit," it means "substitution can't see the answer; do algebra first." Three standard moves:</p>
    <p><b>Factor and cancel.</b> <span class="mono">lim<sub>x→3</sub> (x²−9)/(x−3)</span> → substitution gives 0/0, but <span class="mono">(x−3)(x+3)/(x−3) = x+3</span>, so the limit is <span class="mono">3+3 = 6</span>. The cancellation is valid because the limit ignores <span class="mono">x = 3</span> itself.</p>
    <p><b>Rationalize.</b> For roots, multiply by the conjugate: <span class="mono">lim<sub>x→0</sub> (√(x+1) − 1)/x</span> → multiply top and bottom by <span class="mono">√(x+1)+1</span> to clear the 0/0.</p>
    <p><b>Squeeze theorem.</b> If <span class="mono">g(x) ≤ f(x) ≤ h(x)</span> near a and <span class="mono">g, h</span> both → L, then f is trapped and → L too. This is how you prove the cornerstone limit <span class="mono">lim<sub>x→0</sub> (sin x)/x = 1</span> (also a 0/0), by squeezing sin x/x between cos x and 1.</p>
    <div class="task"><b>Factor and cancel</b>Evaluate <span class="mono">lim<sub>x→4</sub> (x² − 16)/(x − 4)</span>.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),8,()=>{addReveal(`<div class="rh">✓ 8</div><p><span class="mono">(x²−16)/(x−4) = (x−4)(x+4)/(x−4) = x+4</span>, so the limit is <span class="mono">4+4 = 8</span>. The <span class="mono">(x−4)</span> factors cancel because we only care about x <em>near</em> 4, never x = 4 — the very reason the 0/0 was removable.</p>`);});
  setHints([`x²−16 factors as a difference of squares. What cancels with x−4?`,`(x−4)(x+4)/(x−4) = x+4; at x=4 that's 8.`]);
}
function c1_continuity(){
  stage.innerHTML=`<div class="card"><h2>Continuity: the limit equals the value</h2>
    <p>Now that limits are precise, continuity is one clean line. <span class="mono">f</span> is <b>continuous at a</b> when three things hold and line up:</p>
    <div class="eqbox">f(a) exists&nbsp;&nbsp;·&nbsp;&nbsp;lim<sub>x→a</sub> f(x) exists&nbsp;&nbsp;·&nbsp;&nbsp;<span class="hl">lim<sub>x→a</sub> f(x) = f(a)</span></div>
    <p>Intuitively: no hole, no jump, no blow-up — you can draw it through a without lifting the pen. The failures have names, all visible below: a <b>removable</b> discontinuity (a hole — limit exists but ≠ f(a), or f(a) missing), a <b>jump</b> (one-sided limits disagree), and an <b>infinite</b> discontinuity (a vertical asymptote).</p>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="task"><b>Classify</b>At <span class="mono">x = 1</span> the graph has a hole: the curve approaches a value but the point sits elsewhere. Which discontinuity is that?</div>
    <div class="choices" id="ch"></div>
    <p class="small" style="margin-top:12px">Why it matters: continuity is the hypothesis that makes the big theorems run. The <b>Intermediate Value Theorem</b> says a function continuous on <span class="mono">[a,b]</span> hits every value between <span class="mono">f(a)</span> and <span class="mono">f(b)</span> — which is how you guarantee an equation has a root.</p></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-1,xmax:5,ymin:-1,ymax:4});
  pl.grid();
  // removable hole at x=1 on line y=x (approaches 1, point drawn at 2.5)
  pl.curve(x=>(x>=-1&&x<=2)?x:NaN,'#7ab8ff'); pl.point(1,1,'#7ab8ff',6,true); pl.point(1,2.5,'#e8b84b',5);
  // jump at x=3
  pl.curve(x=>(x>2&&x<3)?0.5:NaN,'#7ab8ff'); pl.curve(x=>(x>=3&&x<=5)?2.5:NaN,'#7ab8ff');
  pl.point(3,0.5,'#7ab8ff',5,true); pl.point(3,2.5,'#7ab8ff',5);
  pl.label(0.4,3.5,'hole (x=1)','#e8b84b'); pl.label(3.1,1.3,'jump (x=3)','#8095ab');
  const opts=[['a <span class="cm">removable</span> discontinuity','y'],['a <span class="cm">jump</span> discontinuity','n'],['an <span class="cm">infinite</span> discontinuity','n'],['it\'s actually continuous','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ Removable</div><p>The two-sided limit exists (the curve heads to a single value), but the function's value there is missing or misplaced — a lone hole. It's called <em>removable</em> because redefining that one point patches it into a continuous function. A jump needs the one-sided limits to <em>disagree</em>; an infinite discontinuity needs the function to blow up. Here, only the point is off.</p>`);});
  setHints([`The two sides agree on a value — the curve heads to one place — but the plotted point is elsewhere. That single-point defect has a name.`]);
}
function c1_infinity(){
  stage.innerHTML=`<div class="card"><h2>Limits at infinity and infinite limits</h2>
    <p>Two more flavors, both about unbounded behavior. A <b>limit at infinity</b>, <span class="mono">lim<sub>x→∞</sub> f(x)</span>, asks what f settles toward as x grows without bound — its <b>horizontal asymptote</b>. An <b>infinite limit</b>, like <span class="mono">lim<sub>x→0</sub> 1/x² = ∞</span>, describes a <b>vertical asymptote</b>, where the output blows up.</p>
    <p>For a ratio of polynomials as <span class="mono">x → ∞</span>, only the highest-degree terms matter (divide top and bottom by the largest power of x): equal degrees give the ratio of leading coefficients, a smaller top degree gives 0, a larger top degree diverges.</p>
    <div class="eqbox">lim<sub>x→∞</sub> <sup>3x² + 2x</sup>⁄<sub>x² − 5</sub> = <sup>3</sup>⁄<sub>1</sub> = 3&nbsp;&nbsp;<span style="color:#5d7186">(leading coefficients; the rest vanishes)</span></div>
    <div class="task"><b>End behavior</b>Evaluate <span class="mono">lim<sub>x→∞</sub> (5x² − x)/(2x² + 7)</span>.</div>
    <div class="entry"><input id="ni" inputmode="decimal" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),2.5,()=>{addReveal(`<div class="rh">✓ 5/2 = 2.5</div><p>Same degree top and bottom, so the limit is the ratio of leading coefficients, <span class="mono">5/2</span>. Formally, divide through by <span class="mono">x²</span>: <span class="mono">(5 − 1/x)/(2 + 7/x²) → 5/2</span> as the <span class="mono">1/x</span> terms die. So <span class="mono">y = 2.5</span> is the horizontal asymptote.</p>`);},s=>parseFloat(s));
  setHints([`Same top and bottom degree ⟹ ratio of the leading coefficients.`,`5/2 = 2.5.`]);
}
function c1_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Standard first-course rigor. Work on paper; solutions fold open.</p>

    <div class="prob"><span class="lvl">ε-δ proof</span><div class="ph">Problem 1</div>
    <p>Prove <span class="mono">lim<sub>x→2</sub> (3x − 1) = 5</span> directly from the ε-δ definition (find δ in terms of ε).</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Given ε &gt; 0, we need δ so that <span class="mono">0 &lt; |x−2| &lt; δ ⟹ |(3x−1) − 5| &lt; ε</span>. Simplify the target: <span class="mono">|(3x−1)−5| = |3x−6| = 3|x−2|</span>. So we need <span class="mono">3|x−2| &lt; ε</span>, i.e. <span class="mono">|x−2| &lt; ε/3</span>. Choose <span class="mono">δ = ε/3</span>. Then <span class="mono">|x−2| &lt; δ ⟹ |(3x−1)−5| = 3|x−2| &lt; 3(ε/3) = ε</span>. ∎ (For a line of slope m, δ = ε/|m| always works.)</p></div></details></div>

    <div class="prob"><span class="lvl">squeeze</span><div class="ph">Problem 2</div>
    <p>Evaluate <span class="mono">lim<sub>x→0</sub> x² sin(1/x)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Since <span class="mono">−1 ≤ sin(1/x) ≤ 1</span>, multiplying by <span class="mono">x² ≥ 0</span> gives <span class="mono">−x² ≤ x² sin(1/x) ≤ x²</span>. Both bounds → 0 as x → 0, so by the squeeze theorem the middle → 0. The wild oscillation of <span class="mono">sin(1/x)</span> is crushed by the vanishing amplitude x².</p></div></details></div>

    <div class="prob"><span class="lvl">rationalize</span><div class="ph">Problem 3</div>
    <p>Evaluate <span class="mono">lim<sub>x→4</sub> (√x − 2)/(x − 4)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>0/0 at x=4. Multiply by the conjugate <span class="mono">(√x + 2)/(√x + 2)</span>: numerator becomes <span class="mono">x − 4</span>, giving <span class="mono">(x−4)/[(x−4)(√x+2)] = 1/(√x+2)</span>. Now substitute x=4: <span class="mono">1/(2+2) = 1/4</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">continuity</span><div class="ph">Problem 4</div>
    <p>Find the value of <span class="mono">c</span> that makes <span class="mono">f</span> continuous everywhere, where <span class="mono">f(x) = x + 1</span> for <span class="mono">x ≤ 2</span> and <span class="mono">f(x) = cx²</span> for <span class="mono">x &gt; 2</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Each piece is continuous on its own; the only risk is at the seam x=2. Continuity there needs the one-sided limits to agree with the value: left gives <span class="mono">2+1 = 3</span>, right gives <span class="mono">c·2² = 4c</span>. Set <span class="mono">4c = 3</span> ⟹ <span class="mono">c = 3/4</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">IVT</span><div class="ph">Problem 5</div>
    <p>Show the equation <span class="mono">x³ − x − 1 = 0</span> has a solution in the interval <span class="mono">[1, 2]</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Let <span class="mono">g(x) = x³ − x − 1</span>, a polynomial, hence continuous on [1,2]. Evaluate the ends: <span class="mono">g(1) = 1 − 1 − 1 = −1 &lt; 0</span> and <span class="mono">g(2) = 8 − 2 − 1 = 5 &gt; 0</span>. Since 0 lies between g(1) and g(2), the Intermediate Value Theorem guarantees some <span class="mono">c ∈ (1,2)</span> with <span class="mono">g(c) = 0</span>. (It doesn't tell you where — just that a root exists.)</p></div></details></div>

    <div class="prob"><span class="lvl">limit at infinity</span><div class="ph">Problem 6</div>
    <p>Evaluate <span class="mono">lim<sub>x→∞</sub> (√(x² + x) − x)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>This is ∞ − ∞, indeterminate. Rationalize by the conjugate <span class="mono">(√(x²+x) + x)</span>: the numerator becomes <span class="mono">(x²+x) − x² = x</span>, so the expression is <span class="mono">x / (√(x²+x) + x)</span>. Divide top and bottom by x (using <span class="mono">√(x²+x) = x√(1+1/x)</span> for x&gt;0): <span class="mono">1 / (√(1 + 1/x) + 1) → 1/(1+1) = 1/2</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — ε-δ, quadratic</span><div class="ph">Problem 7</div>
    <p>Prove <span class="mono">lim<sub>x→3</sub> x² = 9</span> from the ε-δ definition.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>We need <span class="mono">|x² − 9| &lt; ε</span> from <span class="mono">|x − 3| &lt; δ</span>. Factor: <span class="mono">|x²−9| = |x−3||x+3|</span>. The <span class="mono">|x−3|</span> we control; we must bound <span class="mono">|x+3|</span>. First restrict δ ≤ 1, so <span class="mono">|x−3| &lt; 1</span> ⟹ <span class="mono">2 &lt; x &lt; 4</span> ⟹ <span class="mono">|x+3| &lt; 7</span>. Then <span class="mono">|x²−9| &lt; 7|x−3|</span>, which is <span class="mono">&lt; ε</span> whenever <span class="mono">|x−3| &lt; ε/7</span>. So choose <span class="mono">δ = min(1, ε/7)</span>: both conditions hold at once, giving <span class="mono">|x²−9| &lt; 7·(ε/7) = ε</span>. ∎ (The "restrict δ first, then bound the extra factor" trick is the standard pattern for nonlinear ε-δ proofs.)</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
function c1_recap(){
  stage.innerHTML=`<div class="card"><h2>What you refreshed</h2>
    <div class="eqbox" style="line-height:1.95">limit = the value f approaches near a (not f(a) itself)<br>ε-δ: ∀ε&gt;0 ∃δ&gt;0, 0&lt;|x−a|&lt;δ ⟹ |f(x)−L|&lt;ε<br>limit laws ⟹ substitute when continuous<br>0/0: factor, rationalize, or squeeze<br>continuous at a ⟺ lim<sub>x→a</sub> f = f(a)&nbsp;·&nbsp;IVT guarantees roots<br>x→∞: compare leading terms → horizontal asymptote</div>
    <p>The limit is the single tool underneath all of calculus. You now have it both intuitively (approach, ignore the endpoint) and rigorously (the ε-δ guarantee), plus continuity and its payoff, the Intermediate Value Theorem.</p>
    <p><b>Next — Module 2:</b> the <b>derivative</b>. It's not a new idea — it's a specific limit, the one from the very first beat: the slope of the secant <span class="mono">(f(x)−f(a))/(x−a)</span> as <span class="mono">x → a</span>. Every differentiation rule you'll refresh is that one limit, computed once and packaged.</p></div>`;
  setHints([]);unlock();
}

/* ================= MODULE 2 — THE DERIVATIVE ================= */
function c2_intro(){
  stage.innerHTML=`<div class="card"><h2>The derivative is one specific limit</h2>
    <p>Module 1 ended on the secant→tangent picture. The <b>derivative</b> just names that limit. The average rate of change of <span class="mono">f</span> from <span class="mono">a</span> to a nearby point is the secant slope; letting the second point slide in gives the instantaneous rate — the tangent slope:</p>
    <div class="eqbox">f′(a) = lim<sub>h→0</sub> <sup>f(a + h) − f(a)</sup>⁄<sub>h</sub>&nbsp;&nbsp;<span style="color:#5d7186">(h = the gap x − a)</span></div>
    <p>That's the entire definition. Everything else — the power rule, product rule, chain rule — is this one limit, computed once for a family of functions and then reused so you never touch the limit again. Watch the secant become the tangent: drag the second point toward <span class="cy">a</span> and read both slopes.</p>
    <canvas id="cv" width="640" height="380"></canvas>
    <div class="readout"><div class="rdc"><div class="k">h</div><div class="v" id="hv">—</div></div><div class="rdc"><div class="k">secant slope</div><div class="v" id="sv">—</div></div><div class="rdc"><div class="k">tangent f′(a)</div><div class="v" id="tv">2.0</div></div></div>
    <div class="task"><b>Slide it in</b>Drag the moving point toward <span class="cy">a = 1</span> and watch the secant slope approach the tangent slope, f′(1) = 2.</div></div>`;
  const cv=document.getElementById('cv');const pl=plot(cv,{xmin:-0.5,xmax:3,ymin:-0.5,ymax:5});
  const f=x=>x*x, a=1;let xh=2.6,done=false;
  function draw(){pl.grid();pl.curve(f,'#7ab8ff');
    const{ctx}=pl;const m=(f(xh)-f(a))/(xh-a);
    // secant line
    ctx.strokeStyle='#e8b84b';ctx.lineWidth=2;ctx.beginPath();
    const y0=f(a)+m*(pl.xmin-a),y1=f(a)+m*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(y0));ctx.lineTo(pl.px(pl.xmax),pl.py(y1));ctx.stroke();
    // tangent (slope 2 at a)
    ctx.strokeStyle='#3fb98f';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();
    const t0=f(a)+2*(pl.xmin-a),t1=f(a)+2*(pl.xmax-a);ctx.moveTo(pl.px(pl.xmin),pl.py(t0));ctx.lineTo(pl.px(pl.xmax),pl.py(t1));ctx.stroke();ctx.setLineDash([]);
    pl.point(a,f(a),'#7ab8ff',5);pl.point(xh,f(xh),'#e8b84b',5);
    document.getElementById('hv').textContent=(xh-a).toFixed(3);
    document.getElementById('sv').textContent=m.toFixed(3);
    if(!done&&Math.abs(xh-a)<0.15&&Math.abs(xh-a)>1e-6){done=true;flash('✓ Secant → tangent');
      addReveal(`<div class="rh">✓ The secant slope → 2, the tangent slope</div><p>As <span class="mono">h → 0</span> the secant collapses onto the tangent (green). For <span class="mono">f(x)=x²</span> the limit computes cleanly: <span class="mono">(  (1+h)² − 1 )/h = (2h + h²)/h = 2 + h → 2</span>. So <span class="mono">f′(1) = 2</span>. Notice we could divide by h only because the limit ignores <span class="mono">h = 0</span> itself — the same "approach, never arrive" that made the 0/0 removable in Module 1.</p>`);}}
  xdrag(cv,pl,x=>{if(Math.abs(x-a)>1e-3)xh=x;draw();});draw();
  setHints([`Drag the gold point left toward a=1. The secant slope in the readout should head toward 2.`]);
}
function c2_notation(){
  stage.innerHTML=`<div class="card"><h2>Two notations for the same object</h2>
    <p>The derivative gets written several ways, and reading papers means recognizing all of them. The two you'll meet most:</p>
    <div class="eqbox" style="line-height:2"><b>Lagrange</b>:&nbsp; f′(x)&nbsp;&nbsp;<span style="color:#5d7186">"f-prime" — compact, good for stating rules</span><br><b>Leibniz</b>:&nbsp; <sup>dy</sup>⁄<sub>dx</sub>&nbsp; or&nbsp; <sup>d</sup>⁄<sub>dx</sub> f(x)&nbsp;&nbsp;<span style="color:#5d7186">"dy dx" — shows the variables, good for chain rule & substitution</span></div>
    <p>They mean exactly the same thing. Lagrange's <span class="mono">f′(x)</span> is terse; Leibniz's <span class="mono">dy/dx</span> makes the input and output explicit, which is why it wins for the chain rule (the pieces visibly "cancel") and for integration later. A value at a point is <span class="mono">f′(a)</span> or <span class="mono">dy/dx|<sub>x=a</sub></span>. (You may also see Newton's <span class="mono">ẏ</span> in physics for time derivatives, and <span class="mono">Df</span> in operator-style texts — same object, different costume.)</p>
    <p>Second derivatives likewise: <span class="mono">f″(x)</span> in Lagrange, <span class="mono">d²y/dx²</span> in Leibniz. We'll use whichever reads best — Lagrange for stating rules, Leibniz when the variables matter — and always mean the same limit from the last beat.</p>
    <div class="task"><b>Match them</b>Which pair below names the <em>same</em> quantity — the derivative of y with respect to x?</div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['<span class="cm">f′(x)</span> and <span class="cm">dy/dx</span>','y'],['<span class="cm">f′(x)</span> and <span class="cm">f(x)dx</span>','n'],['<span class="cm">dy/dx</span> and <span class="cm">Δy/Δx</span> (they\'re identical)','n'],['<span class="cm">f″(x)</span> and <span class="cm">dy/dx</span>','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ f′(x) = dy/dx</div><p>Same object, two notations. Watch the near-miss: <span class="mono">Δy/Δx</span> is the <em>average</em> rate (a secant slope, a genuine ratio); <span class="mono">dy/dx</span> is its <em>limit</em> (the instantaneous rate). Leibniz's notation deliberately echoes the ratio it came from, but the "d"s are not literally a fraction — they're a limit that, conveniently, often behaves like one.</p>`);});
  setHints([`Lagrange's prime and Leibniz's dy/dx are the same derivative. Δy/Δx (deltas) is only the average rate, before the limit.`]);
}
function c2_rules(){
  stage.innerHTML=`<div class="card"><h2>The rules — the limit, precomputed</h2>
    <p>Run the definition once on a whole family and you never run it again. The essential rules:</p>
    <div class="eqbox" style="line-height:2.1"><b>Power:</b>&nbsp; <sup>d</sup>⁄<sub>dx</sub> xⁿ = n xⁿ⁻¹&nbsp;&nbsp;<span style="color:#5d7186">(so x³ → 3x², √x = x<sup>1/2</sup> → ½x<sup>−1/2</sup>)</span><br><b>Constant multiple / sum:</b>&nbsp; (cf)′ = c f′,&nbsp; (f+g)′ = f′ + g′<br><b>Product:</b>&nbsp; (fg)′ = f′g + fg′<br><b>Quotient:</b>&nbsp; (f/g)′ = <sup>f′g − fg′</sup>⁄<sub>g²</sub></div>
    <p>And the standard library, each provable from the definition: <span class="mono">(eˣ)′ = eˣ</span>, <span class="mono">(ln x)′ = 1/x</span>, <span class="mono">(sin x)′ = cos x</span>, <span class="mono">(cos x)′ = −sin x</span>. The power rule alone handles every polynomial — differentiate term by term.</p>
    <div class="task"><b>Differentiate, then evaluate</b>Let <span class="mono">f(x) = x³ − 4x + 7</span>. Compute <span class="mono">f′(2)</span>.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),8,()=>{addReveal(`<div class="rh">✓ 8</div><p>Term by term with the power rule: <span class="mono">f′(x) = 3x² − 4</span>. Then <span class="mono">f′(2) = 3·4 − 4 = 12 − 4 = 8</span> — the slope of the tangent to the curve at x = 2. The constant 7 differentiates to 0 (a flat shift has no slope).</p>`);});
  setHints([`Power rule on each term: d/dx(x³)=3x², d/dx(−4x)=−4, d/dx(7)=0.`,`f′(x)=3x²−4; at x=2, 12−4=8.`]);
}
function c2_chain(){
  stage.innerHTML=`<div class="card"><h2>The chain rule: differentiating a composition</h2>
    <p>The rule that unlocks everything nested. For a composition <span class="mono">f(g(x))</span> — an outer function of an inner one — the derivative is the <b>outer derivative (at the inner) times the inner derivative</b>:</p>
    <div class="eqbox">(f∘g)′(x) = f′(g(x)) · g′(x)&nbsp;&nbsp;&nbsp;<span style="color:#5d7186">Leibniz: <sup>dy</sup>⁄<sub>dx</sub> = <sup>dy</sup>⁄<sub>du</sub> · <sup>du</sup>⁄<sub>dx</sub></span></div>
    <p>The Leibniz form is why this notation earns its keep: the intermediate <span class="mono">du</span> visibly "cancels," making the rule unforgettable. (It's not literally cancellation — it's a theorem — but the notation is designed to look like it.) Read it as: <em>rate of the whole = rate of the outer × rate of the inner</em>, the way gears multiply.</p>
    <p>Example: <span class="mono">(sin(x²))′</span>. Outer <span class="mono">sin</span>, inner <span class="mono">x²</span>. Outer derivative <span class="mono">cos</span> evaluated at the inner: <span class="mono">cos(x²)</span>; times the inner derivative <span class="mono">2x</span>. Result: <span class="mono">2x·cos(x²)</span>.</p>
    <div class="task"><b>Differentiate a composition</b>Let <span class="mono">f(x) = (3x + 1)⁵</span>. Compute <span class="mono">f′(x)</span> and enter <span class="mono">f′(0)</span>.</div>
    <div class="entry"><input id="ni" inputmode="numeric" placeholder="?"><button class="btn primary" style="flex:0 0 auto;padding:12px 18px">Check</button></div><div class="miniout"></div></div>`;
  numChk(stage.querySelector('.card'),15,()=>{addReveal(`<div class="rh">✓ 15</div><p>Outer <span class="mono">u⁵</span> → <span class="mono">5u⁴</span> at <span class="mono">u = 3x+1</span>, times inner derivative <span class="mono">3</span>: <span class="mono">f′(x) = 5(3x+1)⁴ · 3 = 15(3x+1)⁴</span>. At x = 0: <span class="mono">15·(1)⁴ = 15</span>. Forget the <span class="mono">·3</span> (the inner derivative) and you'd get 5 — the single most common chain-rule slip.</p>`);});
  setHints([`Outer is u⁵ (derivative 5u⁴), inner is 3x+1 (derivative 3). Multiply, then set x=0.`,`f′(x)=5(3x+1)⁴·3 = 15(3x+1)⁴; at 0 that's 15.`]);
}
function c2_diffcont(){
  stage.innerHTML=`<div class="card"><h2>Differentiable ⟹ continuous (but not the reverse)</h2>
    <p>One clean theorem links this module to the last. <b>If f is differentiable at a, then f is continuous at a.</b> Intuitively, a curve can't have a well-defined tangent line at a break — a jump or hole leaves no single slope to approach. (Proof sketch: if the limit defining f′(a) exists, then <span class="mono">f(x)−f(a) = <sup>f(x)−f(a)</sup>⁄<sub>x−a</sub>·(x−a) → f′(a)·0 = 0</span>, so <span class="mono">f(x) → f(a)</span> — exactly continuity.)</p>
    <p>The converse <em>fails</em>, and the standard counterexample is <span class="mono">|x|</span> at <span class="mono">0</span>: it's continuous (no break) but has a sharp <b>corner</b> — the slope is −1 coming from the left and +1 from the right, so the two one-sided secant limits disagree and no derivative exists. Continuity is necessary for differentiability but not sufficient; smoothness is the stronger condition.</p>
    <div class="eqbox">differentiable at a&nbsp;⟹&nbsp;continuous at a&nbsp;&nbsp;·&nbsp;&nbsp;continuous&nbsp;⇏&nbsp;differentiable&nbsp;<span style="color:#5d7186">(corners, cusps, vertical tangents)</span></div>
    <div class="task"><b>Where does |x| fail to be differentiable?</b></div>
    <div class="choices" id="ch"></div></div>`;
  const opts=[['at x = 0, where the corner makes the left and right slopes disagree','y'],['nowhere — it\'s a straight line so it\'s smooth','n'],['everywhere, because it\'s not continuous','n'],['only for x &lt; 0','n']];
  mcChoices(document.getElementById('ch'),opts,()=>{addReveal(`<div class="rh">✓ At the corner, x = 0</div><p>Away from 0, <span class="mono">|x|</span> is just <span class="mono">±x</span> — perfectly differentiable (slope ±1). Only at the corner do the one-sided derivatives (−1 and +1) disagree, so the two-sided limit defining f′(0) doesn't exist. The function is continuous there — you can draw through it — but not smooth. Corners, cusps, and vertical tangents are the three ways continuity survives while differentiability dies.</p>`);});
  setHints([`|x| is continuous everywhere, so that's not the issue. Look at the sharp point where the slope suddenly flips from −1 to +1.`]);
}
function c2_problems(){
  stage.innerHTML=`<div class="card"><h2>Problem set</h2>
    <p>Within Modules 1–2. Paper first; solutions fold open.</p>

    <div class="prob"><span class="lvl">from the definition</span><div class="ph">Problem 1</div>
    <p>Using the limit definition (not the power rule), compute <span class="mono">f′(x)</span> for <span class="mono">f(x) = x²</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p><span class="mono">f′(x) = lim<sub>h→0</sub> [(x+h)² − x²]/h = lim<sub>h→0</sub> [x² + 2xh + h² − x²]/h = lim<sub>h→0</sub> (2xh + h²)/h = lim<sub>h→0</sub> (2x + h) = 2x</span>. The h cancels because the limit ignores h = 0, then substitution finishes it. This is the power rule for n=2, derived.</p></div></details></div>

    <div class="prob"><span class="lvl">product rule</span><div class="ph">Problem 2</div>
    <p>Differentiate <span class="mono">f(x) = x² eˣ</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Product rule <span class="mono">(fg)′ = f′g + fg′</span> with <span class="mono">f=x²</span>, <span class="mono">g=eˣ</span>: <span class="mono">f′ = 2x</span>, <span class="mono">g′ = eˣ</span>. So <span class="mono">(x²eˣ)′ = 2x·eˣ + x²·eˣ = eˣ(x² + 2x)</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">quotient rule</span><div class="ph">Problem 3</div>
    <p>Differentiate <span class="mono">f(x) = x / (x² + 1)</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Quotient rule <span class="mono">(f/g)′ = (f′g − fg′)/g²</span> with <span class="mono">f=x</span>, <span class="mono">g=x²+1</span>: <span class="mono">f′=1</span>, <span class="mono">g′=2x</span>. Numerator <span class="mono">1·(x²+1) − x·2x = x²+1 − 2x² = 1 − x²</span>. So <span class="mono">f′(x) = (1 − x²)/(x² + 1)²</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">chain rule</span><div class="ph">Problem 4</div>
    <p>Differentiate <span class="mono">f(x) = e<sup>3x²</sup></span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Outer <span class="mono">eᵘ</span> (derivative <span class="mono">eᵘ</span>) at <span class="mono">u = 3x²</span>, times inner derivative <span class="mono">6x</span>: <span class="mono">f′(x) = e<sup>3x²</sup> · 6x = 6x e<sup>3x²</sup></span>.</p></div></details></div>

    <div class="prob"><span class="lvl">nested chain</span><div class="ph">Problem 5</div>
    <p>Differentiate <span class="mono">f(x) = sin(cos(x))</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Outer <span class="mono">sin</span> (derivative <span class="mono">cos</span>) at the inner <span class="mono">cos(x)</span>, times the inner derivative <span class="mono">(cos x)′ = −sin x</span>: <span class="mono">f′(x) = cos(cos(x)) · (−sin x) = −sin(x) cos(cos(x))</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">tangent line</span><div class="ph">Problem 6</div>
    <p>Find the equation of the tangent line to <span class="mono">y = x³</span> at <span class="mono">x = 2</span>.</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Point: <span class="mono">(2, 8)</span>. Slope: <span class="mono">y′ = 3x²</span>, so <span class="mono">y′(2) = 12</span>. Point-slope: <span class="mono">y − 8 = 12(x − 2)</span>, i.e. <span class="mono">y = 12x − 16</span>.</p></div></details></div>

    <div class="prob"><span class="lvl">challenge — non-differentiability</span><div class="ph">Problem 7</div>
    <p>Show that <span class="mono">f(x) = x^(1/3)</span> (the cube root) is continuous at 0 but not differentiable there. What does the graph do at 0?</p>
    <details><summary>Show solution</summary><div class="sol">
    <p>Continuous: <span class="mono">lim<sub>x→0</sub> x^(1/3) = 0 = f(0)</span> ✓. Differentiability: <span class="mono">f′(x) = ⅓x^(−2/3) = 1/(3 x^(2/3))</span>, which → +∞ as x → 0. The difference quotient <span class="mono">(x^(1/3) − 0)/(x − 0) = x^(−2/3) → ∞</span>, so no finite derivative exists. Geometrically the tangent is <b>vertical</b> at 0 — a vertical tangent, the third way (after corners and cusps) that a continuous function fails to be differentiable.</p></div></details></div>
  </div>`;
  setHints([]);unlock();
}
function c2_recap(){
  stage.innerHTML=`<div class="card"><h2>What you refreshed</h2>
    <div class="eqbox" style="line-height:1.95">f′(a) = lim<sub>h→0</sub> [f(a+h) − f(a)]/h&nbsp;&nbsp;<span style="color:#5d7186">the one definition</span><br>notations: f′(x) = dy/dx&nbsp;&nbsp;(Lagrange = Leibniz)<br>power / product / quotient rules&nbsp;·&nbsp;standard library<br>chain rule: (f∘g)′ = f′(g)·g′ = (dy/du)(du/dx)<br>differentiable ⟹ continuous&nbsp;·&nbsp;continuous ⇏ differentiable</div>
    <p>The derivative is the secant→tangent limit from Module 1, computed once per function family and packaged into rules. The chain rule composes those packages; differentiability is a strictly stronger condition than continuity.</p>
    <p><b>Next — Module 3:</b> what the derivative is <em>for</em>. A zero derivative marks flat spots (maxima, minima); its sign tells you where a function rises or falls; the Mean Value Theorem connects average and instantaneous rates; and setting up and solving <b>optimization</b> problems is the whole payoff.</p></div>`;
  setHints([]);unlock();
}
